<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meeting AI 大容量動画テスト</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090b10;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:980px;margin:auto;padding:14px}.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.card{background:#151922;border:1px solid #2a3140;border-radius:16px;padding:14px;margin-top:12px}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:700;background:#2f6fed;color:#fff}.btn:disabled{opacity:.4}.ghost{background:#262c38}.danger{background:#b53b46}input[type=password]{background:#0d1118;color:#fff;border:1px solid #384154;border-radius:10px;padding:10px;min-width:260px}.muted{color:#9ca7b8}.big{font-size:22px;font-weight:800}.progress{height:12px;background:#252b36;border-radius:99px;overflow:hidden;margin:10px 0}.bar{height:100%;width:0;background:#4f8cff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}video{width:100%;max-height:260px;background:#000;border-radius:12px}.log{white-space:pre-wrap;font:13px ui-monospace,SFMono-Regular,Menlo,monospace;max-height:230px;overflow:auto;background:#0b0e14;padding:10px;border-radius:10px}.transcript{max-height:330px;overflow:auto;line-height:1.55}.seg{padding:8px 0;border-bottom:1px solid #252b36}.time{color:#7f8ba0;font-size:12px}.ok{color:#6ee7a8}.warn{color:#ffd166}.err{color:#ff7b86}</style>
</head><body><div class="wrap">
<div class="top"><div class="big">🎬 Meeting AI 大容量動画テスト</div><span class="muted">iPad Safari向け・元動画はOpenAIへ送信しません</span></div>
<div class="card">
  <div class="top"><input id="file" type="file" accept="video/*,audio/*"><input id="key" type="password" placeholder="OpenAI API key"><button id="saveKey" class="btn ghost">キー保存</button></div>
  <div id="meta" class="muted" style="margin-top:10px">動画を選択してください。</div>
</div>
<div class="grid">
  <div class="card"><video id="media" controls playsinline></video><div class="top" style="margin-top:10px"><button id="prepare" class="btn">🎧 音声を分割準備</button><button id="stop" class="btn danger" disabled>停止</button></div><p class="muted">大きい動画はブラウザ内で再生しながら音声だけを録音し、約8分ごとに小分けします。変換中は音をスピーカーへ出しません。処理時間は動画の長さとほぼ同じです。</p></div>
  <div class="card"><b id="status">待機中</b><div class="progress"><div id="bar" class="bar"></div></div><div id="detail" class="muted">—</div><div id="log" class="log"></div></div>
</div>
<div class="card"><div class="top"><button id="transcribe" class="btn" disabled>🤖 分割音声を文字起こし</button><button id="clear" class="btn ghost">結果クリア</button></div><div id="result" class="transcript"><span class="muted">文字起こし結果がここに表示されます。</span></div></div>
</div>
<script>
const $=id=>document.getElementById(id); const file=$('file'), media=$('media'), key=$('key');
let selected=null, chunks=[], ctx=null, src=null, dest=null, rec=null, stopped=false, chunkStart=0;
key.value=localStorage.getItem('meeting_ai_key')||'';
$('saveKey').onclick=()=>{localStorage.setItem('meeting_ai_key',key.value.trim()); log('APIキーをこのブラウザに保存しました。')};
function log(s,c=''){const d=document.createElement('div');d.textContent=s;if(c)d.className=c;$('log').appendChild(d);$('log').scrollTop=999999}
function fmt(s){if(!isFinite(s))return '--:--';s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function size(n){return n<1e6?(n/1e3).toFixed(1)+' KB':n<1e9?(n/1e6).toFixed(1)+' MB':(n/1e9).toFixed(2)+' GB'}
file.onchange=()=>{selected=file.files[0];chunks=[];$('transcribe').disabled=true;if(!selected)return;if(media.src)URL.revokeObjectURL(media.src);media.src=URL.createObjectURL(selected);media.onloadedmetadata=()=>{$('meta').textContent=`${selected.name} • ${size(selected.size)} • ${fmt(media.duration)} (${Math.round(media.duration/60)}分)`;log(`選択: ${selected.name} / ${size(selected.size)} / ${fmt(media.duration)}`)}};
async function setupAudio(){ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();src=ctx.createMediaElementSource(media);dest=ctx.createMediaStreamDestination();src.connect(dest);/* speakerへは接続しない */}
function bestMime(){for(const m of ['audio/mp4','audio/webm;codecs=opus','audio/webm'])if(window.MediaRecorder&&MediaRecorder.isTypeSupported(m))return m;return ''}
$('prepare').onclick=async()=>{if(!selected)return alert('動画を選択してください。');if(!window.MediaRecorder)return alert('このSafariではMediaRecorderが使えません。');try{stopped=false;chunks=[];$('prepare').disabled=true;$('stop').disabled=false;$('transcribe').disabled=true;$('status').textContent='🎧 音声を分割準備中';$('result').innerHTML='<span class="muted">準備中…</span>';await setupAudio();media.currentTime=0;media.controls=false;const mime=bestMime();log('録音形式: '+(mime||'browser default'));await media.play();startRecorder(mime);tick();}catch(e){fail(e)}};
function startRecorder(mime){const parts=[];rec=new MediaRecorder(dest.stream,mime?{mimeType:mime}:undefined);chunkStart=media.currentTime;rec.ondataavailable=e=>{if(e.data.size)parts.push(e.data)};rec.onstop=()=>{if(parts.length){const blob=new Blob(parts,{type:rec.mimeType||parts[0].type});chunks.push({blob,start:chunkStart,end:media.currentTime});log(`分割 ${chunks.length}: ${fmt(chunkStart)}–${fmt(media.currentTime)} / ${size(blob.size)}`,'ok')}if(!stopped && !media.ended){startRecorder(mime)}else finishPrepare()};rec.start(1000)}
function tick(){if(stopped)return;const p=media.duration?media.currentTime/media.duration:0;$('bar').style.width=(p*100).toFixed(1)+'%';$('detail').textContent=`${fmt(media.currentTime)} / ${fmt(media.duration)} • ${chunks.length}個作成済み`;if(rec&&rec.state==='recording'&&media.currentTime-chunkStart>=480){rec.stop()}if(media.ended){stopped=true;if(rec&&rec.state==='recording')rec.stop();return}requestAnimationFrame(tick)}
$('stop').onclick=()=>{stopped=true;media.pause();if(rec&&rec.state==='recording')rec.stop();else finishPrepare()};
function finishPrepare(){media.controls=true;$('prepare').disabled=false;$('stop').disabled=true;if(ctx){ctx.close().catch(()=>{});ctx=null}if(chunks.length){$('status').textContent='✅ 分割準備完了';$('detail').textContent=`${chunks.length}個の音声チャンク • 合計 ${size(chunks.reduce((a,c)=>a+c.blob.size,0))}`;$('transcribe').disabled=false;log('音声分割が完了しました。','ok')}else{$('status').textContent='停止';}}
async function transcribeBlob(c,i){const k=key.value.trim();if(!k)throw new Error('OpenAI APIキーを入力してください。');const ext=(c.blob.type.includes('mp4')?'m4a':'webm');const fd=new FormData();fd.append('file',c.blob,`meeting_${String(i+1).padStart(3,'0')}.${ext}`);fd.append('model','gpt-4o-transcribe');fd.append('response_format','json');const r=await fetch('https://api.openai.com/v1/audio/transcriptions',{method:'POST',headers:{Authorization:`Bearer ${k}`},body:fd});if(!r.ok)throw new Error(`OpenAI ${r.status}: ${await r.text()}`);return r.json()}
$('transcribe').onclick=async()=>{try{$('transcribe').disabled=true;$('result').innerHTML='';$('status').textContent='🤖 文字起こし中';let all=[];for(let i=0;i<chunks.length;i++){$('detail').textContent=`${i+1} / ${chunks.length} を解析中`;log(`OpenAIへ音声 ${i+1}/${chunks.length} を送信…`);const d=await transcribeBlob(chunks[i],i);const text=(d.text||'').trim();all.push({start:chunks[i].start,end:chunks[i].end,text});const div=document.createElement('div');div.className='seg';div.innerHTML=`<div class="time">${fmt(chunks[i].start)}–${fmt(chunks[i].end)}</div><div></div>`;div.lastChild.textContent=text;$('result').appendChild(div);$('bar').style.width=(((i+1)/chunks.length)*100).toFixed(1)+'%'}localStorage.setItem('meeting_ai_large_test_'+selected.name+'_'+selected.size+'_'+selected.lastModified,JSON.stringify(all));$('status').textContent='✅ 文字起こし完了';$('detail').textContent='解析結果をこのブラウザに保存しました。';log('文字起こし完了。','ok')}catch(e){fail(e)}finally{$('transcribe').disabled=false}};
$('clear').onclick=()=>{$('result').innerHTML='<span class="muted">文字起こし結果がここに表示されます。</span>'};
function fail(e){console.error(e);$('status').textContent='❌ エラー';$('detail').textContent=e.message||String(e);log(e.message||String(e),'err');$('prepare').disabled=false;$('stop').disabled=true;media.controls=true}
</script></body></html>
