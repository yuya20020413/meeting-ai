<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meeting AI - Video Practice</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:#0b0e14;color:#eef2ff}header{position:sticky;top:0;z-index:5;background:#111725;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #293247}button,.file{background:#202a3c;color:#fff;border:1px solid #3b4863;border-radius:9px;padding:9px 12px;font-weight:700}button:disabled{opacity:.45}.file input{display:none}.grow{flex:1}.status{font-size:13px;color:#aab7cf}.grid{display:grid;grid-template-columns:58% 42%;height:calc(100vh - 66px)}.left,.right{padding:10px;overflow:auto}.left{border-right:1px solid #293247}.card{background:#121927;border:1px solid #293247;border-radius:12px;padding:10px;margin-bottom:10px}.title{font-weight:800;margin-bottom:7px}.media{background:#000;min-height:260px;display:grid;place-items:center;border-radius:10px;overflow:hidden}video{width:100%;max-height:46vh;background:#000}.controls{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}.text{white-space:pre-wrap;line-height:1.5}.muted{color:#91a0ba}.jp{color:#d8e4ff}.item{padding:8px 0;border-bottom:1px solid #273147}.item:last-child{border:0}.q{font-weight:750}.answer{margin-top:5px;color:#b8f1cf}@media(max-width:800px){.grid{grid-template-columns:1fr;height:auto}.left{border-right:0}.media{min-height:200px}}
</style></head>
<body>
<header><b>🎬 Meeting AI / 動画練習</b><span class="grow"></span><label class="file">🎬 元動画<input id="videoFile" type="file" accept="video/*"></label><label class="file">🎧 解析用音声<input id="audioFile" type="file" accept="audio/*"></label><button id="keyBtn">🔑 API Key</button><button id="analyzeBtn" disabled>🤖 音声解析</button><span id="status" class="status">動画と音声を選択してください</span></header>
<div class="grid"><main class="left">
<div class="card"><div class="title">元動画（ローカル再生・アップロードしません）</div><div class="media"><video id="video" controls playsinline></video></div><div class="controls"><button data-skip="-10">↩︎10秒</button><button id="playBtn">▶︎ / ⏸</button><button data-skip="10">10秒↪︎</button><select id="rate"><option>.75</option><option selected>1</option><option>1.25</option><option>1.5</option></select><span id="clock" class="muted">00:00 / 00:00</span></div></div>
<div class="card"><div class="title">English</div><div id="en" class="text muted">解析後、動画の再生位置に合わせて表示します。</div></div>
<div class="card"><div class="title">日本語</div><div id="jp" class="text jp muted">日本語訳</div></div>
</main><aside class="right">
<div class="card"><div class="title">現在の話題</div><div id="topic" class="text muted">—</div></div>
<div class="card"><div class="title">🔴 質問予測 / 🟢 こちらから質問</div><div id="ai" class="text muted">解析後、再生済みの内容だけを使って表示します。</div></div>
<div class="card"><div class="title">仕組み</div><div class="text muted">元動画は端末内で再生するだけです。AIには小さい音声ファイルだけを送ります。動画から音声を分離する待ち時間はありません。</div></div>
</aside></div>
<script>
const $=id=>document.getElementById(id), video=$('video'), statusEl=$('status');let audio=null, segments=[], translated=[], lastBucket=-1;
function key(){return localStorage.getItem('meeting_ai_key')||''}function setStatus(s){statusEl.textContent=s}function fmt(s){s=Math.max(0,Math.floor(s||0));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
$('keyBtn').onclick=()=>{const v=prompt('OpenAI API Keyを入力してください。端末内に保存します。',key()?'（保存済み）':'');if(v&&v.startsWith('sk-')){localStorage.setItem('meeting_ai_key',v.trim());setStatus('API Keyを保存しました')}};
$('videoFile').onchange=e=>{const f=e.target.files[0];if(!f)return;video.src=URL.createObjectURL(f);setStatus('元動画を読み込みました。解析用音声も選択してください。');ready()};
$('audioFile').onchange=e=>{audio=e.target.files[0]||null;setStatus(audio?'解析用音声を選択しました。':'解析用音声を選択してください');ready()};
function ready(){$('analyzeBtn').disabled=!audio}
$('playBtn').onclick=()=>video.paused?video.play():video.pause();document.querySelectorAll('[data-skip]').forEach(b=>b.onclick=()=>video.currentTime=Math.max(0,Math.min(video.duration||0,video.currentTime+Number(b.dataset.skip))));$('rate').onchange=e=>video.playbackRate=Number(e.target.value);
video.ontimeupdate=()=>{$('clock').textContent=`${fmt(video.currentTime)} / ${fmt(video.duration)}`;renderAt(video.currentTime);const b=Math.floor(video.currentTime/20);if(segments.length&&b!==lastBucket){lastBucket=b;updateAI(video.currentTime)}};
async function apiJSON(url,opt){const r=await fetch(url,opt);const t=await r.text();if(!r.ok)throw new Error(t);return JSON.parse(t)}
$('analyzeBtn').onclick=async()=>{if(!audio)return;if(!key()){alert('先にAPI Keyを設定してください');return}try{$('analyzeBtn').disabled=true;setStatus('音声を文字起こし中…');const fd=new FormData();fd.append('file',audio);fd.append('model','whisper-1');fd.append('response_format','verbose_json');fd.append('timestamp_granularities[]','segment');const tr=await apiJSON('https://api.openai.com/v1/audio/transcriptions',{method:'POST',headers:{Authorization:`Bearer ${key()}`},body:fd});segments=(tr.segments||[]).map(x=>({start:x.start||0,end:x.end||x.start||0,text:(x.text||'').trim()}));if(!segments.length&&tr.text)segments=[{start:0,end:video.duration||99999,text:tr.text}];setStatus('日本語訳を作成中…');await translateAll();setStatus(`解析完了：${segments.length} セグメント。動画を再生してください。`);renderAt(video.currentTime);await updateAI(video.currentTime)}catch(e){console.error(e);setStatus('解析エラー');alert('解析に失敗しました。音声ファイルのサイズ/形式とAPI Keyを確認してください。')}finally{$('analyzeBtn').disabled=false}};
async function translateAll(){translated=[];const batch=35;for(let i=0;i<segments.length;i+=batch){const part=segments.slice(i,i+batch);const body={model:'gpt-5-mini',input:[{role:'system',content:[{type:'input_text',text:'Translate each English meeting segment into natural concise Japanese. Return JSON only: {"translations":["..."]}. Preserve order and count.'}]},{role:'user',content:[{type:'input_text',text:JSON.stringify(part.map(x=>x.text))}]}],text:{format:{type:'json_object'}}};const d=await apiJSON('https://api.openai.com/v1/responses',{method:'POST',headers:{Authorization:`Bearer ${key()}`,'Content-Type':'application/json'},body:JSON.stringify(body)});let out='';for(const o of d.output||[])for(const c of o.content||[])if(c.type==='output_text')out+=c.text;let arr=[];try{arr=JSON.parse(out).translations||[]}catch{};part.forEach((s,j)=>translated.push({...s,jp:arr[j]||''}));setStatus(`翻訳中… ${Math.min(i+batch,segments.length)}/${segments.length}`)}}
function renderAt(t){if(!translated.length)return;const shown=translated.filter(x=>x.start<=t);const tail=shown.slice(-10);$('en').classList.remove('muted');$('jp').classList.remove('muted');$('en').textContent=tail.map(x=>x.text).join('\n');$('jp').textContent=tail.map(x=>x.jp).join('\n')}
async function updateAI(t){const ctx=translated.filter(x=>x.start<=t).slice(-18);if(!ctx.length||!key())return;try{const prompt=`You are assisting a Japanese application engineer during meeting practice. Use ONLY the transcript already heard below. Never invent experience, customer feedback, test results or plans. Predict a question another participant may ask the user and provide a safe simple English answer. Also suggest one useful question the user can ask. Return JSON only with keys current_topic, incoming:{question_jp,question_en,answer_en,answer_jp}, outgoing:{question_jp,question_en}. Transcript:\n${ctx.map(x=>x.text).join('\n')}`;const body={model:'gpt-5-mini',input:prompt,text:{format:{type:'json_object'}}};const d=await apiJSON('https://api.openai.com/v1/responses',{method:'POST',headers:{Authorization:`Bearer ${key()}`,'Content-Type':'application/json'},body:JSON.stringify(body)});let out='';for(const o of d.output||[])for(const c of o.content||[])if(c.type==='output_text')out+=c.text;const j=JSON.parse(out);$('topic').textContent=j.current_topic||'—';$('ai').innerHTML='';const inc=j.incoming||{}, og=j.outgoing||{};const a=document.createElement('div');a.className='item';a.innerHTML=`<div class="q">🔴 ${esc(inc.question_jp||'')}</div><div>${esc(inc.question_en||'')}</div><div class="answer">答え: ${esc(inc.answer_en||'')}</div><div>${esc(inc.answer_jp||'')}</div>`;const b=document.createElement('div');b.className='item';b.innerHTML=`<div class="q">🟢 ${esc(og.question_jp||'')}</div><div>${esc(og.question_en||'')}</div>`;$('ai').append(a,b)}catch(e){console.error(e)}}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
</script></body></html>
