<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meeting AI Gemini + R&B v10.1</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0e15;color:#eef4ff}
button,.file,select{background:#1d293b;color:#fff;border:1px solid #3a4a64;border-radius:8px;padding:7px 9px;font-weight:700}
button.active{background:#315f9b;border-color:#73a8ee}.file input{display:none}
header{height:54px;display:flex;gap:6px;align-items:center;padding:6px 8px;background:#101827;border-bottom:1px solid #29364c}
.grow{flex:1}.status{font-size:11px;color:#aab8cf}.ok{color:#6ee7a0}
.topic{height:32px;padding:6px 10px;background:#151e2e;border-bottom:1px solid #29364c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{height:calc(100vh - 86px);display:grid;grid-template-columns:58% 42%;grid-template-rows:48% 24% 28%}
.panel{min-width:0;min-height:0;border-right:1px solid #29364c;border-bottom:1px solid #29364c;overflow:hidden}
.videoPanel{display:flex;flex-direction:column;background:#000}
video{width:100%;height:100%;object-fit:contain;min-height:0}
.videoWrap{flex:1;min-height:0;display:grid;place-items:center;overflow:hidden}
.controls{padding:3px 6px;display:flex;gap:4px;align-items:center;background:#0d1420;overflow-x:auto}.controls button,.controls select{padding:4px 6px;font-size:11px;white-space:nowrap}
.seek{width:100%;height:18px;accent-color:#66a3ff}.seekrow{padding:2px 8px;background:#0d1420}
.clock{font-size:12px;color:#aab8cf;min-width:94px}
.transPanel{padding:6px;background:#0d1420;display:flex;flex-direction:column;grid-column:1/3;grid-row:2}
.agendaPanel{padding:6px;background:#0d1420;display:flex;flex-direction:column;grid-column:2;grid-row:1}
.videoPanel{grid-column:1;grid-row:1}
.transHead{display:flex;align-items:center;gap:5px;margin-bottom:5px;font-size:12px}
.transcript{flex:1;min-height:0;overflow:auto;border:1px solid #28364d;border-radius:8px;background:#101827}
.line{display:grid;grid-template-columns:64px 1fr 1fr;border-bottom:1px solid #253248;cursor:pointer}
.line.current{background:#1a2941;box-shadow:inset 4px 0 #ffd54a}.speaker{padding:8px 5px;font-size:12px;font-weight:900}
.en,.jp{padding:8px;font-size:15px;line-height:1.42}.en{font-size:17px;font-weight:650;border-left:1px solid #253248;border-right:1px solid #253248}.jp{color:#d9e5f7}
.spoken{color:#ffd54a}.spokenJP{color:#7ee787}.dim{opacity:.56}.hiddenText{filter:blur(7px);user-select:none}.tiny{font-size:11px;color:#9badc7}
.practice{grid-column:1/3;grid-row:3;padding:7px;background:#0d1420;display:flex;flex-direction:column}
.tabs{display:flex;gap:4px;overflow-x:auto;white-space:nowrap;padding-bottom:5px}.tabs button{padding:5px 8px;font-size:12px}
.practiceBody{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:7px}
.card{min-height:0;overflow:auto;background:#101827;border:1px solid #28364d;border-radius:9px;padding:9px}
.big{font-size:18px;line-height:1.5}.jpbig{font-size:16px;line-height:1.5;color:#dbe7fb}.accent{color:#ffd54a;font-weight:800}
textarea{width:100%;height:88px;background:#09101a;color:#fff;border:1px solid #3a4a64;border-radius:8px;padding:8px;font-size:16px;resize:none}
.diffGood{color:#7ee787}.diffBad{color:#ff8585;text-decoration:underline}.speakerDot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.agendaHead{display:flex;align-items:center;font-size:12px}.agenda{min-height:0;overflow:auto;border:1px solid #28364d;border-radius:8px;background:#101827}.agendaItem{padding:7px;border-bottom:1px solid #253248;cursor:pointer;font-size:12px;display:grid;grid-template-columns:52px 1fr;gap:5px}.agendaItem.current{background:#243a59;box-shadow:inset 4px 0 #ffd54a}.agendaItem.done{opacity:.52}.agendaTitle{font-weight:800}.agendaTime{color:#9badc7}
.s0{color:#72a7ff}.s1{color:#ff9f7a}.s2{color:#7ee787}.s3{color:#d59cff}.s4{color:#ffd36a}.s5{color:#72e0e8}.s6{color:#ff83c6}.s7{color:#b9d67b}.s8{color:#c5a3ff}
@media(orientation:portrait){
 header{height:78px;flex-wrap:wrap}.topic{height:30px}
 main{height:calc(100vh - 108px);grid-template-columns:62% 38%;grid-template-rows:38% 28% 34%}
 .videoPanel{grid-column:1;grid-row:1}
 .videoWrap{display:flex;justify-content:flex-start;align-items:center}
 video{object-position:left center}
 .agendaPanel{grid-column:2;grid-row:1}
 .transPanel{grid-column:1/3;grid-row:2}
 .practice{grid-column:1/3;grid-row:3}
 .line{grid-template-columns:54px 1fr 1fr}
 .en{font-size:15px}.jp{font-size:13px}.practiceBody{grid-template-columns:1fr 1fr}.big{font-size:15px}.jpbig{font-size:14px}
 .controls button,.controls select{padding:3px 5px;font-size:10px}
}

.studyHelp{display:flex;flex-direction:column;gap:6px;height:100%;overflow:auto;padding:6px}
.studyCard{background:#121c2a;border:1px solid #26364c;border-radius:8px;padding:7px}
.studyCard b{color:#8bd5ff}
.studyCard .meaning{color:#d9e5f2;margin-top:2px}
.studyCard .example{color:#aebdcd;font-size:.9em;margin-top:3px}
.studyEmpty{color:#8290a0;padding:8px}
</style>
</head>
<body>
<header>
<b>🎬 Meeting AI Study v16</b><span class="grow"></span>
<label class="file">🎬 動画<input id="videoFile" type="file" accept="video/*"></label>
<label class="file">📚 練習JSON<input id="jsonFile" type="file" accept=".json,application/json"></label>
<span id="status" class="status">動画＋練習JSONを選択（API不要）</span>
</header>
<div class="topic"><b>現在：</b><span id="nowInfo">—</span></div>
<main>
<section class="panel videoPanel">
 <div class="videoWrap"><video id="video" playsinline preload="metadata"></video></div>
 <div class="seekrow"><input id="seek" class="seek" type="range" min="0" max="1000" value="0"></div>
 <div class="controls">
  <button data-skip="-10">↩10秒</button><button id="play">▶︎/⏸</button><button data-skip="10">10秒↪</button>
  <button id="repeat">🔁 発言</button>
  <button id="syncNow">📍ここに同期</button>
  <button id="syncMinus">−1秒</button><button id="syncPlus">＋1秒</button>
  <button id="syncReset">同期解除</button>
  <select id="rate"><option>.75</option><option>.85</option><option selected>1</option><option>1.15</option><option>1.25</option></select>
  <span id="clock" class="clock">00:00 / 00:00</span>
 </div>
</section>
<section class="panel agendaPanel">
 <div class="agendaHead"><b>📋 動画概要・アジェンダ</b><span class="grow"></span><span class="tiny">タップで移動</span></div>
 <div id="agenda" class="agenda"></div>
</section>
<section class="panel transPanel">
 <div class="transHead"><b>English（左） ｜ 重要単語・構文（右）</b><span class="tiny">発言をタップ→その区間へ移動</span><span class="grow"></span><button id="toggleJP">日本語 ON</button></div>
 <div id="transcript" class="transcript"></div>
</section>
<section class="panel practice">
 <div class="tabs" id="tabs">
  <button data-mode="listen" class="active">1 Listening</button><button data-mode="qa">💬 質問・発言</button><button data-mode="shadow">2 Shadowing</button>
  <button data-mode="dictation">3 Dictation</button><button data-mode="check">4 Check</button>
  <button data-mode="overlap">5 Overlap</button><button data-mode="shadow2">6 Shadowing</button>
  <button data-mode="interpret">7 通訳</button><button data-mode="repeat">8 Repeating</button>
  <button data-mode="custom">9 Customize</button>
 </div>
 <div class="practiceBody"><div id="pLeft" class="card"></div><div id="pRight" class="card"></div></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id),v=$('video');
let items=[], translations=[], agenda=[], current=0, mode='listen', showJP=true, repeatSegment=false, videoURL='', syncOffset=+(localStorage.getItem('meeting_ai_v10_sync_offset')||0);
const speakerMap=new Map();
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmt(s){s=Math.max(0,Math.floor(+s||0));let h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`}
function sec(t){let a=t.split(':').map(Number);return a.length===3?a[0]*3600+a[1]*60+a[2]:a[0]*60+a[1]}
function status(s,ok=false){$('status').textContent=s;$('status').className='status '+(ok?'ok':'')}
function spClass(sp){if(!speakerMap.has(sp))speakerMap.set(sp,speakerMap.size%9);return 's'+speakerMap.get(sp)}
function parseTxt(text){
 const a=[]; for(const raw of text.split(/\r?\n/)){const line=raw.trim();if(!line)continue;
 const m=line.match(/^\[(\d{2}:\d{2}:\d{2})\]\s*([^:：]+)[:：]\s*(.+)$/); if(!m)continue;
 a.push({start:sec(m[1]),time:m[1],speaker:m[2].trim(),english:m[3].trim(),japanese:''});}
 for(let i=0;i<a.length;i++)a[i].end=a[i+1]?.start??a[i].start+12; return a;
}
function loadTranslations(obj){
 const arr=Array.isArray(obj)?obj:(obj.items||[]);
 for(const x of arr){
  let idx=-1;
  if(x.time) idx=items.findIndex(y=>y.time===x.time && (!x.speaker||y.speaker===x.speaker));
  if(idx<0 && Number.isFinite(+x.start)) idx=items.findIndex(y=>Math.abs(y.start-(+x.start))<.6);
  if(idx>=0) items[idx].japanese=x.japanese||x.jp||x.translation||'';
 }
}
$('videoFile').onchange=e=>{let f=e.target.files?.[0];if(!f)return;if(videoURL)URL.revokeObjectURL(videoURL);videoURL=URL.createObjectURL(f);v.src=videoURL;status('動画OK。練習JSONを選択してください。')};
$('jsonFile').onchange=e=>{let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{
 const obj=JSON.parse(r.result),arr=Array.isArray(obj)?obj:(obj.items||obj.practice||[]);
 items=arr.map(x=>{const c=x.context||{},tm=x.time||x.timestamp||'';return {time:tm,start:Number.isFinite(+x.start)?+x.start:sec(tm||'00:00:00'),end:Number.isFinite(+x.end)?+x.end:null,speaker:x.speaker||c.speaker||'話者',english:x.english||c.utterance||'',japanese:x.japanese||x.jp||x.translation||'',topic:x.topic||'',incoming:x.incoming||null,outgoing:x.outgoing||null}});
 for(let i=0;i<items.length;i++)if(!Number.isFinite(items[i].end))items[i].end=items[i+1]?.start??items[i].start+12;
 agenda=Array.isArray(obj.agenda)?obj.agenda.map(a=>({start:Number.isFinite(+a.start)?+a.start:sec(a.time||a.timestamp||'00:00:00'),title:a.title||a.topic||''})):items.filter(x=>x.topic).map(x=>({start:x.start,title:x.topic}));
 current=0;renderTranscript(true);renderPractice();renderAgenda();refreshLearningPane();status(`英語学習JSON OK：${items.length}ポイント`,true);
}catch(err){status('練習JSONエラー: '+err.message)}};r.readAsText(f,'UTF-8')};
function idxAt(t){if(!items.length)return 0;t-=syncOffset;let lo=0,hi=items.length-1,ans=0;while(lo<=hi){let mid=(lo+hi)>>1;if(items[mid].start<=t){ans=mid;lo=mid+1}else hi=mid-1}return ans}
function progress(it){return Math.max(0,Math.min(1,((v.currentTime-syncOffset)-it.start)/Math.max(.1,it.end-it.start)))}
function wordHighlight(text,p,cls){let parts=String(text||'').split(/(\s+)/),words=parts.filter(x=>x.trim()).length,n=Math.max(1,Math.ceil(words*p)),c=0;return parts.map(x=>!x.trim()?esc(x):(++c<=n?`<span class="${cls}">${esc(x)}</span>`:esc(x))).join('')}

function activeAgendaIndex(){
  if(!agenda.length)return -1;
  const t=v.currentTime-syncOffset;let ai=0;
  for(let i=0;i<agenda.length;i++)if((agenda[i].start||0)<=t)ai=i;
  return ai;
}
function agendaLearning(a){
  if(!a)return {vocabulary:[],patterns:[]};
  let vocabulary=a.vocabulary||a.words||a.keywords||[];
  let patterns=a.patterns||a.structures||a.grammar||[];
  if(!Array.isArray(vocabulary))vocabulary=[];
  if(!Array.isArray(patterns))patterns=[];
  return {vocabulary,patterns};
}
function fmtLearn(x,kind){
  if(typeof x==='string')return `<div class="studyCard"><b>${esc(x)}</b></div>`;
  const en=x.english||x.word||x.phrase||x.pattern||x.expression||'';
  const jp=x.japanese||x.meaning||x.jp||x.translation||'';
  const ex=x.example||x.example_en||'';
  return `<div class="studyCard"><b>${kind==='p'?'構文':'単語・表現'}：${esc(en)}</b>${jp?`<div class="meaning">${esc(jp)}</div>`:''}${ex?`<div class="example">${esc(ex)}</div>`:''}</div>`;
}
function learningHTML(){
  const ai=activeAgendaIndex(),a=agenda[ai],d=agendaLearning(a);
  if(!d.vocabulary.length&&!d.patterns.length)return `<div class="studyEmpty">このアジェンダの重要単語・構文はJSONにまだありません。次回の練習JSON作成時に agenda[].vocabulary / patterns を入れると表示されます。</div>`;
  return `<div class="studyHelp">${d.vocabulary.map(x=>fmtLearn(x,'v')).join('')}${d.patterns.map(x=>fmtLearn(x,'p')).join('')}</div>`;
}
function renderTranscript(force=false){
 if(!items.length)return; let idx=idxAt(v.currentTime); if(idx!==current){current=idx;renderPractice()}
 let from=Math.max(0,current-3),to=Math.min(items.length,current+5);
 $('transcript').innerHTML=items.slice(from,to).map((x,k)=>{let i=from+k,cur=i===current,c=spClass(x.speaker),jp=x.japanese||'（翻訳JSON未読込）';
 return `<div class="line ${cur?'current':''}" data-i="${i}"><div class="speaker ${c}"><span class="speakerDot" style="background:currentColor"></span>${esc(x.speaker)}<br><span class="tiny">${fmt(x.start)}</span></div><div class="en">${cur?wordHighlight(x.english,progress(x),'spoken'):esc(x.english)}</div><div class="jp ${showJP?'':'hiddenText'}">${cur&&x.japanese?wordHighlight(jp,progress(x),'spokenJP'):esc(jp)}</div></div>`}).join('');
 document.querySelectorAll('.line').forEach(el=>el.onclick=()=>{current=+el.dataset.i;v.currentTime=items[current].start+syncOffset;renderTranscript();renderPractice()});
 let it=items[current];$('nowInfo').innerHTML=`<span class="${spClass(it.speaker)}">${esc(it.speaker)}</span>　${fmt(it.start)}　${it.topic?'<b>'+esc(it.topic)+'</b> — ':''}${esc(it.english.slice(0,70))}`;renderAgenda();refreshLearningPane();
 let el=document.querySelector('.line.current');if(force&&el)el.scrollIntoView({block:'center'});
}
function segmentButtons(){
 return `<div style="margin-top:8px"><button onclick="playSegment()">▶ この発言</button> <button onclick="play3()">🔁 3回</button> <button onclick="slower()">0.85×</button></div>`;
}
function asFirst(v){return Array.isArray(v)?(v[0]||{}):(v||{})}
function incomingBlock(x){const q=asFirst(x.incoming);if(!q.question_en&&!q.question_jp)return '<p class="jpbig">このポイントには質問予測がありません。</p>';return `<b class="accent">🔴 質問予測</b><p class="jpbig">${esc(q.question_jp||'')}</p><p class="big">${esc(q.question_en||'')}</p><hr><b>答え例</b><p class="big">${esc(q.answer_en||'')}</p><p class="jpbig">${esc(q.answer_jp||'')}</p>`}
function outgoingBlock(x){const q=asFirst(x.outgoing);if(!q.question_en&&!q.question_jp)return '<p class="jpbig">このポイントには発言支援がありません。</p>';return `<b class="accent">🟢 発言支援・こちらから質問</b><p class="jpbig">${esc(q.question_jp||'')}</p><p class="big">${esc(q.question_en||'')}</p>`}

function refreshLearningPane(){
  const candidates=[...document.querySelectorAll('.jp,.japanese,.translation,[data-role="japanese"]')];
  if(candidates.length){
    const cur=candidates[current]||candidates[0];
    candidates.forEach((el,i)=>{if(i===current)el.innerHTML=learningHTML()});
  }
}
function renderAgenda(){const box=$('agenda');if(!box)return;if(!agenda.length){box.innerHTML='<div class="tiny" style="padding:8px">アジェンダなし</div>';return}const t=v.currentTime-syncOffset;let ai=0;for(let i=0;i<agenda.length;i++)if(agenda[i].start<=t)ai=i;box.innerHTML=agenda.map((a,i)=>`<div class="agendaItem ${i===ai?'current':i<ai?'done':''}" data-a="${i}"><span class="agendaTime">${fmt(a.start)}</span><span class="agendaTitle">${esc(a.title)}</span></div>`).join('');box.querySelectorAll('.agendaItem').forEach(el=>el.onclick=()=>{const a=agenda[+el.dataset.a];v.currentTime=a.start+syncOffset;renderTranscript(true);renderAgenda()});box.querySelector('.agendaItem.current')?.scrollIntoView({block:'nearest'})}
function renderPractice(){
 if(!items.length){$('pLeft').innerHTML='練習JSONを読み込んでください。';$('pRight').innerHTML='';return}
 const x=items[current],en=esc(x.english),jp=esc(x.japanese||'翻訳JSONを読み込むと日本語が表示されます。'),who=`<span class="${spClass(x.speaker)}">${esc(x.speaker)}</span> ${fmt(x.start)}`;
 if(mode==='listen'){$('pLeft').innerHTML=`<b>🎧 Listening</b><p>${who}</p><div class="big hiddenText">${en}</div>${segmentButtons()}`;$('pRight').innerHTML=`<b>文字を見ずに聞く</b><p class="jpbig">まず音だけで内容をつかみます。聞こえた音・強弱・リズムに集中。</p>`}
 else if(mode==='qa'){$('pLeft').innerHTML=incomingBlock(x);$('pRight').innerHTML=outgoingBlock(x)}
 else if(mode==='shadow'||mode==='shadow2'){$('pLeft').innerHTML=`<b>🗣 Shadowing</b><p>${who}</p><div class="big ${mode==='shadow'?'hiddenText':''}">${en}</div>${segmentButtons()}`;$('pRight').innerHTML=`<b>${mode==='shadow'?'文字を見ず、少し遅れて発声':'仕上げシャドウイング'}</b><p class="jpbig">${mode==='shadow'?'意味より音を優先。':'意味を意識しすぎず、音とリズムを忠実に再生。'}</p>`}
 else if(mode==='dictation'){$('pLeft').innerHTML=`<b>⌨️ Dictation</b><p>${who}</p><textarea id="dict" placeholder="聞こえた英語を入力"></textarea>${segmentButtons()} <button onclick="checkDict()">答え合わせ</button>`;$('pRight').innerHTML=`<b>結果</b><div id="dictResult" class="big tiny">入力後「答え合わせ」</div>`}
 else if(mode==='check'){$('pLeft').innerHTML=`<b>👀 Check</b><p>${who}</p><div class="big">${en}</div>${segmentButtons()}`;$('pRight').innerHTML=`<b>日本語</b><div class="jpbig">${jp}</div><p class="tiny">語順のまま意味のかたまりを確認します。</p>`}
 else if(mode==='overlap'){$('pLeft').innerHTML=`<b>🎙 Overlapping</b><p>${who}</p><div class="big">${en}</div>${segmentButtons()}`;$('pRight').innerHTML=`<b>音声と同時に読む</b><p class="jpbig">話者と同じタイミングで発声。強弱・連結・脱落・リズムを合わせます。</p>`}
 else if(mode==='interpret'){$('pLeft').innerHTML=`<b>🇯🇵→🇬🇧 通訳練習</b><p>${who}</p><div class="jpbig">${jp}</div><div style="margin-top:8px"><button onclick="showAnswer()">英語を表示</button> <button onclick="playSegment()">原音</button></div>`;$('pRight').innerHTML=`<b>英語を言ってから確認</b><div id="answer" class="big hiddenText">${en}</div>`}
 else if(mode==='repeat'){$('pLeft').innerHTML=`<b>🔁 Repeating</b><p>${who}</p><div class="big">${en}</div><div style="margin-top:8px"><button onclick="repeatPause()">▶ 再生→自動停止</button></div>`;$('pRight').innerHTML=`<b>音声が止まったら全文を再生</b><p class="jpbig">英文を見ないで言えるまで繰り返します。</p>`}
 else if(mode==='custom'){let key='rb_custom_'+current,val=localStorage.getItem(key)||'';$('pLeft').innerHTML=`<b>✍️ Customize</b><p>原文</p><div class="big">${en}</div>`;$('pRight').innerHTML=`<b>自分が会議で使う英文</b><textarea id="customText" placeholder="自分用の英文">${esc(val)}</textarea><br><button onclick="saveCustom()">保存</button>`}
}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x===b));renderPractice()});
window.playSegment=()=>{if(!items.length)return;repeatSegment=false;v.currentTime=items[current].start+syncOffset;v.play()};
window.play3=async()=>{if(!items.length)return;let n=0;repeatSegment=true;v.currentTime=items[current].start+syncOffset;v.play();v.dataset.repeatCount='3'};
window.slower=()=>{v.playbackRate=.85;$('rate').value='.85';playSegment()};
window.showAnswer=()=>{$('answer')?.classList.remove('hiddenText')};
window.checkDict=()=>{let inp=$('dict')?.value||'',target=items[current].english;let norm=s=>s.toLowerCase().replace(/[^\p{L}\p{N}' ]/gu,'').replace(/\s+/g,' ').trim();let a=norm(inp).split(' '),b=norm(target).split(' ');let same=a.filter((w,i)=>w===b[i]).length,score=Math.round(100*same/Math.max(1,b.length));$('dictResult').innerHTML=`一致度 <b class="${score>=80?'diffGood':'diffBad'}">${score}%</b><hr>${esc(target)}`};
window.repeatPause=()=>{repeatSegment=false;v.currentTime=items[current].start+syncOffset;v.play();v.dataset.pauseAtEnd='1'};
window.saveCustom=()=>{localStorage.setItem('rb_custom_'+current,$('customText').value);status('カスタマイズ英文を保存しました',true)};
$('play').onclick=()=>v.paused?v.play():v.pause();
document.querySelectorAll('[data-skip]').forEach(b=>b.onclick=()=>v.currentTime=Math.max(0,Math.min(v.duration||Infinity,v.currentTime+(+b.dataset.skip))));
$('rate').onchange=e=>v.playbackRate=+e.target.value;
$('repeat').onclick=()=>{repeatSegment=!repeatSegment;$('repeat').classList.toggle('active',repeatSegment)};
$('toggleJP').onclick=()=>{showJP=!showJP;$('toggleJP').textContent='日本語 '+(showJP?'ON':'OFF');renderTranscript()};

function saveSync(){
 localStorage.setItem('meeting_ai_v10_sync_offset',String(syncOffset));
 status(`手動同期 ${syncOffset>=0?'+':''}${syncOffset.toFixed(1)}秒`,true);
 renderTranscript(true);renderPractice();
}
$('syncNow').onclick=()=>{
 if(!items.length)return;
 // Current video time is declared to be the start of the selected/current transcript utterance.
 syncOffset=v.currentTime-items[current].start;
 saveSync();
};
$('syncMinus').onclick=()=>{syncOffset-=1;saveSync()};
$('syncPlus').onclick=()=>{syncOffset+=1;saveSync()};
$('syncReset').onclick=()=>{syncOffset=0;localStorage.removeItem('meeting_ai_v10_sync_offset');saveSync()};
$('seek').oninput=e=>{if(v.duration)v.currentTime=(+e.target.value/1000)*v.duration};
v.ontimeupdate=()=>{if(v.duration){$('seek').value=Math.round(v.currentTime/v.duration*1000);$('clock').textContent=`${fmt(v.currentTime)} / ${fmt(v.duration)}`}
 if(items.length){let x=items[current];if(v.currentTime>=x.end+syncOffset-.04){
   if(v.dataset.pauseAtEnd==='1'){delete v.dataset.pauseAtEnd;v.pause();v.currentTime=x.end+syncOffset-.05}
   else if(v.dataset.repeatCount){let n=+v.dataset.repeatCount-1;if(n>0){v.dataset.repeatCount=String(n);v.currentTime=x.start+syncOffset}else{delete v.dataset.repeatCount;v.pause()}}
   else if(repeatSegment)v.currentTime=x.start+syncOffset;
 } renderTranscript();renderAgenda();refreshLearningPane();}
};
v.onloadedmetadata=()=>{$('clock').textContent=`00:00 / ${fmt(v.duration)}`};
renderPractice();
</script>
</body></html>
