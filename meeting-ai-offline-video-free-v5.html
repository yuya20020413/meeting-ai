<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meeting AI - Free Local Video Practice</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0e14;color:#eef2ff}header{height:50px;background:#111725;border-bottom:1px solid #293247;padding:6px 8px;display:flex;gap:5px;align-items:center}button,.file,select{background:#202a3c;color:#fff;border:1px solid #3b4863;border-radius:8px;padding:7px 8px;font-weight:700}.file input{display:none}.grow{flex:1}.status{font-size:11px;color:#aab7cf}.live{color:#65d18a}.warn{color:#ffcf70}.topicbar{height:36px;padding:7px 10px;background:#161e2d;border-bottom:1px solid #293247;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.main{height:calc(100vh - 86px);display:grid;grid-template-columns:50% 50%;grid-template-rows:62% 38%}.panel{min-width:0;min-height:0;padding:7px;border-right:1px solid #293247;border-bottom:1px solid #293247;overflow:hidden}.title{font-weight:800;font-size:13px;margin-bottom:5px}.videoPanel{display:flex;flex-direction:column}.media{flex:1;min-height:0;background:#000;border-radius:8px;display:grid;place-items:center;overflow:hidden}video{width:100%;height:100%;object-fit:contain}.controls{height:38px;display:flex;gap:5px;align-items:center;margin-top:5px}.controls button,.controls select{padding:5px 8px}.muted{color:#91a0ba}.pairs{height:calc(100% - 20px);overflow:auto;background:#111827;border:1px solid #283349;border-radius:8px}.row{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #283349}.cell{padding:7px;font-size:13px;line-height:1.35}.cell:first-child{border-right:1px solid #283349}.jp{color:#d8e4ff}.pred{height:calc(100% - 20px);overflow:auto;font-size:13px;line-height:1.3;background:#111827;border:1px solid #283349;border-radius:8px;padding:8px}.q{font-weight:800;margin-bottom:4px}.answer{color:#b8f1cf;margin-top:6px}.hidden{display:none}@media (orientation:portrait){header{height:88px;flex-wrap:wrap;align-content:center}.topicbar{height:36px}.main{height:calc(100vh - 124px);display:grid;grid-template-columns:50% 50%;grid-template-rows:38% 34% 28%}.videoPanel{grid-column:1/3;grid-row:1}.translationPanel{grid-column:1/3;grid-row:2}.incomingPanel{grid-column:1;grid-row:3}.outgoingPanel{grid-column:2;grid-row:3}.row{grid-template-columns:1fr 1fr}.media{min-height:0}}
</style></head><body>
<header><b>🎬 Meeting AI</b><span class="grow"></span><label class="file">🎬 動画<input id="videoFile" type="file" accept="video/*,audio/*"></label><button id="prepareBtn">✨ 無料で練習データ作成</button><button id="saveBtn" disabled>💾 JSON保存</button><span id="status" class="status">OpenAI不要・端末内処理</span></header>
<div class="topicbar"><b>📌 現在の話題</b> <span id="topic" class="muted">動画を選択してください</span></div>
<div class="main">
<section class="panel videoPanel"><div class="title">🎬 動画</div><div class="media"><video id="video" controls playsinline></video></div><div class="controls"><button data-skip="-10">↩︎10秒</button><button id="playBtn">▶︎/⏸</button><button data-skip="10">10秒↪︎</button><select id="rate"><option>.75</option><option selected>1</option><option>1.25</option><option>1.5</option></select><span id="clock" class="muted">00:00 / 00:00</span></div></section>
<section class="panel translationPanel"><div class="title">🌐 English / 練習用表示 <span id="sync" class="muted"></span></div><div id="pairs" class="pairs"><div class="row"><div class="cell muted"><b>English</b></div><div class="cell jp muted"><b>Dictation</b></div></div></div></section>
<section class="panel incomingPanel"><div class="title">🔴 聞き取り練習</div><div id="incoming" class="pred muted">文字起こし後、現在位置の英文を穴埋め問題にします。</div></section>
<section class="panel outgoingPanel"><div class="title">🟢 発話練習</div><div id="outgoing" class="pred muted">英文を短く区切ってシャドーイング用に表示します。</div></section>
</div>
<script type="module">
const $=id=>document.getElementById(id),video=$('video'),statusEl=$('status');let units=[],file=null,transcriber=null;
const setStatus=s=>statusEl.textContent=s;const fmt=s=>{s=Math.max(0,Math.floor(s||0));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
$('videoFile').onchange=e=>{file=e.target.files?.[0];if(!file)return;video.src=URL.createObjectURL(file);units=[];$('saveBtn').disabled=true;setStatus('✅ 動画OK。「無料で練習データ作成」を押してください');$('topic').textContent=file.name};
$('playBtn').onclick=()=>video.paused?video.play():video.pause();document.querySelectorAll('[data-skip]').forEach(b=>b.onclick=()=>video.currentTime=Math.max(0,Math.min(video.duration||0,video.currentTime+Number(b.dataset.skip))));$('rate').onchange=e=>video.playbackRate=Number(e.target.value);
async function loadModel(){if(transcriber)return transcriber;setStatus('⏳ 初回のみ無料AIモデルを読み込み中…');const {pipeline,env}=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2');env.allowLocalModels=false;transcriber=await pipeline('automatic-speech-recognition','onnx-community/whisper-tiny.en',{dtype:'q8'});return transcriber}
async function decodeTo16k(f){setStatus('⏳ 動画の音声を端末内で展開中…');const ab=await f.arrayBuffer();const ac=new (window.AudioContext||window.webkitAudioContext)({sampleRate:16000});let buf=await ac.decodeAudioData(ab.slice(0));let mono=new Float32Array(buf.length);for(let c=0;c<buf.numberOfChannels;c++){const d=buf.getChannelData(c);for(let i=0;i<d.length;i++)mono[i]+=d[i]/buf.numberOfChannels}if(buf.sampleRate===16000){await ac.close();return mono}const ratio=buf.sampleRate/16000,out=new Float32Array(Math.floor(mono.length/ratio));for(let i=0;i<out.length;i++)out[i]=mono[Math.floor(i*ratio)];await ac.close();return out}
function makeCloze(s){const w=s.split(/\s+/);return w.map((x,i)=>(i%5===3&&x.length>3)?'_____':x).join(' ')}
function buildUnits(chunks){return chunks.map((c,i)=>({i,start:c.timestamp?.[0]??i*5,end:c.timestamp?.[1]??((i+1)*5),text:(c.text||'').trim(),cloze:makeCloze((c.text||'').trim())})).filter(x=>x.text)}
$('prepareBtn').onclick=async()=>{if(!file){alert('先に動画を選択してください');return}try{const audio=await decodeTo16k(file);const pipe=await loadModel();setStatus('⏳ 端末内AIで英語を文字起こし中…（動画が長いほど時間がかかります）');const out=await pipe(audio,{chunk_length_s:30,stride_length_s:5,return_timestamps:true,language:'en',task:'transcribe'});units=buildUnits(out.chunks||[{text:out.text,timestamp:[0,video.duration||0]}]);if(!units.length)throw Error('文字起こし結果が空です');$('saveBtn').disabled=false;setStatus(`✅ 完成：${units.length}区間。OpenAI API使用なし`);renderAt(0)}catch(e){console.error(e);setStatus('❌ '+(String(e.message||e).includes('decode')?'この動画形式の音声をSafariで直接展開できません。MP3/M4Aなら処理しやすいです。':String(e.message||e).slice(0,140)))} };
function indexAt(t){let i=units.findIndex(x=>t<(x.end??Infinity));return i<0?Math.max(0,units.length-1):i}function renderAt(t){if(!units.length)return;const idx=indexAt(t),tail=units.slice(Math.max(0,idx-3),idx+1),u=units[idx];$('pairs').innerHTML='<div class="row"><div class="cell muted"><b>English</b></div><div class="cell jp muted"><b>Dictation</b></div></div>'+tail.map(x=>`<div class="row"><div class="cell">${esc(x.text)}</div><div class="cell jp">${esc(x.cloze)}</div></div>`).join('');$('topic').textContent=`${fmt(u.start)}–${fmt(u.end)} / Listening Practice`;$('incoming').innerHTML=`<div class="q">聞こえた英文を完成させる</div><div>${esc(u.cloze)}</div><div class="answer">正解：${esc(u.text)}</div>`;$('outgoing').innerHTML=`<div class="q">Shadowing</div><div>${esc(u.text)}</div><div class="answer">この区間を再生して、0.75× → 1×で追いかけて発音</div>`;$('sync').textContent='（端末内データ）'}
video.ontimeupdate=()=>{$('clock').textContent=`${fmt(video.currentTime)} / ${fmt(video.duration)}`;renderAt(video.currentTime)};video.onseeked=()=>renderAt(video.currentTime);
$('saveBtn').onclick=()=>{const data={version:1,source:file?.name||'',created:new Date().toISOString(),mode:'local-free-whisper-tiny-en',units};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(file?.name||'meeting').replace(/\.[^.]+$/,'')+'_practice.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></body></html>
