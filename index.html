<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Meeting AI</title>

<style>

:root{
 --gap:6px;
 --bg:#0b0f14;
 --panel:#141b24;
 --line:#293342;
 --text:#f3f6fa;
 --muted:#aeb8c6;
 --blue:#78a9ff;
 --green:#65d18a;
 --red:#ff8585;
 --yellow:#ffd36a;
}

*{box-sizing:border-box}

html,body{
 margin:0;
 width:100%;
 height:100%;
 background:var(--bg);
 color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 overflow:hidden;
}

#app{
 height:100%;
 display:grid;
 grid-template-rows:58px 1fr;
 gap:var(--gap);
 padding:var(--gap);
}


/* =========================
 HEADER
========================= */

header{
 display:flex;
 align-items:center;
 gap:6px;
 background:var(--panel);
 border:1px solid var(--line);
 border-radius:10px;
 padding:5px 8px;
 min-width:0;
}

header strong{
 font-size:14px;
 white-space:nowrap;
}

input{
 width:100px;
 border:1px solid var(--line);
 background:#0e141c;
 color:white;
 border-radius:7px;
 padding:6px;
 font-size:11px;
}

.chip{
 height:38px;
 display:flex;
 align-items:center;
 border:1px solid var(--line);
 border-radius:8px;
 padding:0 7px;
 background:#0e141c;
 white-space:nowrap;
 font-size:11px;
}

#timer{
 font-variant-numeric:tabular-nums;
}

#questionAlert{
 display:none;
 color:#ffb2b2;
 border-color:#7b3434;
}

#nextSpeak{
 flex:1;
 min-width:120px;
 max-width:330px;
 display:block;
 padding:4px 8px;
 cursor:pointer;
}

#nextSpeak .small{
 font-size:9px;
 color:var(--muted);
}

#nextSpeakText{
 margin-top:2px;
 font-size:13px;
 font-weight:750;
 color:#8fbdff;
 overflow:hidden;
 white-space:nowrap;
 text-overflow:ellipsis;
}

button{
 border:1px solid var(--line);
 background:#202a37;
 color:white;
 border-radius:8px;
 padding:6px 8px;
 font-size:11px;
 white-space:nowrap;
}

.primary{background:#245db8}
.stop{background:#713333}
.camera{background:#256b4b}
.save{background:#594c27}

button:disabled{
 opacity:.45;
}


/* =========================
 MAIN
========================= */

main{
 min-height:0;
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:var(--gap);
}

.left{
 min-height:0;
 display:grid;
 grid-template-rows:1fr 1fr;
 gap:var(--gap);
}

.right{
 min-height:0;
 display:grid;
 grid-template-rows:32fr 68fr;
 gap:var(--gap);
}

.panel{
 min-height:0;
 background:var(--panel);
 border:1px solid var(--line);
 border-radius:10px;
 overflow:hidden;
 display:flex;
 flex-direction:column;
}

.title{
 flex:none;
 border-bottom:1px solid var(--line);
 padding:6px 9px;
 font-size:13px;
 font-weight:700;
}

.content{
 flex:1;
 min-height:0;
 padding:7px 9px;
 overflow-y:auto;
 overflow-x:hidden;
 -webkit-overflow-scrolling:touch;
}


/* =========================
 TRANSCRIPT
========================= */

#raw{
 white-space:pre-wrap;
 font-size:16px;
 line-height:1.35;
}

#translation{
 font-size:18px;
 line-height:1.35;
}

.translation-line{
 margin:0 0 4px;
}


/* =========================
 SUMMARY
========================= */

.topic{
 padding:4px 0 5px;
 border-bottom:1px solid #27313d;
}

.topic-title{
 font-size:15px;
 font-weight:750;
 color:#d9e7ff;
}

.topic-description{
 font-size:13px;
 line-height:1.25;
 color:#e0e5ec;
}


/* =========================
 PREDICTION
========================= */

#prediction{
 padding:5px 7px;
}

.prediction-card{
 margin:0 0 4px;
 padding:5px 7px;
 background:#101720;
 border-left:3px solid var(--blue);
 border-radius:4px;
}

.prediction-card.high{
 border-left-color:var(--red);
}

.prediction-card.medium{
 border-left-color:var(--yellow);
}

.prediction-card.low{
 border-left-color:var(--green);
}

.pred-top{
 display:flex;
 align-items:center;
 gap:5px;
 line-height:1.1;
}

.number{
 font-size:12px;
 font-weight:800;
}

.chance{
 font-size:11px;
 font-weight:700;
 color:var(--muted);
}

.question-jp{
 font-size:13px;
 font-weight:700;
 color:white;
}

.answer{
 margin-top:2px;
 font-size:17px;
 line-height:1.16;
 font-weight:750;
 color:#c9dcff;
}

.answer-jp{
 margin-top:1px;
 font-size:12px;
 line-height:1.15;
 color:var(--muted);
}

.muted{
 color:var(--muted);
}


/* =========================
 CAMERA WINDOW
========================= */

#cameraWindow{
 position:fixed;
 right:12px;
 top:72px;

 width:310px;

 background:#080c11;
 border:1px solid #46627f;
 border-radius:10px;

 z-index:100;

 display:none;

 box-shadow:0 5px 30px rgba(0,0,0,.55);
}

.camera-title{
 height:30px;
 display:flex;
 align-items:center;
 gap:6px;

 padding:0 8px;

 border-bottom:1px solid var(--line);

 font-size:11px;
 font-weight:700;
}

#cameraStatus{
 margin-left:auto;
 color:var(--green);
 font-size:10px;
}

#cameraVideo{
 width:100%;
 display:block;
 background:black;
 max-height:180px;
 object-fit:cover;
}

#slideInfo{
 padding:6px 8px;
 font-size:11px;
 line-height:1.3;
 max-height:85px;
 overflow:auto;
}

#slideTitle{
 color:#8fbdff;
 font-weight:750;
 margin-bottom:2px;
}


/* hidden canvas */

#captureCanvas{
 display:none;
}


@media(max-width:1000px){

 header strong{
  font-size:12px;
 }

 input{
  width:75px;
 }

 .chip{
  padding:0 5px;
 }

 #nextSpeak{
  max-width:250px;
 }

 button{
  padding:6px;
 }

 #cameraWindow{
  width:270px;
 }

}

</style>
</head>

待機
</span>

</div>

></video>

資料を待っています

<script>

/* =========================
 ELEMENTS
========================= */

const $ =
 id =>
 document.getElementById(id);


const rawEl =
 $("raw");

const translationEl =
 $("translation");

const summaryEl =
 $("summary");

const predictionEl =
 $("prediction");

const keyEl =
 $("apiKey");

const startBtn =
 $("start");

const stopBtn =
 $("stop");

const finishBtn =
 $("finish");

const timerEl =
 $("timer");

const questionAlert =
 $("questionAlert");

const nextSpeak =
 $("nextSpeak");

const nextSpeakText =
 $("nextSpeakText");


/* camera */

const cameraBtn =
 $("cameraBtn");

const cameraWindow =
 $("cameraWindow");

const cameraVideo =
 $("cameraVideo");

const cameraStatus =
 $("cameraStatus");

const slideTitleEl =
 $("slideTitle");

const slideDescriptionEl =
 $("slideDescription");

const captureCanvas =
 $("captureCanvas");


/* =========================
 VARIABLES
========================= */

let recognition =
 null;

let running =
 false;

let transcript =
 "";

let interimText =
 "";

let pendingEnglish =
 [];

let translating =
 false;

let analyzing =
 false;

let analysisTimer =
 null;

let topicHistory =
 [];

let currentTopicTitle =
 "";

let lastPredictionTranscript =
 "";

let meetingStart =
 null;

let timerInterval =
 null;

let translationHistory =
 [];


/* camera */

let cameraStream =
 null;

let cameraRunning =
 false;

let cameraTimer =
 null;

let previousFingerprint =
 null;

let slideAnalyzing =
 false;

let currentSlide =
 {

  title:"",
  description:"",
  keywords:[]

 };


/* =========================
 API KEY
========================= */

keyEl.value =
 localStorage.getItem(
  "meeting_ai_key"
 ) || "";


keyEl.onchange =
 ()=>{

  localStorage.setItem(
   "meeting_ai_key",
   keyEl.value.trim()
  );

 };


/* =========================
 HELPERS
========================= */

function scrollBottom(el){

 requestAnimationFrame(
  ()=>{

   el.scrollTop =
    el.scrollHeight;

  }
 );

}


function esc(s){

 return String(s || "")

 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");

}


function extractOutput(data){

 if(
  data.output_text
 ){
  return data.output_text;
 }


 try{

  return data.output

  .flatMap(
   x =>
   x.content || []
  )

  .filter(
   x =>
   x.type ===
   "output_text"
  )

  .map(
   x =>
   x.text
  )

  .join("");

 }catch(e){

  return "";

 }

}


/* =========================
 OPENAI TEXT
========================= */

async function callOpenAI(prompt){

 const key =
  keyEl.value.trim();


 if(!key){

  throw new Error(
   "APIキーを入力してください"
  );

 }


 const response =
 await fetch(

  "https://api.openai.com/v1/responses",

  {

   method:"POST",

   headers:{

    "Content-Type":
    "application/json",

    "Authorization":
    "Bearer " + key

   },

   body:
   JSON.stringify({

    model:
    "gpt-5-mini",

    input:
    prompt

   })

  }

 );


 const data =
  await response.json();


 if(!response.ok){

  throw new Error(
   data?.error?.message ||
   "OpenAI API error"
  );

 }


 return extractOutput(
  data
 );

}


/* =========================
 OPENAI IMAGE
========================= */

async function analyzeSlideImage(
 dataUrl
){

 const key =
  keyEl.value.trim();


 if(!key){

  throw new Error(
   "APIキーを入力してください"
  );

 }


 const response =
 await fetch(

  "https://api.openai.com/v1/responses",

  {

   method:"POST",

   headers:{

    "Content-Type":
    "application/json",

    "Authorization":
    "Bearer " + key

   },

   body:
   JSON.stringify({

    model:
    "gpt-5-mini",

    input:[
     {

      role:"user",

      content:[
       {

        type:"input_text",

        text:
`
You are looking at a presentation slide
during a technical meeting.

Read the slide carefully.

The meeting may involve:

metallography
cutting
mounting
grinding
polishing
etching
microscopy
materials characterization
customer samples
test results
Japan
Japanese customers

Return ONLY valid JSON.

{
 "title":"Short slide title",
 "description":"日本語で1～2文の簡潔な内容",
 "keywords":[
  "important keyword"
 ]
}

Do not invent information.

If text is difficult to read,
only report what can be understood.
`

       },

       {

        type:"input_image",

        image_url:
         dataUrl

       }

      ]

     }

    ]

   })

  }

 );


 const data =
  await response.json();


 if(!response.ok){

  throw new Error(
   data?.error?.message ||
   "画像解析エラー"
  );

 }


 const text =
  extractOutput(
   data
  );


 return JSON.parse(

  text

  .replace(
   /^```json/i,
   ""
  )

  .replace(
   /^```/,
   ""
  )

  .replace(
   /```$/,
   ""
  )

  .trim()

 );

}


/* =========================
 TIMER
========================= */

function startTimer(){

 if(!meetingStart){

  meetingStart =
   Date.now();

 }


 clearInterval(
  timerInterval
 );


 timerInterval =
 setInterval(
  ()=>{

   const seconds =
    Math.floor(
     (
      Date.now() -
      meetingStart
     ) / 1000
    );


   const h =
    String(
     Math.floor(
      seconds / 3600
     )
    )
    .padStart(
     2,
     "0"
    );


   const m =
    String(
     Math.floor(
      (seconds % 3600) / 60
     )
    )
    .padStart(
     2,
     "0"
    );


   const s =
    String(
     seconds % 60
    )
    .padStart(
     2,
     "0"
    );


   timerEl.textContent =
    `⏱ ${h}:${m}:${s}`;

  },

  1000

 );

}


/* =========================
 CAMERA START / STOP
========================= */

async function startCamera(){

 if(cameraRunning){

  stopCamera();

  return;

 }


 try{

  cameraStream =
   await navigator
   .mediaDevices
   .getUserMedia({

    video:{

     facingMode:{
      ideal:"environment"
     },

     width:{
      ideal:1280
     },

     height:{
      ideal:720
     }

    },

    audio:false

   });


  cameraVideo.srcObject =
   cameraStream;


  await cameraVideo.play();


  cameraRunning =
   true;


  cameraWindow.style.display =
   "block";


  cameraBtn.textContent =
   "📷 資料読取 ON";


  cameraStatus.textContent =
   "監視中";


  /*
   最初は必ず解析
  */

  previousFingerprint =
   null;


  setTimeout(
   checkSlide,
   1200
  );


  cameraTimer =
   setInterval(
    checkSlide,
    3000
   );


 }catch(e){

  console.error(e);


  alert(
   "カメラを開始できませんでした。\nSafariのカメラ許可を確認してください。"
  );

 }

}


function stopCamera(){

 cameraRunning =
  false;


 clearInterval(
  cameraTimer
 );


 cameraTimer =
  null;


 if(cameraStream){

  cameraStream
  .getTracks()
  .forEach(
   track =>
   track.stop()
  );

 }


 cameraStream =
  null;


 cameraVideo.srcObject =
  null;


 cameraWindow.style.display =
  "none";


 cameraBtn.textContent =
  "📷 資料読取";

}


/* =========================
 CAPTURE
========================= */

function captureFrame(){

 if(
  !cameraVideo.videoWidth ||
  !cameraVideo.videoHeight
 ){
  return null;
 }


 /*
  AIへ巨大画像を送らないよう
  最大幅960px程度へ縮小
 */

 const maxWidth =
  960;


 const scale =
  Math.min(
   1,
   maxWidth /
   cameraVideo.videoWidth
  );


 captureCanvas.width =
  Math.round(
   cameraVideo.videoWidth *
   scale
  );


 captureCanvas.height =
  Math.round(
   cameraVideo.videoHeight *
   scale
  );


 const ctx =
  captureCanvas.getContext(
   "2d"
  );


 ctx.drawImage(
  cameraVideo,
  0,
  0,
  captureCanvas.width,
  captureCanvas.height
 );


 return captureCanvas
 .toDataURL(
  "image/jpeg",
  0.72
 );

}


/* =========================
 LOCAL SLIDE CHANGE CHECK
========================= */

function createFingerprint(){

 if(
  !cameraVideo.videoWidth
 ){
  return null;
 }


 const w =
  32;

 const h =
  18;


 const temp =
  document.createElement(
   "canvas"
  );


 temp.width =
  w;

 temp.height =
  h;


 const ctx =
  temp.getContext(
   "2d",
   {
    willReadFrequently:true
   }
  );


 ctx.drawImage(
  cameraVideo,
  0,
  0,
  w,
  h
 );


 const data =
  ctx.getImageData(
   0,
   0,
   w,
   h
  ).data;


 const result =
  [];


 for(
  let i=0;
  i<data.length;
  i+=4
 ){

  const gray =
   (
    data[i] +
    data[i+1] +
    data[i+2]
   ) / 3;


  result.push(
   gray
  );

 }


 return result;

}


function fingerprintDifference(
 a,
 b
){

 if(
  !a ||
  !b ||
  a.length !== b.length
 ){
  return 999;
 }


 let total =
  0;


 for(
  let i=0;
  i<a.length;
  i++
 ){

  total +=
   Math.abs(
    a[i] -
    b[i]
   );

 }


 return total /
  a.length;

}


/* =========================
 CHECK SLIDE
========================= */

async function checkSlide(){

 if(
  !cameraRunning ||
  slideAnalyzing
 ){
  return;
 }


 const fingerprint =
  createFingerprint();


 if(!fingerprint){
  return;
 }


 const difference =
  fingerprintDifference(
   previousFingerprint,
   fingerprint
  );


 /*
  初回 または
  映像の変化が一定以上の時だけ解析
 */

 if(
  previousFingerprint &&
  difference < 12
 ){
  return;
 }


 previousFingerprint =
  fingerprint;


 const image =
  captureFrame();


 if(!image){
  return;
 }


 slideAnalyzing =
  true;


 cameraStatus.textContent =
  "AI読取中…";


 try{

  const result =
   await analyzeSlideImage(
    image
   );


  currentSlide =
   {

    title:
     result.title || "",

    description:
     result.description || "",

    keywords:
     Array.isArray(
      result.keywords
     )
     ? result.keywords
     : []

   };


  slideTitleEl.textContent =
   currentSlide.title ||
   "資料";


  slideDescriptionEl.textContent =
   currentSlide.description ||
   "内容を読み取りました。";


  cameraStatus.textContent =
   "読取済";


  /*
   スライドが変わったら
   会議AIも再解析
  */

  lastPredictionTranscript =
   "";


  scheduleAnalysis();


 }catch(e){

  console.error(e);


  cameraStatus.textContent =
   "読取エラー";

 }finally{

  slideAnalyzing =
   false;

 }

}


/* =========================
 QUESTION DETECTION
========================= */

function detectQuestion(text){

 const t =
  text.toLowerCase();


 const detected =
  /\?|\b(what|when|where|who|why|how|can you|could you|would you|do you|did you|are you|have you|will you)\b/
  .test(t);


 if(!detected){
  return;
 }


 questionAlert.style.display =
  "flex";


 questionAlert.textContent =
  /japan|japanese/.test(t)
  ? "❓ Japan QUESTION"
  : "❓ QUESTION";


 clearTimeout(
  detectQuestion.timer
 );


 detectQuestion.timer =
  setTimeout(
   ()=>{

    questionAlert.style.display =
     "none";

   },

   8000

  );

}


/* =========================
 SPEECH RECOGNITION
========================= */

function initRecognition(){

 const SR =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


 if(!SR){

  return null;

 }


 const r =
  new SR();


 r.continuous =
  true;


 r.interimResults =
  true;


 r.lang =
  "en-US";


 r.onresult =
  e=>{

   let newFinal =
    "";


   interimText =
    "";


   for(
    let i=e.resultIndex;
    i<e.results.length;
    i++
   ){

    const text =
     e.results[i][0]
     .transcript;


    if(
     e.results[i].isFinal
    ){

     newFinal +=
      text.trim() +
      ". ";

    }else{

     interimText +=
      text;

    }

   }


   if(newFinal){

    transcript +=
     newFinal;


    pendingEnglish.push(
     newFinal.trim()
    );


    detectQuestion(
     newFinal
    );


    translatePending();


    scheduleAnalysis();

   }


   rawEl.textContent =
    (
     transcript +
     " " +
     interimText
    )
    .trim();


   scrollBottom(
    rawEl
   );

  };


 r.onend =
  ()=>{

   if(running){

    setTimeout(
     ()=>{

      try{

       r.start();

      }catch(e){}

     },

     250

    );

   }

  };


 return r;

}


/* =========================
 TRANSLATION
========================= */

async function translatePending(){

 if(
  translating ||
  !pendingEnglish.length
 ){
  return;
 }


 translating =
  true;


 const english =
  pendingEnglish
  .splice(
   0,
   2
  )
  .join(" ");


 try{

  const japanese =
   (
    await callOpenAI(
`
Translate the following spoken English
directly into natural Japanese.

Do not summarize.
Do not explain.
Do not add information.

Return ONLY Japanese.

${english}
`
    )
   )
   .trim();


  translationHistory.push(
   japanese
  );


  if(
   translationEl
   .querySelector(
    ".muted"
   )
  ){

   translationEl.innerHTML =
    "";

  }


  const div =
   document.createElement(
    "div"
   );


  div.className =
   "translation-line";


  div.textContent =
   japanese;


  translationEl
  .appendChild(
   div
  );


  scrollBottom(
   translationEl
  );


 }catch(e){

  console.error(e);

 }finally{

  translating =
   false;


  if(
   pendingEnglish.length
  ){

   translatePending();

  }

 }

}


/* =========================
 ANALYSIS
========================= */

function scheduleAnalysis(){

 clearTimeout(
  analysisTimer
 );


 analysisTimer =
  setTimeout(
   updateMeetingAI,
   1200
  );

}


async function updateMeetingAI(){

 if(analyzing){
  return;
 }


 const current =
  transcript.trim();


 if(!current){
  return;
 }


 if(
  current ===
  lastPredictionTranscript
 ){
  return;
 }


 analyzing =
  true;


 const recent =
  current.slice(
   -8000
  );


 const existingTopics =
  topicHistory

  .map(
   (t,i)=>
   `${i+1}. ${t.title} - ${t.description}`
  )

  .join("\n");


 const first =
  topicHistory.length === 0;


 /*
  ★ カメラで読んだ資料情報
 */

 const slideContext =
`
CURRENT PRESENTATION SLIDE

Title:
${currentSlide.title || "Unknown"}

Description:
${currentSlide.description || "Unknown"}

Keywords:
${currentSlide.keywords.join(", ") || "Unknown"}
`;


 const prompt =
`
You are a real-time meeting assistant.

The user is a Japanese application engineer.

Use BOTH:

1. the spoken meeting transcript
2. the currently visible presentation slide

to understand the meeting context.


${slideContext}


------------------------------
MEETING OVERVIEW
------------------------------

The overview should look like
a short presentation agenda.

${first
 ? "You MUST create the first meaningful topic."
 : "Create a new topic only when the major subject clearly changes."
}

Existing topics:

${existingTopics || "None"}

Current topic:

${currentTopicTitle || "None"}


------------------------------
SPEAKING PREDICTIONS
------------------------------

Predict up to 5 things
the engineer may need to say NEXT.

Use the slide information
to improve the prediction.

Prioritize:

1 direct questions
2 Japan / Japanese customers
3 slide results
4 test results
5 sample preparation conditions
6 technical opinions


IMPORTANT:

question_jp must be the DIRECT Japanese translation
of the likely question.

Do NOT describe the situation.

Example:

Correct:
この結果についてどう思いますか？

Wrong:
結果に対する意見を求められる


answer_short must be:

short
easy English
natural
immediately usable


answer_jp must be a DIRECT Japanese translation
of answer_short.

Do not add explanations.

Do not invent facts.


Return ONLY valid JSON:

{
 "topic":{
  "changed":true,
  "title":"Short title",
  "description":"Short Japanese description"
 },
 "predictions":[
  {
   "chance":"high",
   "question_jp":"この結果についてどう思いますか？",
   "answer_short":"The result looks good.",
   "answer_jp":"結果は良さそうです。"
  }
 ]
}


MEETING TRANSCRIPT:

${recent}
`;


 try{

  const output =
   await callOpenAI(
    prompt
   );


  const cleaned =
   output

   .replace(
    /^```json/i,
    ""
   )

   .replace(
    /^```/,
    ""
   )

   .replace(
    /```$/,
    ""
   )

   .trim();


  const result =
   JSON.parse(
    cleaned
   );


  if(
   result.topic
  ){

   handleTopic(
    result.topic,
    first
   );

  }


  if(
   Array.isArray(
    result.predictions
   )
  ){

   renderPredictions(
    result.predictions
   );


   nextSpeakText.textContent =
    result.predictions[0]
    ?.answer_short ||
    "—";

  }


  lastPredictionTranscript =
   current;


 }catch(e){

  console.error(e);

 }finally{

  analyzing =
   false;


  if(
   transcript.trim() !==
   lastPredictionTranscript
  ){

   scheduleAnalysis();

  }

 }

}


/* =========================
 TOPICS
========================= */

function handleTopic(
 topic,
 first
){

 if(
  !topic ||
  !topic.title
 ){
  return;
 }


 const title =
  String(
   topic.title
  )
  .trim();


 const description =
  String(
   topic.description || ""
  )
  .trim();


 const duplicate =
  topicHistory.some(
   t =>
   t.title.toLowerCase() ===
   title.toLowerCase()
  );


 const same =
  currentTopicTitle &&
  currentTopicTitle
  .toLowerCase() ===
  title.toLowerCase();


 if(
  first ||
  (
   topic.changed &&
   !duplicate &&
   !same
  )
 ){

  if(!duplicate){

   topicHistory.push({

    title,
    description

   });

  }


  currentTopicTitle =
   title;


  renderTopics();

 }

}


function renderTopics(){

 summaryEl.innerHTML =
  topicHistory

  .map(
   t=>
`
<div class="topic">

<div class="topic-title">
• ${esc(t.title)}
</div>

<div class="topic-description">
${esc(t.description)}
</div>

</div>
`
  )

  .join("");


 scrollBottom(
  summaryEl
 );

}


/* =========================
 3-LINE PREDICTION
========================= */

function renderPredictions(
 items
){

 predictionEl.innerHTML =
  items

  .slice(
   0,
   5
  )

  .map(
   (p,i)=>{

    const chance =
     [
      "high",
      "medium",
      "low"
     ]
     .includes(
      p.chance
     )
     ? p.chance
     : "medium";


    const label =
     chance === "high"
     ? "高"
     : chance === "medium"
     ? "中"
     : "低";


    return `
<div class="prediction-card ${chance}">

<div class="pred-top">

<span class="number">
${i+1}
</span>

<span class="chance">
可能性 ${label}
</span>

<span class="question-jp">
${esc(p.question_jp)}
</span>

</div>

<div class="answer">
${esc(p.answer_short)}
</div>

<div class="answer-jp">
${esc(p.answer_jp)}
</div>

</div>
`;

   }

  )

  .join("");


 predictionEl.scrollTop =
  0;

}


/* =========================
 COPY NEXT ANSWER
========================= */

nextSpeak.onclick =
 async ()=>{

  const text =
   nextSpeakText.textContent;


  if(
   !text ||
   text === "—"
  ){
   return;
  }


  try{

   await navigator
   .clipboard
   .writeText(
    text
   );


   const old =
    text;


   nextSpeakText.textContent =
    "✓ コピーしました";


   setTimeout(
    ()=>{

     nextSpeakText.textContent =
      old;

    },

    900

   );

  }catch(e){}

 };


/* =========================
 BUTTONS
========================= */

cameraBtn.onclick =
 startCamera;


startBtn.onclick =
 ()=>{

  if(
   !keyEl.value.trim()
  ){

   alert(
    "OpenAI APIキーを入力してください。"
   );

   return;

  }


  localStorage.setItem(
   "meeting_ai_key",
   keyEl.value.trim()
  );


  recognition =
   recognition ||
   initRecognition();


  if(!recognition){

   alert(
    "このブラウザは音声認識に対応していません。"
   );

   return;

  }


  running =
   true;


  startBtn.disabled =
   true;


  stopBtn.disabled =
   false;


  startTimer();


  try{

   recognition.start();

  }catch(e){}

 };


stopBtn.onclick =
 ()=>{

  running =
   false;


  clearTimeout(
   analysisTimer
  );


  startBtn.disabled =
   false;


  stopBtn.disabled =
   true;


  if(recognition){

   try{

    recognition.stop();

   }catch(e){}

  }


  if(
   pendingEnglish.length
  ){

   translatePending();

  }


  if(
   transcript.trim()
  ){

   updateMeetingAI();

  }

 };


/* =========================
 DOWNLOAD
========================= */

function downloadText(
 name,
 text
){

 const blob =
  new Blob(
   [
    "\ufeff" +
    text
   ],
   {
    type:
    "text/plain;charset=utf-8"
   }
  );


 const url =
  URL.createObjectURL(
   blob
  );


 const a =
  document.createElement(
   "a"
  );


 a.href =
  url;


 a.download =
  name;


 document.body
 .appendChild(
  a
 );


 a.click();


 a.remove();


 setTimeout(
  ()=>{

   URL.revokeObjectURL(
    url
   );

  },

  1000

 );

}


/* =========================
 FINISH
========================= */

finishBtn.onclick =
 async ()=>{

  if(
   !transcript.trim()
  ){

   alert(
    "保存する会議内容がありません。"
   );

   return;

  }


  running =
   false;


  clearTimeout(
   analysisTimer
  );


  clearInterval(
   timerInterval
  );


  stopCamera();


  if(recognition){

   try{

    recognition.stop();

   }catch(e){}

  }


  finishBtn.disabled =
   true;


  finishBtn.textContent =
   "まとめ作成中…";


  try{

   const topics =
    topicHistory

    .map(
     t =>
     `- ${t.title}: ${t.description}`
    )

    .join("\n");


   const report =
    (
     await callOpenAI(
`
Create a concise Japanese final meeting report.

Do not invent facts.

Use these headings:

【会議まとめ】

【決定事項】

【Action Items】

【確認・未解決事項】

Use the transcript and presentation context.

Presentation:

${currentSlide.title}

${currentSlide.description}


Meeting topics:

${topics || "なし"}


Transcript:

${transcript}
`
     )
    )
    .trim();


   const now =
    new Date();


   const stamp =
    now
    .toISOString()
    .slice(
     0,
     16
    )
    .replace(
     "T",
     "_"
    )
    .replace(
     ":",
     "-"
    );


   const text =
`Meeting AI 会議記録

日時:
${now.toLocaleString("ja-JP")}


==============================
AI 会議まとめ
==============================

${report}


==============================
会議概要
==============================

${topics || "なし"}


==============================
最後に認識した資料
==============================

タイトル:
${currentSlide.title || "なし"}

内容:
${currentSlide.description || "なし"}

キーワード:
${currentSlide.keywords.join(", ") || "なし"}


==============================
English Transcript
==============================

${transcript}


==============================
日本語訳
==============================

${translationHistory.join("\n") || "なし"}
`;


   downloadText(

    `Meeting_AI_${stamp}.txt`,

    text

   );


   alert(
    "会議まとめを保存しました。"
   );


  }catch(e){

   console.error(e);


   alert(
    "まとめ作成に失敗しました。\n" +
    e.message
   );


  }finally{

   finishBtn.disabled =
    false;


   finishBtn.textContent =
    "終了・保存";


   startBtn.disabled =
    false;


   stopBtn.disabled =
    true;

  }

 };

</script>
