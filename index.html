<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meeting AI - Video Practice</title>

<style>
:root{
 --bg:#090d12;
 --panel:#121923;
 --panel2:#0e151e;
 --line:#293544;
 --text:#f3f6fa;
 --muted:#9eabb9;
 --blue:#70a7ff;
 --green:#68d78e;
 --red:#ff8080;
 --orange:#ffad66;
 --purple:#b79cff;
}

*{box-sizing:border-box}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:var(--bg);
 color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

#app{
 height:100%;
 display:grid;
 grid-template-rows:58px 1fr;
 gap:6px;
 padding:6px;
}

/* HEADER */

header{
 display:flex;
 align-items:center;
 gap:6px;
 background:var(--panel);
 border:1px solid var(--line);
 border-radius:10px;
 padding:5px 8px;
}

.logo{
 font-weight:800;
 white-space:nowrap;
}

.mode{
 background:#285c9e;
}

button,.fileButton,select,input{
 border:1px solid var(--line);
 border-radius:7px;
 background:#1d2835;
 color:white;
 padding:7px 9px;
 font-size:11px;
}

button{
 cursor:pointer;
}

button:disabled{
 opacity:.45;
}

.fileButton{
 display:inline-block;
 cursor:pointer;
 white-space:nowrap;
}

#videoFile{
 display:none;
}

#apiKey{
 width:100px;
}

#status{
 font-size:10px;
 color:var(--green);
 white-space:nowrap;
}

#currentTopic{
 flex:1;
 min-width:100px;
 height:38px;
 padding:3px 8px;
 border:1px solid var(--line);
 border-radius:7px;
 background:#0c1219;
 overflow:hidden;
}

.smallLabel{
 font-size:9px;
 color:var(--muted);
}

#currentTopicText{
 font-size:12px;
 font-weight:700;
 margin-top:2px;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

/* MAIN */

main{
 min-height:0;
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:6px;
}

.left{
 min-height:0;
 display:grid;
 grid-template-rows:47% 26.5% 26.5%;
 gap:6px;
}

.right{
 min-height:0;
 display:grid;
 grid-template-rows:31% 69%;
 gap:6px;
}

.panel{
 min-height:0;
 display:flex;
 flex-direction:column;
 overflow:hidden;
 background:var(--panel);
 border:1px solid var(--line);
 border-radius:9px;
}

.title{
 flex:none;
 padding:5px 8px;
 border-bottom:1px solid var(--line);
 font-size:12px;
 font-weight:750;
}

.content{
 flex:1;
 min-height:0;
 overflow:auto;
 padding:6px 8px;
}

/* VIDEO */

#videoPanel{
 display:grid;
 grid-template-columns:64% 36%;
 flex:1;
 min-height:0;
}

#videoSide{
 min-width:0;
 min-height:0;
 display:flex;
 flex-direction:column;
 background:black;
 border-right:1px solid var(--line);
}

#meetingVideo{
 width:100%;
 flex:1;
 min-height:0;
 object-fit:contain;
 background:black;
}

.controls{
 flex:none;
 display:flex;
 align-items:center;
 gap:5px;
 padding:4px;
 background:#0b1118;
}

.controls button{
 padding:5px 7px;
}

#videoTime{
 margin-left:auto;
 font-size:10px;
 color:#b9c4d0;
}

/* VIDEO AI SIDE */

#videoInfo{
 padding:8px;
 overflow:auto;
 background:#0e151e;
}

.infoTitle{
 font-size:10px;
 color:var(--green);
 font-weight:800;
 margin-bottom:5px;
}

#activeSpeaker{
 font-size:11px;
 color:#9db8dc;
 margin-bottom:5px;
}

#videoTopic{
 font-size:14px;
 font-weight:800;
 color:#a8caff;
 margin-bottom:7px;
}

#videoInfoText{
 font-size:11px;
 line-height:1.3;
 color:#dce3eb;
}

/* TRANSCRIPT */

#english,
#japanese{
 font-size:15px;
 line-height:1.3;
}

#japanese{
 font-size:16px;
}

.line{
 margin-bottom:3px;
 padding-left:5px;
 border-left:3px solid transparent;
}

.speaker-A{
 color:#82b1ff;
 border-color:#82b1ff;
}

.speaker-B{
 color:#7dde9b;
 border-color:#7dde9b;
}

.speaker-C{
 color:#ffb36b;
 border-color:#ffb36b;
}

.speaker-D{
 color:#c09cff;
 border-color:#c09cff;
}

.jpLine{
 color:white;
}

.jpLine.speaker-A{border-color:#82b1ff}
.jpLine.speaker-B{border-color:#7dde9b}
.jpLine.speaker-C{border-color:#ffb36b}
.jpLine.speaker-D{border-color:#c09cff}

/* OVERVIEW */

.topicItem{
 padding:5px 0;
 border-bottom:1px solid #26313e;
}

.topicItem strong{
 color:#cfe0ff;
 font-size:13px;
}

.topicItem div{
 color:#d3d9e0;
 font-size:11px;
 margin-top:2px;
}

/* PREDICTIONS */

.card{
 margin-bottom:5px;
 padding:6px 8px;
 background:#0d151e;
 border-radius:5px;
}

.incoming{
 border-left:3px solid var(--red);
}

.outgoing{
 border-left:3px solid var(--green);
}

.cardHead{
 font-size:11px;
 font-weight:800;
 margin-bottom:2px;
}

.incoming .cardHead{
 color:#ff9999;
}

.outgoing .cardHead{
 color:#7ee09e;
}

.qjp{
 font-size:13px;
 font-weight:700;
}

.qen{
 margin-top:2px;
 color:#b8c9df;
 font-size:12px;
}

.answer{
 margin-top:4px;
 color:#d3e3ff;
 font-size:16px;
 font-weight:750;
}

.answerjp{
 color:#aeb8c6;
 font-size:11px;
}

/* PROCESSING */

#processing{
 position:fixed;
 inset:0;
 display:none;
 align-items:center;
 justify-content:center;
 background:rgba(0,0,0,.82);
 z-index:999;
}

.processingBox{
 width:min(520px,80vw);
 background:#121923;
 border:1px solid #344354;
 border-radius:12px;
 padding:22px;
 text-align:center;
}

#processTitle{
 font-size:18px;
 font-weight:800;
}

#processText{
 margin-top:8px;
 color:#b7c1cc;
 font-size:13px;
}

.progress{
 height:8px;
 background:#28323e;
 border-radius:5px;
 margin-top:16px;
 overflow:hidden;
}

#progressBar{
 width:10%;
 height:100%;
 background:#4d8ee8;
 transition:width .3s;
}

@media(max-width:1000px){
 .logo{font-size:12px}
 button,.fileButton,select,input{font-size:10px;padding:6px}
 #apiKey{width:75px}
}
</style>
</head>

<body>

<div id="app">

<header>

<div class="logo">
🎬 Meeting AI
</div>

<button class="mode">
動画練習
</button>

<label class="fileButton">
📁 動画選択
<input id="videoFile" type="file" accept="video/*,audio/*">
</label>

<input
 id="apiKey"
 type="password"
 placeholder="API Key"
 autocomplete="off"
>

<div id="status">
動画未選択
</div>

<div id="currentTopic">
 <div class="smallLabel">💬 現在の話題</div>
 <div id="currentTopicText">動画を選択してください</div>
</div>

<button id="analyzeBtn" disabled>
🤖 初回解析
</button>

</header>

<main>

<div class="left">

<!-- VIDEO -->

<section class="panel">

<div class="title">
🎬 ミーティング動画
</div>

<div id="videoPanel">

<div id="videoSide">

<video
 id="meetingVideo"
 controls
 playsinline
></video>

<div class="controls">

<button id="back10">
↶10秒
</button>

<button id="playPause">
▶
</button>

<select id="speed">
<option value=".75">0.75×</option>
<option value="1" selected>1.0×</option>
<option value="1.25">1.25×</option>
<option value="1.5">1.5×</option>
</select>

<div id="videoTime">
00:00 / 00:00
</div>

</div>

</div>

<div id="videoInfo">

<div class="infoTitle">
🤖 現在のミーティング状況
</div>

<div id="activeSpeaker">
－
</div>

<div id="videoTopic">
解析するとここに表示されます
</div>

<div id="videoInfoText">
動画の再生位置に合わせて、
その時点までの会話だけを使って
Meeting AIが状況を判断します。
</div>

</div>

</div>

</section>


<section class="panel">

<div class="title">
🎙 English
</div>

<div class="content" id="english">
動画を解析すると英文が表示されます。
</div>

</section>


<section class="panel">

<div class="title">
🇯🇵 日本語
</div>

<div class="content" id="japanese">
再生位置に合わせて日本語訳を表示します。
</div>

</section>

</div>


<div class="right">

<section class="panel">

<div class="title">
📝 会議概要
</div>

<div class="content" id="overview">
動画を進めると会議概要が更新されます。
</div>

</section>


<section class="panel">

<div class="title">
🔮 質問予測・こちらから質問
</div>

<div class="content" id="predictions">
現在地点までの会話から予測します。
</div>

</section>

</div>

</main>

</div>


<div id="processing">

<div class="processingBox">

<div id="processTitle">
解析中
</div>

<div id="processText">
準備しています…
</div>

<div class="progress">
<div id="progressBar"></div>
</div>

</div>

</div>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const $ = id =>
 document.getElementById(id);

const video =
 $("meetingVideo");

const fileInput =
 $("videoFile");

const apiKey =
 $("apiKey");

const analyzeBtn =
 $("analyzeBtn");

const statusEl =
 $("status");

const englishEl =
 $("english");

const japaneseEl =
 $("japanese");

const overviewEl =
 $("overview");

const predictionsEl =
 $("predictions");

const currentTopicEl =
 $("currentTopicText");

const videoTopic =
 $("videoTopic");

const videoInfoText =
 $("videoInfoText");

const activeSpeaker =
 $("activeSpeaker");

const videoTime =
 $("videoTime");

const speed =
 $("speed");

const processing =
 $("processing");

const processTitle =
 $("processTitle");

const processText =
 $("processText");

const progressBar =
 $("progressBar");


/* =====================================================
   STATE
===================================================== */

let selectedFile = null;

let videoURL = null;

let segments = [];

let translatedSegments = [];

let currentSegmentIndex = -1;

let lastAISecond = -999;

let aiRunning = false;

let overviewHistory = [];

let analysisId = "";

let cacheKey = "";


/* =====================================================
   API KEY
===================================================== */

apiKey.value =
 localStorage.getItem(
  "meeting_ai_key"
 ) || "";

apiKey.onchange = ()=>{

 localStorage.setItem(
  "meeting_ai_key",
  apiKey.value.trim()
 );

};


/* =====================================================
   HELPERS
===================================================== */

function esc(s){

 return String(s || "")
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");

}


function cleanJSON(text){

 return String(text || "")
 .replace(/^```json/i,"")
 .replace(/^```/,"")
 .replace(/```$/,"")
 .trim();

}


function outputText(data){

 if(data.output_text)
  return data.output_text;

 try{

  return data.output
  .flatMap(x=>x.content || [])
  .filter(x=>x.type==="output_text")
  .map(x=>x.text)
  .join("");

 }catch{

  return "";

 }

}


function formatTime(sec){

 if(!Number.isFinite(sec))
  return "00:00";

 const m =
  Math.floor(sec / 60);

 const s =
  Math.floor(sec % 60);

 return (
  String(m).padStart(2,"0") +
  ":" +
  String(s).padStart(2,"0")
 );

}


function speakerClass(speaker){

 const list =
  ["A","B","C","D"];

 const s =
  String(speaker || "A")
  .replace("speaker_","")
  .toUpperCase();

 return list.includes(s)
  ? s
  : "A";

}


function showProcess(
 title,
 text,
 percent
){

 processing.style.display =
  "flex";

 processTitle.textContent =
  title;

 processText.textContent =
  text;

 progressBar.style.width =
  percent + "%";

}


function hideProcess(){

 processing.style.display =
  "none";

}


/* =====================================================
   OPENAI TEXT
===================================================== */

async function callOpenAI(prompt){

 const key =
  apiKey.value.trim();

 if(!key)
  throw new Error(
   "OpenAI APIキーを入力してください。"
  );

 const r =
  await fetch(
   "https://api.openai.com/v1/responses",
   {
    method:"POST",

    headers:{
     "Content-Type":"application/json",
     "Authorization":"Bearer " + key
    },

    body:JSON.stringify({
     model:"gpt-5-mini",
     input:prompt
    })
   }
  );

 const data =
  await r.json();

 if(!r.ok){

  throw new Error(
   data?.error?.message ||
   "OpenAI API error"
  );

 }

 return outputText(data);

}


/* =====================================================
   FILE
===================================================== */

fileInput.onchange =
 async event=>{

  const file =
   event.target.files?.[0];

  if(!file)
   return;

  selectedFile =
   file;

  if(videoURL)
   URL.revokeObjectURL(videoURL);

  videoURL =
   URL.createObjectURL(file);

  video.src =
   videoURL;

  analyzeBtn.disabled =
   false;

  statusEl.textContent =
   file.name;

  currentTopicEl.textContent =
   "解析待ち";

  /*
    cache identity
  */

  analysisId =
   [
    file.name,
    file.size,
    file.lastModified
   ].join("_");

  cacheKey =
   "meeting_practice_" +
   analysisId;

  /*
    Try local cached analysis.
  */

  const cached =
   localStorage.getItem(
    cacheKey
   );

  if(cached){

   try{

    const data =
     JSON.parse(cached);

    segments =
     data.segments || [];

    translatedSegments =
     data.translations || [];

    statusEl.textContent =
     "解析済み ✓";

    currentTopicEl.textContent =
     "解析済み動画";

    analyzeBtn.textContent =
     "♻️ 再解析";

    renderAtTime(0);

   }catch{}

  }

 };


/* =====================================================
   TRANSCRIPTION
===================================================== */

async function transcribeFile(file){

 const key =
  apiKey.value.trim();

 if(!key)
  throw new Error(
   "APIキーを入力してください。"
  );

 const form =
  new FormData();

 form.append(
  "file",
  file,
  file.name
 );

 /*
  Speaker diarization.
 */

 form.append(
  "model",
  "gpt-4o-transcribe-diarize"
 );

 form.append(
  "response_format",
  "diarized_json"
 );

 /*
  Required for longer recordings.
 */

 form.append(
  "chunking_strategy",
  "auto"
 );


 const r =
  await fetch(
   "https://api.openai.com/v1/audio/transcriptions",
   {
    method:"POST",

    headers:{
     "Authorization":
      "Bearer " + key
    },

    body:form
   }
  );


 const data =
  await r.json();


 if(!r.ok){

  throw new Error(
   data?.error?.message ||
   "文字起こしに失敗しました。"
  );

 }


 if(!Array.isArray(data.segments)){

  throw new Error(
   "話者付きセグメントを取得できませんでした。"
  );

 }


 return data.segments.map(
  seg=>({

   start:
    Number(seg.start || 0),

   end:
    Number(seg.end || 0),

   speaker:
    String(seg.speaker || "A"),

   text:
    String(seg.text || "").trim()

  })
 );

}


/* =====================================================
   TRANSLATE SEGMENTS
===================================================== */

async function translateAll(){

 /*
   Translation in groups so the
   timestamps remain unchanged.
 */

 const results = [];

 const batchSize = 25;


 for(
  let i=0;
  i<segments.length;
  i+=batchSize
 ){

  const batch =
   segments.slice(
    i,
    i + batchSize
   );


  showProcess(
   "日本語訳を作成中",
   `${Math.min(i+batchSize,segments.length)} / ${segments.length}`,
   45 +
   Math.round(
    45 *
    i /
    Math.max(
     segments.length,
     1
    )
   )
  );


  const input =
   batch.map(
    (s,index)=>({
     id:i + index,
     text:s.text
    })
   );


  const output =
   await callOpenAI(
`
Translate each English meeting utterance
into natural Japanese.

Do not summarize.
Do not add information.

Technical terms should remain accurate.

Return ONLY valid JSON:

{
 "items":[
   {
    "id":0,
    "jp":"日本語"
   }
 ]
}

INPUT:

${JSON.stringify(input)}
`
   );


  const parsed =
   JSON.parse(
    cleanJSON(output)
   );


  for(
   const item of
   parsed.items || []
  ){

   results[
    Number(item.id)
   ] =
    String(item.jp || "");

  }

 }


 return results;

}


/* =====================================================
   ANALYZE BUTTON
===================================================== */

analyzeBtn.onclick =
 async ()=>{

  if(!selectedFile)
   return;


  try{

   localStorage.setItem(
    "meeting_ai_key",
    apiKey.value.trim()
   );


   showProcess(
    "① 音声を解析中",
    "英語と話者を認識しています…",
    15
   );


   segments =
    await transcribeFile(
     selectedFile
    );


   showProcess(
    "② 日本語訳を準備",
    `${segments.length}個の発話を取得しました`,
    45
   );


   translatedSegments =
    await translateAll();


   showProcess(
    "③ 保存中",
    "次回からこの解析を再利用できます",
    95
   );


   /*
     Cache analysis locally.
   */

   try{

    localStorage.setItem(
     cacheKey,
     JSON.stringify({
      segments:segments,
      translations:
       translatedSegments
     })
    );

   }catch(e){

    /*
      Long transcripts can exceed
      localStorage limits.

      App still works in memory.
    */

    console.warn(
     "Cache save failed",
     e
    );

   }


   statusEl.textContent =
    "解析完了 ✓";


   currentTopicEl.textContent =
    "再生を開始してください";


   analyzeBtn.textContent =
    "♻️ 再解析";


   renderAtTime(0);


   hideProcess();


  }catch(error){

   hideProcess();

   console.error(error);

   alert(
    "解析に失敗しました。\n\n" +
    error.message
   );

  }

 };


/* =====================================================
   PLAYBACK
===================================================== */

$("playPause").onclick =
 ()=>{

  if(video.paused){

   video.play();

  }else{

   video.pause();

  }

 };


$("back10").onclick =
 ()=>{

  video.currentTime =
   Math.max(
    0,
    video.currentTime - 10
   );

 };


speed.onchange =
 ()=>{

  video.playbackRate =
   Number(speed.value);

 };


video.onplay =
 ()=>{

 $("playPause").textContent =
  "⏸";

};


video.onpause =
 ()=>{

 $("playPause").textContent =
  "▶";

};


/* =====================================================
   VIDEO TIME UPDATE
===================================================== */

video.ontimeupdate =
 ()=>{

  videoTime.textContent =
   formatTime(
    video.currentTime
   ) +
   " / " +
   formatTime(
    video.duration
   );


  renderAtTime(
   video.currentTime
  );


  /*
    AI analysis every ~20 sec.
    It ONLY receives transcript
    from the past.
  */

  if(
   segments.length &&
   video.currentTime -
   lastAISecond >= 20
  ){

   lastAISecond =
    video.currentTime;

   updatePracticeAI(
    video.currentTime
   );

  }

 };


video.onseeked =
 ()=>{

 renderAtTime(
  video.currentTime
 );

 /*
   Recalculate immediately
   after manual seeking.
 */

 lastAISecond =
  video.currentTime - 20;

};


/* =====================================================
   FIND CURRENT SEGMENT
===================================================== */

function getCurrentIndex(time){

 let found = -1;

 for(
  let i=0;
  i<segments.length;
  i++
 ){

  if(
   segments[i].start <= time
  ){

   found = i;

  }else{

   break;

  }

 }

 return found;

}


/* =====================================================
   RENDER TRANSCRIPT
===================================================== */

function renderAtTime(time){

 if(!segments.length)
  return;


 const index =
  getCurrentIndex(time);


 if(index < 0){

  englishEl.innerHTML =
   "再生待ち";

  japaneseEl.innerHTML =
   "再生待ち";

  return;

 }


 if(
  index ===
  currentSegmentIndex
 ){
  return;
 }


 currentSegmentIndex =
  index;


 /*
  Only show recent lines.
  This feels like live transcription.
 */

 const start =
  Math.max(
   0,
   index - 8
  );


 const visible =
  segments.slice(
   start,
   index + 1
  );


 englishEl.innerHTML =
  visible.map(
   (s,j)=>{

    const actual =
     start + j;

    const sp =
     speakerClass(
      s.speaker
     );

    return `
<div class="line speaker-${sp}">
${esc(s.text)}
</div>
`;

   }
  ).join("");


 japaneseEl.innerHTML =
  visible.map(
   (s,j)=>{

    const actual =
     start + j;

    const sp =
     speakerClass(
      s.speaker
     );

    return `
<div class="line jpLine speaker-${sp}">
${esc(
 translatedSegments[actual] ||
 "…"
)}
</div>
`;

   }
  ).join("");


 englishEl.scrollTop =
  englishEl.scrollHeight;


 japaneseEl.scrollTop =
  japaneseEl.scrollHeight;


 const current =
  segments[index];


 const sp =
  speakerClass(
   current.speaker
  );


 activeSpeaker.textContent =
  "現在の話者：" +
  sp;

}


/* =====================================================
   AI CONTEXT
===================================================== */

function transcriptUntil(time){

 return segments

 .filter(
  s =>
  s.start <= time
 )

 .slice(-35)

 .map(
  s =>
  `[Speaker ${speakerClass(s.speaker)}] ${s.text}`
 )

 .join("\n");

}


/* =====================================================
   PRACTICE AI
===================================================== */

async function updatePracticeAI(time){

 if(aiRunning)
  return;


 aiRunning = true;


 try{

  const context =
   transcriptUntil(time);


  const previous =
   overviewHistory

   .map(
    (x,i)=>
    `${i+1}. ${x.title}: ${x.description}`
   )

   .join("\n");


  const result =
   JSON.parse(
    cleanJSON(
     await callOpenAI(
`
You are assisting a Japanese application
engineer practicing an English meeting.

IMPORTANT:

You are at video time:
${formatTime(time)}

You are ONLY allowed to use the
conversation shown below.

You do NOT know what happens later
in the video.

The engineer works with:

metallography
cutting
mounting
grinding
polishing
etching
microscopy
materials characterization
customer samples
technical testing.

TASK 1

Create a short Japanese sentence
describing what is being discussed NOW.

TASK 2

Update the high-level meeting overview.

Only create a new topic if the major
subject has clearly changed.

TASK 3

Predict questions that OTHER participants
may ask THE USER next.

For each incoming question give:

Japanese question
English question
short safe English answer
Japanese translation of answer

Never invent the user's experience,
customer feedback or test results.

TASK 4

Suggest useful questions THE USER
could ask the other participants.

Give:
Japanese
English

Return maximum 5 items total.

Return ONLY valid JSON:

{
 "current_topic":"現在の話題",
 "topic":{
  "changed":true,
  "title":"Topic",
  "description":"日本語説明"
 },
 "items":[
  {
   "type":"incoming",
   "chance":"high",
   "question_jp":"日本語",
   "question_en":"English",
   "answer_en":"English answer",
   "answer_jp":"日本語回答"
  },
  {
   "type":"outgoing",
   "chance":"medium",
   "question_jp":"日本語",
   "question_en":"English"
  }
 ]
}

PREVIOUS OVERVIEW:

${previous || "None"}

CONVERSATION AVAILABLE AT THIS POINT:

${context}
`
     )
    )
   );


  if(result.current_topic){

   currentTopicEl.textContent =
    result.current_topic;

   videoTopic.textContent =
    result.current_topic;

   videoInfoText.textContent =
    `動画 ${formatTime(time)} 時点までの会話から判断`;

  }


  if(
   result.topic &&
   result.topic.title
  ){

   const duplicate =
    overviewHistory.some(
     x =>
     x.title.toLowerCase() ===
     String(
      result.topic.title
     ).toLowerCase()
    );


   if(
    (
     result.topic.changed ||
     overviewHistory.length === 0
    ) &&
    !duplicate
   ){

    overviewHistory.push({
     title:
      result.topic.title,
     description:
      result.topic.description || ""
    });

   }

  }


  renderOverview();


  renderPredictions(
   result.items || []
  );


 }catch(error){

  console.error(error);

 }finally{

  aiRunning = false;

 }

}


/* =====================================================
   OVERVIEW
===================================================== */

function renderOverview(){

 if(!overviewHistory.length)
  return;


 overviewEl.innerHTML =
  overviewHistory.map(
   item=>
`
<div class="topicItem">

<strong>
${esc(item.title)}
</strong>

<div>
${esc(item.description)}
</div>

</div>
`
  ).join("");

}


/* =====================================================
   PREDICTIONS
===================================================== */

function renderPredictions(items){

 if(!items.length)
  return;


 predictionsEl.innerHTML =
  items.slice(0,5)

  .map(item=>{

   if(
    item.type === "outgoing"
   ){

    return `
<div class="card outgoing">

<div class="cardHead">
🟢 こちらから質問
</div>

<div class="qjp">
${esc(item.question_jp)}
</div>

<div class="answer">
${esc(item.question_en)}
</div>

</div>
`;

   }


   const chance =
    item.chance === "high"
    ? "高"
    : item.chance === "low"
    ? "低"
    : "中";


   return `
<div class="card incoming">

<div class="cardHead">
🔴 質問予測　可能性 ${chance}
</div>

<div class="qjp">
${esc(item.question_jp)}
</div>

<div class="qen">
${esc(item.question_en)}
</div>

<div class="answer">
${esc(item.answer_en)}
</div>

<div class="answerjp">
${esc(item.answer_jp)}
</div>

</div>
`;

  }).join("");

}

</script>
