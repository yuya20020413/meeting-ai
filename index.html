<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Meeting AI</title>

<style>
:root{
 --gap:6px;
 --bg:#0b0f14;
 --panel:#141b24;
 --line:#293342;
 --text:#f3f6fa;
 --muted:#aeb8c6;
 --accent:#78a9ff;
 --green:#65d18a;
 --red:#ff8585;
 --yellow:#ffd36a;
}

*{
 box-sizing:border-box;
}

html,body{
 margin:0;
 width:100%;
 height:100%;
 background:var(--bg);
 color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 overflow:hidden;
}

#app{
 height:100%;
 display:grid;
 grid-template-rows:58px 1fr;
 gap:var(--gap);
 padding:var(--gap);
}

/* =========================
   TOP BAR
========================= */

header{
 display:flex;
 align-items:center;
 gap:6px;
 background:var(--panel);
 border:1px solid var(--line);
 border-radius:10px;
 padding:5px 8px;
 min-width:0;
}

header strong{
 font-size:15px;
 white-space:nowrap;
}

input{
 width:110px;
 min-width:70px;
 border:1px solid var(--line);
 background:#0e141c;
 color:white;
 border-radius:7px;
 padding:6px;
 font-size:11px;
}

.chip{
 height:38px;
 display:flex;
 align-items:center;
 border:1px solid var(--line);
 border-radius:8px;
 padding:0 8px;
 background:#0e141c;
 white-space:nowrap;
 font-size:12px;
}

#timer{
 font-variant-numeric:tabular-nums;
}

#questionAlert{
 display:none;
 color:#ffb2b2;
 border-color:#7b3434;
}

#nextSpeak{
 flex:1;
 min-width:150px;
 max-width:430px;
 display:block;
 padding:4px 9px;
 cursor:pointer;
}

.small{
 font-size:9px;
 color:var(--muted);
 line-height:1;
}

#nextSpeakText{
 font-size:14px;
 color:#8fbdff;
 font-weight:750;
 overflow:hidden;
 text-overflow:ellipsis;
 white-space:nowrap;
 margin-top:3px;
}

button{
 border:1px solid var(--line);
 background:#202a37;
 color:white;
 border-radius:8px;
 padding:6px 9px;
 font-size:12px;
 white-space:nowrap;
}

.primary{
 background:#245db8;
}

.stop{
 background:#713333;
}

.save{
 background:#255c46;
}

button:disabled{
 opacity:.45;
}


/* =========================
   MAIN LAYOUT
========================= */

main{
 min-height:0;
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:var(--gap);
}

.left{
 min-height:0;
 display:grid;
 grid-template-rows:1fr 1fr;
 gap:var(--gap);
}

.right{
 min-height:0;
 display:grid;
 grid-template-rows:32fr 68fr;
 gap:var(--gap);
}

.panel{
 min-height:0;
 background:var(--panel);
 border:1px solid var(--line);
 border-radius:10px;
 overflow:hidden;
 display:flex;
 flex-direction:column;
}

.title{
 flex:none;
 border-bottom:1px solid var(--line);
 padding:6px 9px;
 font-size:13px;
 font-weight:700;
}

.content{
 flex:1;
 min-height:0;
 padding:7px 9px;
 overflow-y:auto;
 overflow-x:hidden;
 -webkit-overflow-scrolling:touch;
}


/* =========================
   ENGLISH
========================= */

#raw{
 white-space:pre-wrap;
 font-size:16px;
 line-height:1.35;
}


/* =========================
   JAPANESE
========================= */

#translation{
 font-size:18px;
 line-height:1.35;
}

.translation-line{
 margin:0 0 4px;
}


/* =========================
   SUMMARY
========================= */

#summary{
 padding:6px 9px;
}

.topic{
 padding:4px 0 5px;
 border-bottom:1px solid #27313d;
}

.topic-title{
 font-size:15px;
 font-weight:750;
 color:#d9e7ff;
}

.topic-description{
 font-size:13px;
 line-height:1.25;
 color:#e0e5ec;
}


/* =========================
   PREDICTION
========================= */

#prediction{
 padding:5px 7px;
}

.prediction-card{
 margin:0 0 3px;
 padding:4px 7px;
 border-left:3px solid var(--accent);
 background:#101720;
 border-radius:4px;
}

.prediction-card.high{
 border-left-color:var(--red);
}

.prediction-card.medium{
 border-left-color:var(--yellow);
}

.prediction-card.low{
 border-left-color:var(--green);
}

.pred-top{
 display:flex;
 gap:5px;
 align-items:center;
 line-height:1.08;
}

.number{
 font-size:12px;
 font-weight:800;
}

.chance{
 font-size:11px;
 color:var(--muted);
 font-weight:700;
}

.situation{
 font-size:13px;
 font-weight:650;
}

.question{
 margin:1px 0;
 font-size:14px;
 line-height:1.15;
}

.answer{
 margin:1px 0;
 font-size:17px;
 line-height:1.15;
 font-weight:750;
 color:#c9dcff;
}

.jp{
 font-size:12px;
 line-height:1.12;
 color:var(--muted);
}

.muted{
 color:var(--muted);
}


/* =========================
   SMALL SCREEN
========================= */

@media(max-width:1000px){

 header strong{
  font-size:13px;
 }

 input{
  width:90px;
 }

 .chip{
  padding:0 5px;
 }

 #nextSpeak{
  max-width:330px;
 }

 button{
  padding:6px 7px;
 }

}

@media(orientation:portrait){

 main{
  grid-template-columns:1fr;
  grid-template-rows:1fr 1fr;
 }

}

</style>
</head>


<body>

<div id="app">


<!-- =========================
     TOP BAR
========================= -->

<header>

<strong>
🎙 Meeting AI
</strong>

<input
 id="apiKey"
 type="password"
 placeholder="API Key"
 autocomplete="off"
>

<div
 class="chip"
 id="timer"
>
⏱ 00:00:00
</div>

<div
 class="chip"
 id="questionAlert"
>
❓ QUESTION
</div>

<div
 class="chip"
 id="nextSpeak"
 title="タップでコピー"
>

<div class="small">
⭐ 次の発言（タップでコピー）
</div>

<div id="nextSpeakText">
—
</div>

</div>

<button
 class="primary"
 id="start"
>
開始
</button>

<button
 class="stop"
 id="stop"
 disabled
>
停止
</button>

<button
 class="save"
 id="finish"
>
会議終了・保存
</button>

</header>


<!-- =========================
     MAIN
========================= -->

<main>


<div class="left">


<section class="panel">

<div class="title">
🎙 English
</div>

<div
 class="content"
 id="raw"
>

<span class="muted">
English transcript...
</span>

</div>

</section>


<section class="panel">

<div class="title">
🇯🇵 リアルタイム日本語訳
</div>

<div
 class="content"
 id="translation"
>

<span class="muted">
日本語訳を順番に追加します。
</span>

</div>

</section>


</div>


<div class="right">


<section class="panel">

<div class="title">
📝 会議概要
</div>

<div
 class="content"
 id="summary"
>

<span class="muted">
大きな話題ごとに概要を残します。
</span>

</div>

</section>


<section class="panel">

<div class="title">
🔮 発言予測・回答候補
</div>

<div
 class="content"
 id="prediction"
>

<span class="muted">
会話に合わせて更新します。
</span>

</div>

</section>


</div>


</main>

</div>


<script>

/* =========================
   ELEMENTS
========================= */

const $ =
 id =>
 document.getElementById(id);


const rawEl =
 $("raw");

const translationEl =
 $("translation");

const summaryEl =
 $("summary");

const predictionEl =
 $("prediction");

const keyEl =
 $("apiKey");

const startBtn =
 $("start");

const stopBtn =
 $("stop");

const finishBtn =
 $("finish");

const timerEl =
 $("timer");

const questionAlert =
 $("questionAlert");

const nextSpeak =
 $("nextSpeak");

const nextSpeakText =
 $("nextSpeakText");


/* =========================
   VARIABLES
========================= */

let recognition = null;

let running = false;

let transcript = "";

let interimText = "";

let pendingEnglish = [];

let translating = false;

let analyzing = false;

let analysisTimer = null;

let topicHistory = [];

let currentTopicTitle = "";

let lastPredictionTranscript = "";

let meetingStart = null;

let timerInterval = null;

let translationHistory = [];


/* =========================
   API KEY
========================= */

keyEl.value =
 localStorage.getItem(
  "meeting_ai_key"
 ) || "";


keyEl.onchange =
 ()=>{

  localStorage.setItem(
   "meeting_ai_key",
   keyEl.value.trim()
  );

 };


/* =========================
   HELPERS
========================= */

function scrollBottom(el){

 requestAnimationFrame(
  ()=>{

   el.scrollTop =
    el.scrollHeight;

  }
 );

}


function esc(s){

 return String(s || "")

 .replaceAll(
  "&",
  "&amp;"
 )

 .replaceAll(
  "<",
  "&lt;"
 )

 .replaceAll(
  ">",
  "&gt;"
 )

 .replaceAll(
  '"',
  "&quot;"
 )

 .replaceAll(
  "'",
  "&#039;"
 );

}


function output(d){

 if(d.output_text){
  return d.output_text;
 }

 try{

  return d.output

  .flatMap(
   x => x.content || []
  )

  .filter(
   x =>
   x.type ===
   "output_text"
  )

  .map(
   x => x.text
  )

  .join("");

 }catch(e){

  return "";

 }

}


/* =========================
   OPENAI
========================= */

async function ai(prompt){

 const k =
  keyEl.value.trim();


 if(!k){

  throw Error(
   "APIキーを入力してください"
  );

 }


 const r =
 await fetch(

  "https://api.openai.com/v1/responses",

  {

   method:"POST",

   headers:{

    "Content-Type":
    "application/json",

    "Authorization":
    "Bearer " + k

   },

   body:
   JSON.stringify({

    model:
    "gpt-5-mini",

    input:
    prompt

   })

  }

 );


 const d =
  await r.json();


 if(!r.ok){

  throw Error(
   d?.error?.message ||
   "OpenAI API error"
  );

 }


 return output(d);

}


/* =========================
   TIMER
========================= */

function startTimer(){

 if(!meetingStart){

  meetingStart =
   Date.now();

 }


 clearInterval(
  timerInterval
 );


 timerInterval =
 setInterval(
  ()=>{

   let s =
    Math.floor(
     (
      Date.now() -
      meetingStart
     ) / 1000
    );


   const h =
    String(
     Math.floor(
      s / 3600
     )
    )
    .padStart(
     2,
     "0"
    );


   const m =
    String(
     Math.floor(
      (s % 3600) / 60
     )
    )
    .padStart(
     2,
     "0"
    );


   const sec =
    String(
     s % 60
    )
    .padStart(
     2,
     "0"
    );


   timerEl.textContent =
    `⏱ ${h}:${m}:${sec}`;

  },

  1000

 );

}


/* =========================
   QUESTION DETECTION
========================= */

function detectQuestion(t){

 const x =
  (t || "")
  .toLowerCase();


 const detected =
  /\?|\b(what|when|where|who|why|how|can you|could you|would you|do you|did you|are you|is there|have you|will you)\b/
  .test(x);


 if(!detected){
  return;
 }


 questionAlert.style.display =
  "flex";


 if(
  /japan|japanese/
  .test(x)
 ){

  questionAlert.textContent =
   "❓ Japan QUESTION";

 }else{

  questionAlert.textContent =
   "❓ QUESTION";

 }


 clearTimeout(
  detectQuestion.timer
 );


 detectQuestion.timer =
 setTimeout(
  ()=>{

   questionAlert.style.display =
    "none";

  },

  8000

 );

}


/* =========================
   SPEECH RECOGNITION
========================= */

function initRecognition(){

 const SR =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


 if(!SR){

  return null;

 }


 const r =
  new SR();


 r.continuous =
  true;


 r.interimResults =
  true;


 r.lang =
  "en-US";


 r.onresult =
  e=>{

   let newFinal =
    "";


   interimText =
    "";


   for(
    let i=e.resultIndex;
    i<e.results.length;
    i++
   ){

    const text =
     e.results[i][0]
     .transcript;


    if(
     e.results[i]
     .isFinal
    ){

     newFinal +=
      text.trim() +
      ". ";

    }else{

     interimText +=
      text;

    }

   }


   if(newFinal){

    transcript +=
     newFinal;


    pendingEnglish.push(
     newFinal.trim()
    );


    detectQuestion(
     newFinal
    );


    translatePending();


    scheduleAnalysis();

   }


   rawEl.textContent =
    (
     transcript +
     " " +
     interimText
    )
    .trim();


   scrollBottom(
    rawEl
   );

  };


 r.onend =
  ()=>{

   if(running){

    setTimeout(
     ()=>{

      try{

       r.start();

      }catch(e){}

     },

     250

    );

   }

  };


 return r;

}


/* =========================
   TRANSLATION
========================= */

async function translatePending(){

 if(
  translating ||
  !pendingEnglish.length
 ){
  return;
 }


 translating =
  true;


 const en =
  pendingEnglish
  .splice(
   0,
   2
  )
  .join(" ");


 try{

  const jp =
   (
    await ai(
`
Translate this spoken English into natural Japanese.

Do not summarize.
Do not explain.

Keep technical terminology accurate.

The context may involve:
metallography,
cutting,
mounting,
grinding,
polishing,
etching,
microscopy,
materials characterization,
customer samples,
technical testing.

Return ONLY Japanese.

English:

${en}
`
    )
   )
   .trim();


  translationHistory.push(
   jp
  );


  if(
   translationEl
   .querySelector(
    ".muted"
   )
  ){

   translationEl.innerHTML =
    "";

  }


  const div =
   document.createElement(
    "div"
   );


  div.className =
   "translation-line";


  div.textContent =
   jp;


  translationEl
  .appendChild(
   div
  );


  scrollBottom(
   translationEl
  );


 }catch(e){

  console.error(e);

 }finally{

  translating =
   false;


  if(
   pendingEnglish.length
  ){

   translatePending();

  }

 }

}


/* =========================
   ANALYSIS TIMER
========================= */

function scheduleAnalysis(){

 clearTimeout(
  analysisTimer
 );


 analysisTimer =
  setTimeout(
   updateAI,
   1200
  );

}


/* =========================
   MEETING AI
========================= */

async function updateAI(){

 if(analyzing){
  return;
 }


 const current =
  transcript.trim();


 if(
  !current ||
  current ===
  lastPredictionTranscript
 ){
  return;
 }


 analyzing =
  true;


 const recent =
  current.slice(
   -8000
  );


 const existing =
  topicHistory

  .map(
   (t,i)=>
   `${i+1}. ${t.title} - ${t.description}`
  )

  .join("\n");


 const first =
  !topicHistory.length;


 const prompt =
`
You are a real-time meeting assistant.

The user is a Japanese application engineer working with
metallographic sample preparation and materials characterization.

Return ONLY valid JSON.


TASK 1:
MEETING OVERVIEW

The meeting overview is a presentation agenda,
not a running summary.

${first
 ? "You MUST create the first meaningful topic."
 : "Create a new topic only if the major subject clearly changes."
}

Existing topics:

${existing || "None"}

Current topic:

${currentTopicTitle || "None"}


TASK 2:
SPEAKING PREDICTIONS

Predict up to 5 things the engineer may need to say NEXT.

Prioritize:

1. Direct questions
2. Japan or Japanese customers
3. Test results
4. Sample preparation conditions
5. Technical opinions
6. Useful voluntary comments

English answers must be:

- short
- easy to pronounce
- natural
- immediately usable

Never invent facts.

If information is unknown,
use safe answers such as:

I need to check the details.

We have not confirmed that yet.

I will check and share the information.


Return:

{
 "topic":{
   "changed":true,
   "title":"Short title",
   "description":"Short Japanese description"
 },
 "predictions":[
   {
     "chance":"high",
     "situation":"短い日本語",
     "question":"Likely English question",
     "answer_short":"Simple English answer",
     "answer_jp":"短い日本語訳"
   }
 ]
}


Transcript:

${recent}
`;


 try{

  const resultText =
   await ai(
    prompt
   );


  const cleaned =
   resultText

   .replace(
    /^```json/i,
    ""
   )

   .replace(
    /^```/,
    ""
   )

   .replace(
    /```$/,
    ""
   )

   .trim();


  const result =
   JSON.parse(
    cleaned
   );


  if(
   result.topic
  ){

   handleTopic(
    result.topic,
    first
   );

  }


  if(
   Array.isArray(
    result.predictions
   )
  ){

   renderPredictions(
    result.predictions
   );


   const best =
    result.predictions[0];


   nextSpeakText.textContent =
    best?.answer_short ||
    "—";

  }


  lastPredictionTranscript =
   current;


 }catch(e){

  console.error(e);

 }finally{

  analyzing =
   false;


  if(
   transcript.trim() !==
   lastPredictionTranscript
  ){

   scheduleAnalysis();

  }

 }

}


/* =========================
   TOPIC
========================= */

function handleTopic(
 t,
 first
){

 if(
  !t?.title
 ){
  return;
 }


 const title =
  String(
   t.title
  )
  .trim();


 const description =
  String(
   t.description || ""
  )
  .trim();


 const same =
  currentTopicTitle &&
  title.toLowerCase() ===
  currentTopicTitle.toLowerCase();


 const duplicate =
  topicHistory.some(
   x =>
   x.title.toLowerCase() ===
   title.toLowerCase()
  );


 if(
  first ||
  (
   t.changed &&
   !same &&
   !duplicate
  )
 ){

  if(!duplicate){

   topicHistory.push({

    title,
    description

   });

  }


  currentTopicTitle =
   title;


  renderTopics();

 }

}


/* =========================
   TOPIC DISPLAY
========================= */

function renderTopics(){

 summaryEl.innerHTML =
  topicHistory

  .map(
   t=>
`
<div class="topic">

<div class="topic-title">
• ${esc(t.title)}
</div>

<div class="topic-description">
${esc(t.description)}
</div>

</div>
`
  )

  .join("");


 scrollBottom(
  summaryEl
 );

}


/* =========================
   PREDICTIONS
========================= */

function renderPredictions(
 items
){

 predictionEl.innerHTML =
  items

  .slice(
   0,
   5
  )

  .map(
   (p,i)=>{

    const chance =
     [
      "high",
      "medium",
      "low"
     ]
     .includes(
      p.chance
     )
     ? p.chance
     : "medium";


    const label =
     chance === "high"
     ? "高"
     : chance === "medium"
     ? "中"
     : "低";


    return `
<div class="prediction-card ${chance}">

<div class="pred-top">

<span class="number">
${i+1}
</span>

<span class="chance">
可能性 ${label}
</span>

<span class="situation">
${esc(p.situation)}
</span>

</div>

<div class="question">
<b>Q:</b>
${esc(p.question)}
</div>

<div class="answer">
${esc(p.answer_short)}
</div>

<div class="jp">
${esc(p.answer_jp)}
</div>

</div>
`;

   }

  )

  .join("");


 /*
 発言予測は最重要候補が
 一番上に見えるようにする
 */

 predictionEl.scrollTop =
  0;

}


/* =========================
   COPY NEXT ANSWER
========================= */

nextSpeak.onclick =
 async ()=>{

  const text =
   nextSpeakText
   .textContent;


  if(
   !text ||
   text === "—"
  ){
   return;
  }


  try{

   await navigator
   .clipboard
   .writeText(
    text
   );


   const old =
    text;


   nextSpeakText.textContent =
    "✓ コピーしました";


   setTimeout(
    ()=>{

     nextSpeakText.textContent =
      old;

    },

    900

   );

  }catch(e){}

 };


/* =========================
   START
========================= */

startBtn.onclick =
 ()=>{

  if(
   !keyEl.value.trim()
  ){

   alert(
    "OpenAI APIキーを入力してください。"
   );

   return;

  }


  localStorage.setItem(
   "meeting_ai_key",
   keyEl.value.trim()
  );


  recognition =
   recognition ||
   initRecognition();


  if(!recognition){

   alert(
    "このブラウザは音声認識に対応していません。"
   );

   return;

  }


  running =
   true;


  startBtn.disabled =
   true;


  stopBtn.disabled =
   false;


  startTimer();


  try{

   recognition.start();

  }catch(e){}

 };


/* =========================
   STOP
========================= */

stopBtn.onclick =
 ()=>{

  running =
   false;


  clearTimeout(
   analysisTimer
  );


  startBtn.disabled =
   false;


  stopBtn.disabled =
   true;


  if(recognition){

   try{

    recognition.stop();

   }catch(e){}

  }


  if(
   pendingEnglish.length
  ){

   translatePending();

  }


  if(
   transcript.trim()
  ){

   updateAI();

  }

 };


/* =========================
   DOWNLOAD TXT
========================= */

function downloadText(
 name,
 text
){

 const blob =
  new Blob(
   [
    "\ufeff" +
    text
   ],
   {
    type:
    "text/plain;charset=utf-8"
   }
  );


 const url =
  URL.createObjectURL(
   blob
  );


 const a =
  document.createElement(
   "a"
  );


 a.href =
  url;


 a.download =
  name;


 document.body
 .appendChild(
  a
 );


 a.click();


 a.remove();


 setTimeout(
  ()=>{

   URL.revokeObjectURL(
    url
   );

  },

  1000

 );

}


/* =========================
   FINISH + SAVE
========================= */

finishBtn.onclick =
 async ()=>{

  if(
   !transcript.trim()
  ){

   alert(
    "保存する会議内容がありません。"
   );

   return;

  }


  running =
   false;


  clearTimeout(
   analysisTimer
  );


  clearInterval(
   timerInterval
  );


  if(recognition){

   try{

    recognition.stop();

   }catch(e){}

  }


  finishBtn.disabled =
   true;


  finishBtn.textContent =
   "まとめ作成中…";


  try{

   const topics =
    topicHistory

    .map(
     t =>
     `- ${t.title}: ${t.description}`
    )

    .join("\n");


   const finalPrompt =
`
Create a concise Japanese final meeting report.

Do not invent facts.

Use exactly these headings:

【会議まとめ】

【決定事項】

【Action Items】

【確認・未解決事項】


For Action Items:

Include owner only if actually stated.

Include deadline only if actually stated.

If the information is unknown,
write 不明.

If there are no relevant items,
write 特になし.


Known meeting topics:

${topics || "なし"}


Full transcript:

${transcript}
`;


   const report =
    (
     await ai(
      finalPrompt
     )
    )
    .trim();


   const now =
    new Date();


   const stamp =
    `${now.getFullYear()}-${
     String(
      now.getMonth()+1
     )
     .padStart(
      2,
      "0"
     )
    }-${
     String(
      now.getDate()
     )
     .padStart(
      2,
      "0"
     )
    }_${
     String(
      now.getHours()
     )
     .padStart(
      2,
      "0"
     )
    }-${
     String(
      now.getMinutes()
     )
     .padStart(
      2,
      "0"
     )
    }`;


   const text =
`Meeting AI 会議記録

日時:
${now.toLocaleString("ja-JP")}


==============================
AI 会議まとめ
==============================

${report}


==============================
会議概要履歴
==============================

${topics || "なし"}


==============================
English Transcript
==============================

${transcript}


==============================
日本語訳
==============================

${translationHistory.join("\n") || "なし"}
`;


   downloadText(

    `Meeting_AI_${stamp}.txt`,

    text

   );


   alert(
    "会議まとめを保存しました。"
   );


  }catch(e){

   console.error(e);


   alert(
    "まとめ作成に失敗しました。\n" +
    e.message
   );


  }finally{

   finishBtn.disabled =
    false;


   finishBtn.textContent =
    "会議終了・保存";


   startBtn.disabled =
    false;


   stopBtn.disabled =
    true;

  }

 };

</script>

</body>
</html>
