<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Meeting AI</title>

<style>
:root{
 --gap:6px;--bg:#090d12;--panel:#121923;--panel2:#0d141c;
 --line:#293544;--text:#f3f6fa;--muted:#9eabb9;
 --blue:#78a9ff;--green:#68d78e;--red:#ff8585;
 --orange:#ffad66;--purple:#b79cff;
}
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:var(--bg);color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
#app{
 height:100%;display:grid;grid-template-rows:58px 1fr;
 gap:var(--gap);padding:var(--gap);
}
header{
 display:flex;align-items:center;gap:5px;min-width:0;
 background:var(--panel);border:1px solid var(--line);
 border-radius:10px;padding:5px 7px;
}
.logo{font-size:13px;font-weight:800;white-space:nowrap}
button,input,select,.fileBtn{
 border:1px solid var(--line);background:#1c2733;color:white;
 border-radius:7px;padding:6px 8px;font-size:10px;white-space:nowrap;
}
button{cursor:pointer}
button:disabled{opacity:.45}
.modeActive{background:#245db8;border-color:#4b83d5}
#liveMode.modeActive{background:#8a3535}
#videoFile{display:none}
.fileBtn{cursor:pointer;background:#384557}
#apiKey{width:72px}
#timer{font-variant-numeric:tabular-nums}
.chip{
 height:36px;display:flex;align-items:center;padding:0 6px;
 border:1px solid var(--line);border-radius:7px;background:#0d141c;
 font-size:10px;
}
#currentTopicBox{
 flex:1;min-width:120px;height:38px;padding:3px 8px;
 border:1px solid var(--line);border-radius:7px;background:#0d141c;
 overflow:hidden;
}
.smallLabel{font-size:8px;color:var(--muted)}
#currentTopic{
 margin-top:2px;font-size:12px;font-weight:750;color:#d7e5ff;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
main{
 min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);
}
.left{
 min-height:0;display:grid;grid-template-rows:39% 30.5% 30.5%;
 gap:var(--gap);
}
.right{
 min-height:0;display:grid;grid-template-rows:32% 68%;gap:var(--gap);
}
.panel{
 min-height:0;display:flex;flex-direction:column;overflow:hidden;
 background:var(--panel);border:1px solid var(--line);border-radius:9px;
}
.title{
 flex:none;padding:5px 8px;border-bottom:1px solid var(--line);
 font-size:11px;font-weight:750;
}
.content{
 flex:1;min-height:0;overflow:auto;padding:6px 8px;
 -webkit-overflow-scrolling:touch;
}

/* TOP MEDIA */
#mediaWorkspace{
 flex:1;min-height:0;display:grid;grid-template-columns:58% 42%;
 background:#05080c;
}
#mediaLeft{
 min-width:0;min-height:0;background:#000;
 border-right:1px solid var(--line);
 display:flex;flex-direction:column;
}
#cameraVideo,#practiceVideo{
 width:100%;flex:1;min-height:0;object-fit:contain;
 object-position:left center;background:black;
}
#practiceVideo{display:none}
#videoControls{
 display:none;flex:none;gap:4px;align-items:center;
 padding:3px;background:#0b1118;
}
#videoControls button,#videoControls select{padding:4px 6px}
#videoTime{margin-left:auto;font-size:9px;color:#aeb9c5}
#mediaInfo{
 min-width:0;min-height:0;padding:7px 9px;overflow:auto;background:#0e151e;
}
.aiLabel{font-size:9px;font-weight:800;color:var(--green);margin-bottom:4px}
#mediaTitle{font-size:14px;font-weight:800;color:#a7caff;margin-bottom:5px}
#mediaDescription{font-size:11px;line-height:1.3;color:#e1e7ed}
.subLabel{margin-top:7px;margin-bottom:3px;font-size:9px;color:#8997a6}
#keywords{display:flex;gap:3px;flex-wrap:wrap}
.keyword{
 padding:2px 5px;border-radius:4px;background:#192636;
 border:1px solid #34485e;font-size:9px;color:#d6e4f4;
}
#mediaStatus{
 margin-top:7px;padding-top:5px;border-top:1px solid #293544;
 color:#77d998;font-size:9px;
}

/* TRANSCRIPT */
#lineEN,#lineJP{font-size:15px;line-height:1.28}
#lineJP{font-size:16px}
.speechLine{
 margin:0 0 3px;padding-left:5px;border-left:3px solid transparent;
}
.spA{border-color:#82b1ff}
.spB{border-color:#70d995}
.spC{border-color:#ffad66}
.spD{border-color:#b79cff}
.enA{color:#82b1ff}.enB{color:#70d995}
.enC{color:#ffad66}.enD{color:#b79cff}

/* OVERVIEW */
.topic{
 padding:4px 0;border-bottom:1px solid #26313e;
}
.topic strong{font-size:13px;color:#d3e2ff}
.topic div{margin-top:2px;font-size:11px;color:#d4dae1}

/* PREDICTIONS */
.card{
 margin-bottom:4px;padding:5px 7px;background:#0d151e;border-radius:4px;
}
.incoming{border-left:3px solid var(--red)}
.outgoing{border-left:3px solid var(--green)}
.cardHead{font-size:10px;font-weight:800;margin-bottom:2px}
.incoming .cardHead{color:#ff9999}
.outgoing .cardHead{color:#7ee09e}
.qjp{font-size:13px;font-weight:700}
.qen{font-size:11px;color:#b9c9df;margin-top:2px}
.answer{font-size:15px;font-weight:750;color:#d0e0ff;margin-top:3px}
.answerJP{font-size:11px;color:#aeb8c6}

/* PROCESS */
#processing{
 display:none;position:fixed;inset:0;z-index:100;
 align-items:center;justify-content:center;background:rgba(0,0,0,.82);
}
.processBox{
 width:min(500px,80vw);padding:20px;text-align:center;
 background:#121923;border:1px solid #344354;border-radius:12px;
}
#processTitle{font-size:17px;font-weight:800}
#processText{margin-top:7px;color:#aeb9c5;font-size:12px}
.progress{height:7px;margin-top:14px;background:#27313d;border-radius:5px;overflow:hidden}
#progressBar{height:100%;width:10%;background:#4d8ee8;transition:.3s}
#captureCanvas{display:none}

@media(max-width:1000px){
 .logo{font-size:11px}
 button,input,select,.fileBtn{padding:5px;font-size:9px}
 #apiKey{width:62px}
 #currentTopic{font-size:11px}
}
</style>
</head>

<body>

<div id="app">

<header>
 <div class="logo">🎙 Meeting AI</div>

 <button id="liveMode" class="modeActive">🔴 LIVE</button>
 <button id="practiceMode">🎬 動画練習</button>

 <label id="videoPicker" class="fileBtn" style="display:none">
  📁 動画
  <input id="videoFile" type="file" accept="video/*,audio/*">
 </label>

 <button id="cameraBtn">📷 資料読取</button>

 <input id="apiKey" type="password" placeholder="API Key">

 <div class="chip" id="timer">⏱ 00:00:00</div>

 <div id="currentTopicBox">
  <div class="smallLabel">💬 現在の話題</div>
  <div id="currentTopic">会議開始を待っています</div>
 </div>

 <button id="analyzeVideo" style="display:none" disabled>🤖 初回解析</button>
 <button id="startBtn">開始</button>
 <button id="stopBtn" disabled>停止</button>
 <button id="finishBtn">終了・保存</button>
</header>

<main>

<div class="left">

<section class="panel">
 <div class="title" id="mediaHeader">📷 資料読取</div>

 <div id="mediaWorkspace">

  <div id="mediaLeft">

   <video id="cameraVideo" autoplay muted playsinline></video>

   <video id="practiceVideo" controls playsinline></video>

   <div id="videoControls">
    <button id="back10">↶10秒</button>
    <button id="playPause">▶</button>

    <select id="speed">
     <option value=".75">0.75×</option>
     <option value="1" selected>1.0×</option>
     <option value="1.25">1.25×</option>
     <option value="1.5">1.5×</option>
    </select>

    <span id="videoTime">00:00 / 00:00</span>
   </div>

  </div>

  <div id="mediaInfo">
   <div class="aiLabel" id="aiMediaLabel">🤖 AI資料読取</div>

   <div id="mediaTitle">資料読取 OFF</div>

   <div id="mediaDescription">
    カメラをONにすると資料を読み取ります。
   </div>

   <div class="subLabel">重要ポイント</div>
   <div id="keywords">－</div>

   <div id="mediaStatus">📷 保存画像 0枚</div>
  </div>

 </div>
</section>

<section class="panel">
 <div class="title">🎙 English</div>
 <div class="content" id="lineEN">English transcript...</div>
</section>

<section class="panel">
 <div class="title">🇯🇵 リアルタイム日本語訳</div>
 <div class="content" id="lineJP">日本語訳を表示します。</div>
</section>

</div>

<div class="right">

<section class="panel">
 <div class="title">📝 会議概要</div>
 <div class="content" id="overview">会議概要を表示します。</div>
</section>

<section class="panel">
 <div class="title">🔮 質問予測・こちらから質問</div>
 <div class="content" id="predictions">会話から質問を予測します。</div>
</section>

</div>

</main>
</div>

<canvas id="captureCanvas"></canvas>

<div id="processing">
 <div class="processBox">
  <div id="processTitle">解析中</div>
  <div id="processText">準備しています…</div>
  <div class="progress"><div id="progressBar"></div></div>
 </div>
</div>

<script>
const $=id=>document.getElementById(id);

const apiKey=$("apiKey");
const liveMode=$("liveMode");
const practiceMode=$("practiceMode");
const videoPicker=$("videoPicker");
const videoFile=$("videoFile");
const analyzeVideo=$("analyzeVideo");
const startBtn=$("startBtn");
const stopBtn=$("stopBtn");
const finishBtn=$("finishBtn");
const cameraBtn=$("cameraBtn");

const cameraVideo=$("cameraVideo");
const practiceVideo=$("practiceVideo");
const videoControls=$("videoControls");
const mediaHeader=$("mediaHeader");
const aiMediaLabel=$("aiMediaLabel");
const mediaTitle=$("mediaTitle");
const mediaDescription=$("mediaDescription");
const keywordsEl=$("keywords");
const mediaStatus=$("mediaStatus");

const lineEN=$("lineEN");
const lineJP=$("lineJP");
const overviewEl=$("overview");
const predictionsEl=$("predictions");
const currentTopicEl=$("currentTopic");
const timerEl=$("timer");
const captureCanvas=$("captureCanvas");

let mode="live";

/* LIVE */
let recognition=null;
let liveRunning=false;
let transcript="";
let interim="";
let pendingEnglish=[];
let translating=false;

/* COMMON */
let topicHistory=[];
let lastAISignature="";
let aiRunning=false;
let aiTimer=null;
let translationHistory=[];

/* TIMER */
let meetingStart=null;
let timerInterval=null;

/* CAMERA */
let cameraStream=null;
let cameraRunning=false;
let cameraTimer=null;
let previousFingerprint=null;
let slideAnalyzing=false;
let currentSlide={title:"",description:"",keywords:[]};
let savedSlides=[];

/* VIDEO */
let selectedVideoFile=null;
let videoURL=null;
let videoSegments=[];
let videoTranslations=[];
let currentVideoSegment=-1;
let lastVideoAI=-999;

/* ==============================
 API KEY
============================== */

apiKey.value=localStorage.getItem("meeting_ai_key")||"";

apiKey.onchange=()=>{
 localStorage.setItem("meeting_ai_key",apiKey.value.trim());
};

/* ==============================
 HELPERS
============================== */

function esc(s){
 return String(s||"")
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");
}

function cleanJSON(s){
 return String(s||"")
 .replace(/^```json/i,"")
 .replace(/^```/,"")
 .replace(/```$/,"")
 .trim();
}

function outputText(data){
 if(data.output_text)return data.output_text;
 try{
  return data.output.flatMap(x=>x.content||[])
  .filter(x=>x.type==="output_text")
  .map(x=>x.text).join("");
 }catch{return""}
}

function formatTime(sec){
 if(!Number.isFinite(sec))return"00:00";
 const m=Math.floor(sec/60);
 const s=Math.floor(sec%60);
 return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

function speakerLetter(s){
 const x=String(s||"A").replace("speaker_","").toUpperCase();
 return ["A","B","C","D"].includes(x)?x:"A";
}

function showProcess(title,text,pct){
 $("processing").style.display="flex";
 $("processTitle").textContent=title;
 $("processText").textContent=text;
 $("progressBar").style.width=pct+"%";
}
function hideProcess(){
 $("processing").style.display="none";
}

/* ==============================
 OPENAI TEXT
============================== */

async function callAI(prompt){

 const key=apiKey.value.trim();
 if(!key)throw new Error("APIキーを入力してください。");

 const r=await fetch("https://api.openai.com/v1/responses",{
  method:"POST",
  headers:{
   "Content-Type":"application/json",
   "Authorization":"Bearer "+key
  },
  body:JSON.stringify({
   model:"gpt-5-mini",
   input:prompt
  })
 });

 const data=await r.json();

 if(!r.ok)throw new Error(data?.error?.message||"APIエラー");

 return outputText(data);
}

/* =====================================================
 MODE SWITCH
===================================================== */

liveMode.onclick=()=>setMode("live");
practiceMode.onclick=()=>setMode("video");

function setMode(newMode){

 if(mode===newMode)return;

 stopLive();
 stopCamera();
 practiceVideo.pause();

 mode=newMode;

 topicHistory=[];
 lastAISignature="";
 currentVideoSegment=-1;
 lastVideoAI=-999;

 overviewEl.textContent="会議概要を表示します。";
 predictionsEl.textContent="会話から質問を予測します。";

 if(mode==="live"){

  liveMode.classList.add("modeActive");
  practiceMode.classList.remove("modeActive");

  videoPicker.style.display="none";
  analyzeVideo.style.display="none";

  cameraBtn.style.display="";
  startBtn.style.display="";
  stopBtn.style.display="";

  cameraVideo.style.display="";
  practiceVideo.style.display="none";
  videoControls.style.display="none";

  mediaHeader.textContent="📷 資料読取";
  aiMediaLabel.textContent="🤖 AI資料読取";

  mediaTitle.textContent="資料読取 OFF";
  mediaDescription.textContent="カメラをONにすると資料を読み取ります。";

  currentTopicEl.textContent="会議開始を待っています";

  renderLiveTranscript();

 }else{

  liveMode.classList.remove("modeActive");
  practiceMode.classList.add("modeActive");

  videoPicker.style.display="";
  analyzeVideo.style.display="";

  cameraBtn.style.display="none";
  startBtn.style.display="none";
  stopBtn.style.display="none";

  cameraVideo.style.display="none";
  practiceVideo.style.display="";
  videoControls.style.display="flex";

  mediaHeader.textContent="🎬 ミーティング動画";
  aiMediaLabel.textContent="🤖 動画練習";

  mediaTitle.textContent="動画を選択してください";
  mediaDescription.textContent="解析後、再生位置に合わせてリアルタイム風に翻訳します。";

  currentTopicEl.textContent="動画を選択してください";

  renderVideoAt(0);
 }
}

/* =====================================================
 TIMER
===================================================== */

function startTimer(){
 if(!meetingStart)meetingStart=Date.now();

 clearInterval(timerInterval);

 timerInterval=setInterval(()=>{
  const sec=Math.floor((Date.now()-meetingStart)/1000);
  const h=String(Math.floor(sec/3600)).padStart(2,"0");
  const m=String(Math.floor((sec%3600)/60)).padStart(2,"0");
  const s=String(sec%60).padStart(2,"0");
  timerEl.textContent=`⏱ ${h}:${m}:${s}`;
 },1000);
}

/* =====================================================
 LIVE SPEECH
===================================================== */

function initRecognition(){

 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR)return null;

 const r=new SR();

 r.continuous=true;
 r.interimResults=true;
 r.lang="en-US";

 r.onresult=e=>{

  let newFinal="";
  interim="";

  for(let i=e.resultIndex;i<e.results.length;i++){
   const t=e.results[i][0].transcript;

   if(e.results[i].isFinal)
    newFinal+=t.trim()+". ";
   else
    interim+=t;
  }

  if(newFinal){
   transcript+=newFinal;
   pendingEnglish.push(newFinal.trim());
   translateLive();
   scheduleLiveAI();
  }

  renderLiveTranscript();
 };

 r.onend=()=>{
  if(liveRunning){
   setTimeout(()=>{
    try{r.start()}catch{}
   },250);
  }
 };

 return r;
}

function renderLiveTranscript(){
 if(mode!=="live")return;

 lineEN.textContent=(transcript+" "+interim).trim()||"English transcript...";
 lineEN.scrollTop=lineEN.scrollHeight;
}

startBtn.onclick=()=>{

 if(!apiKey.value.trim()){
  alert("APIキーを入力してください。");
  return;
 }

 recognition=recognition||initRecognition();

 if(!recognition){
  alert("このブラウザでは音声認識を利用できません。");
  return;
 }

 liveRunning=true;
 startBtn.disabled=true;
 stopBtn.disabled=false;

 startTimer();

 try{recognition.start()}catch{}
};

stopBtn.onclick=stopLive;

function stopLive(){

 liveRunning=false;

 if(recognition){
  try{recognition.stop()}catch{}
 }

 startBtn.disabled=false;
 stopBtn.disabled=true;
}

async function translateLive(){

 if(translating||!pendingEnglish.length)return;

 translating=true;

 const english=pendingEnglish.splice(0,2).join(" ");

 try{

  const jp=(await callAI(`
Translate this spoken English directly into natural Japanese.
Do not summarize.
Do not explain.
Return only Japanese.

${english}
`)).trim();

  translationHistory.push({english,japanese:jp});

  if(lineJP.textContent==="日本語訳を表示します.")
   lineJP.innerHTML="";

  const div=document.createElement("div");
  div.className="speechLine";
  div.textContent=jp;
  lineJP.appendChild(div);
  lineJP.scrollTop=lineJP.scrollHeight;

 }catch(e){
  console.error(e);
 }finally{
  translating=false;
  if(pendingEnglish.length)translateLive();
 }
}

/* =====================================================
 CAMERA
===================================================== */

cameraBtn.onclick=async()=>{

 if(cameraRunning){
  stopCamera();
  return;
 }

 try{

  cameraStream=await navigator.mediaDevices.getUserMedia({
   video:{
    facingMode:{ideal:"environment"},
    width:{ideal:1280},
    height:{ideal:720}
   },
   audio:false
  });

  cameraVideo.srcObject=cameraStream;
  await cameraVideo.play();

  cameraRunning=true;
  cameraBtn.textContent="📷 資料読取 ON";

  mediaTitle.textContent="資料を監視しています";
  mediaDescription.textContent="スライドが変わると自動で読み取ります。";

  previousFingerprint=null;

  setTimeout(checkSlide,1000);
  cameraTimer=setInterval(checkSlide,3000);

 }catch(e){
  alert("カメラを開始できませんでした。");
 }
};

function stopCamera(){

 cameraRunning=false;

 clearInterval(cameraTimer);

 if(cameraStream)
  cameraStream.getTracks().forEach(t=>t.stop());

 cameraStream=null;
 cameraVideo.srcObject=null;

 cameraBtn.textContent="📷 資料読取";
}

function captureFrame(){

 if(!cameraVideo.videoWidth)return null;

 const max=1280;
 const scale=Math.min(1,max/cameraVideo.videoWidth);

 captureCanvas.width=Math.round(cameraVideo.videoWidth*scale);
 captureCanvas.height=Math.round(cameraVideo.videoHeight*scale);

 const ctx=captureCanvas.getContext("2d");
 ctx.drawImage(cameraVideo,0,0,captureCanvas.width,captureCanvas.height);

 return captureCanvas.toDataURL("image/jpeg",.76);
}

function fingerprint(){

 if(!cameraVideo.videoWidth)return null;

 const c=document.createElement("canvas");
 c.width=40;c.height=22;

 const ctx=c.getContext("2d",{willReadFrequently:true});
 ctx.drawImage(cameraVideo,0,0,40,22);

 const d=ctx.getImageData(0,0,40,22).data;
 const a=[];

 for(let i=0;i<d.length;i+=4)
  a.push((d[i]+d[i+1]+d[i+2])/3);

 return a;
}

function fingerprintDiff(a,b){
 if(!a||!b)return 999;

 let t=0;
 for(let i=0;i<a.length;i++)
  t+=Math.abs(a[i]-b[i]);

 return t/a.length;
}

async function analyzeSlideImage(image){

 const key=apiKey.value.trim();

 const r=await fetch("https://api.openai.com/v1/responses",{
  method:"POST",
  headers:{
   "Content-Type":"application/json",
   "Authorization":"Bearer "+key
  },
  body:JSON.stringify({
   model:"gpt-5-mini",
   input:[{
    role:"user",
    content:[
     {
      type:"input_text",
      text:`Read this technical presentation slide.

Return only valid JSON:

{
"title":"short title",
"description":"日本語で内容を1～3文",
"keywords":["重要点1","重要点2","重要点3"]
}

Do not invent unreadable information.`
     },
     {type:"input_image",image_url:image}
    ]
   }]
  })
 });

 const data=await r.json();

 if(!r.ok)throw new Error(data?.error?.message||"画像解析エラー");

 return JSON.parse(cleanJSON(outputText(data)));
}

async function checkSlide(){

 if(!cameraRunning||slideAnalyzing)return;

 const fp=fingerprint();
 if(!fp)return;

 const diff=fingerprintDiff(previousFingerprint,fp);

 if(previousFingerprint&&diff<13)return;

 previousFingerprint=fp;

 const image=captureFrame();
 if(!image)return;

 slideAnalyzing=true;

 try{

  const result=await analyzeSlideImage(image);

  const next={
   title:String(result.title||"").trim(),
   description:String(result.description||"").trim(),
   keywords:Array.isArray(result.keywords)?result.keywords:[]
  };

  const changed=
   !currentSlide.title||
   (next.title+"|"+next.description)!==
   (currentSlide.title+"|"+currentSlide.description);

  currentSlide=next;

  mediaTitle.textContent=next.title||"資料";
  mediaDescription.textContent=next.description||"";

  keywordsEl.innerHTML=next.keywords.length
   ?next.keywords.slice(0,6).map(x=>`<span class="keyword">${esc(x)}</span>`).join("")
   :"－";

  if(changed){

   savedSlides.push({
    time:new Date().toLocaleTimeString("ja-JP"),
    title:next.title,
    description:next.description,
    keywords:next.keywords,
    image
   });

   mediaStatus.textContent=`📷 自動保存 ${savedSlides.length}枚`;

   scheduleLiveAI();
  }

 }catch(e){
  console.error(e);
 }finally{
  slideAnalyzing=false;
 }
}

/* =====================================================
 LIVE AI
===================================================== */

function scheduleLiveAI(){
 clearTimeout(aiTimer);
 aiTimer=setTimeout(updateLiveAI,1200);
}

async function updateLiveAI(){

async function transcribeVideo(file){

 const form=new FormData();

 form.append("file",file,file.name);
 form.append("model","gpt-4o-transcribe-diarize");
 form.append("response_format","diarized_json");
 form.append("chunking_strategy","auto");

 const r=await fetch("https://api.openai.com/v1/audio/transcriptions",{
  method:"POST",
  headers:{
   "Authorization":"Bearer "+apiKey.value.trim()
  },
  body:form
 });

 const data=await r.json();

 if(!r.ok)throw new Error(data?.error?.message||"文字起こしエラー");

 if(!Array.isArray(data.segments))
  throw new Error("話者付き文字起こしを取得できませんでした。");

 return data.segments.map(x=>({
  start:Number(x.start||0),
  end:Number(x.end||0),
  speaker:String(x.speaker||"A"),
  text:String(x.text||"").trim()
 }));
}

async function translateVideoSegments(){

 const results=[];
 const batchSize=25;

 for(let i=0;i<videoSegments.length;i+=batchSize){

  const batch=videoSegments.slice(i,i+batchSize);

  showProcess(
   "② 日本語訳を作成中",
   `${Math.min(i+batchSize,videoSegments.length)} / ${videoSegments.length}`,
   45+Math.round(45*i/Math.max(videoSegments.length,1))
  );

  const input=batch.map((s,j)=>({id:i+j,text:s.text}));

  const parsed=JSON.parse(cleanJSON(await callAI(`
Translate each English meeting utterance directly into natural Japanese.
Do not summarize.
Return ONLY JSON:

{"items":[{"id":0,"jp":"日本語"}]}

INPUT:
${JSON.stringify(input)}
`)));

  for(const x of parsed.items||[])
   results[Number(x.id)]=String(x.jp||"");
 }

 return results;
}

/* =====================================================
 VIDEO RENDER
===================================================== */

function videoIndexAt(time){

 let found=-1;

 for(let i=0;i<videoSegments.length;i++){
  if(videoSegments[i].start<=time)found=i;
  else break;
 }

 return found;
}

function renderVideoAt(time){

 if(mode!=="video"||!videoSegments.length)return;

 const index=videoIndexAt(time);

 if(index<0){
  lineEN.textContent="再生待ち";
  lineJP.textContent="再生待ち";
  return;
 }

 if(index===currentVideoSegment)return;

 currentVideoSegment=index;

 const from=Math.max(0,index-8);

 const visible=videoSegments.slice(from,index+1);

 lineEN.innerHTML=visible.map((s,j)=>{
  const sp=speakerLetter(s.speaker);
  return `<div class="speechLine sp${sp} en${sp}">${esc(s.text)}</div>`;
 }).join("");

 lineJP.innerHTML=visible.map((s,j)=>{
  const n=from+j;
  const sp=speakerLetter(s.speaker);
  return `<div class="speechLine sp${sp}">${esc(videoTranslations[n]||"…")}</div>`;
 }).join("");

 lineEN.scrollTop=lineEN.scrollHeight;
 lineJP.scrollTop=lineJP.scrollHeight;

 const current=videoSegments[index];

 mediaStatus.textContent=
  `🎙 話者 ${speakerLetter(current.speaker)}　${formatTime(current.start)}`;
}

}

/* =====================================================
 COMMON AI DISPLAY
===================================================== */

function applyMeetingAI(result){

 if(result.current_topic)
  currentTopicEl.textContent=result.current_topic;

 if(result.topic?.title){

  const title=String(result.topic.title);

  const exists=topicHistory.some(
   x=>x.title.toLowerCase()===title.toLowerCase()
  );

  if((result.topic.changed||!topicHistory.length)&&!exists){

   topicHistory.push({
    title,
    description:String(result.topic.description||"")
   });

   renderOverview();
  }
 }

 renderPredictions(result.items||[]);
}

function renderOverview(){

 overviewEl.innerHTML=topicHistory.length
 ?topicHistory.map(x=>`
<div class="topic">
 <strong>• ${esc(x.title)}</strong>
 <div>${esc(x.description)}</div>
</div>`).join("")
 :"会議概要を表示します。";
}

function renderPredictions(items){

 if(!items.length)return;

 predictionsEl.innerHTML=items.slice(0,5).map(x=>{

  if(x.type==="outgoing"){

   return `
<div class="card outgoing">
 <div class="cardHead">🟢 こちらから質問</div>
 <div class="qjp">${esc(x.question_jp)}</div>
 <div class="answer">${esc(x.question_en)}</div>
</div>`;
  }

  const chance=
   x.chance==="high"?"高":
   x.chance==="low"?"低":"中";

  return `
<div class="card incoming">
 <div class="cardHead">🔴 質問予測　可能性 ${chance}</div>
 <div class="qjp">${esc(x.question_jp)}</div>
 <div class="qen">${esc(x.question_en)}</div>
 <div class="answer">${esc(x.answer_en)}</div>
 <div class="answerJP">${esc(x.answer_jp)}</div>
</div>`;

 }).join("");
}

function downloadHTML(html,name){

 const blob=new Blob([html],{type:"text/html;charset=utf-8"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");

 a.href=url;

 a.download=
  `${name}_${new Date().toISOString().slice(0,16).replaceAll(":","-")}.html`;

 document.body.appendChild(a);
 a.click();
 a.remove();

 setTimeout(()=>URL.revokeObjectURL(url),1500);
}
