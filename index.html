<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Meeting AI</title>

<style>
:root{
 --gap:6px;
 --bg:#0b0f14;
 --panel:#141b24;
 --line:#293342;
 --text:#f3f6fa;
 --muted:#aeb8c6;
 --accent:#78a9ff;
 --green:#65d18a;
 --red:#ff8585;
 --yellow:#ffd36a;
}

*{box-sizing:border-box}

html,body{
 margin:0;
 width:100%;
 height:100%;
 background:var(--bg);
 color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 overflow:hidden;
}

#app{
 height:100%;
 display:grid;
 grid-template-rows:48px 1fr;
 gap:var(--gap);
 padding:var(--gap);
}

header{
 display:flex;
 align-items:center;
 gap:6px;
 background:var(--panel);
 border:1px solid var(--line);
 border-radius:10px;
 padding:5px 8px;
}

header strong{
 font-size:16px;
 white-space:nowrap;
}

.status{
 margin-left:auto;
 font-size:11px;
 color:var(--muted);
 white-space:nowrap;
}

input{
 width:145px;
 min-width:80px;
 border:1px solid var(--line);
 background:#0e141c;
 color:white;
 border-radius:7px;
 padding:6px 7px;
 font-size:11px;
}

button{
 border:1px solid var(--line);
 background:#202a37;
 color:white;
 border-radius:8px;
 padding:6px 10px;
 font-size:13px;
}

.primary{background:#245db8}
.stop{background:#713333}
button:disabled{opacity:.45}

main{
 min-height:0;
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:var(--gap);
}

.left{
 min-height:0;
 display:grid;
 grid-template-rows:1fr 1fr;
 gap:var(--gap);
}

.right{
 min-height:0;
 display:grid;
 grid-template-rows:32fr 68fr;
 gap:var(--gap);
}

.panel{
 min-height:0;
 background:var(--panel);
 border:1px solid var(--line);
 border-radius:10px;
 overflow:hidden;
 display:flex;
 flex-direction:column;
}

.title{
 flex:none;
 border-bottom:1px solid var(--line);
 padding:6px 9px;
 font-size:13px;
 font-weight:700;
}

.content{
 flex:1;
 min-height:0;
 padding:7px 9px;
 overflow-y:auto;
 overflow-x:hidden;
 -webkit-overflow-scrolling:touch;
}

#raw{
 white-space:pre-wrap;
 font-size:16px;
 line-height:1.35;
}

#translation{
 font-size:18px;
 line-height:1.35;
}

.translation-line{
 margin:0 0 4px 0;
 padding:0;
}

#summary{
 padding:6px 9px;
}

.topic{
 margin:0;
 padding:4px 0 5px 0;
 border-bottom:1px solid #27313d;
}

.topic-title{
 margin:0 0 1px 0;
 font-size:15px;
 line-height:1.2;
 font-weight:750;
 color:#d9e7ff;
}

.topic-description{
 margin:0;
 font-size:13px;
 line-height:1.25;
 color:#e0e5ec;
}

#prediction{
 padding:5px 7px;
 display:block;
}

.prediction-card{
 display:block;
 margin:0 0 4px 0;
 padding:5px 7px;
 border-left:3px solid var(--accent);
 background:#101720;
 border-radius:4px;
}

.prediction-card.high{
 border-left-color:var(--red);
}

.prediction-card.medium{
 border-left-color:var(--yellow);
}

.prediction-card.low{
 border-left-color:var(--green);
}

.pred-top{
 display:flex;
 align-items:center;
 gap:5px;
 margin:0 0 2px 0;
 line-height:1.1;
}

.number{
 font-size:12px;
 font-weight:800;
}

.chance{
 font-size:11px;
 font-weight:700;
 color:var(--muted);
}

.situation{
 display:inline;
 font-size:13px;
 line-height:1.15;
 font-weight:650;
 color:#f3f6fa;
}

.question{
 margin:2px 0 1px 0;
 font-size:14px;
 line-height:1.18;
 color:#f3f6fa;
}

.answer{
 margin:2px 0 1px 0;
 font-size:17px;
 line-height:1.18;
 font-weight:750;
 color:#c9dcff;
}

.jp{
 margin:0;
 font-size:12px;
 line-height:1.15;
 color:var(--muted);
}

.muted{
 color:var(--muted);
}

@media(orientation:portrait){
 main{
  grid-template-columns:1fr;
  grid-template-rows:1fr 1fr;
 }
}
</style>
</head>

<body>

<div id="app">

<header>

<strong>🎙 Meeting AI</strong>

<input
 id="apiKey"
 type="password"
 placeholder="OpenAI API Key"
 autocomplete="off"
>

<span class="status" id="status">
待機中
</span>

<button class="primary" id="start">
開始
</button>

<button class="stop" id="stop" disabled>
停止
</button>

</header>

<main>

<div class="left">

<section class="panel">

<div class="title">
🎙 English
</div>

<div class="content" id="raw">
<span class="muted">
English transcript...
</span>
</div>

</section>


<section class="panel">

<div class="title">
🇯🇵 リアルタイム日本語訳
</div>

<div class="content" id="translation">
<span class="muted">
日本語訳を順番に追加します。
</span>
</div>

</section>

</div>


<div class="right">

<section class="panel">

<div class="title">
📝 会議概要
</div>

<div class="content" id="summary">
<span class="muted">
大きな話題ごとに概要を残します。
</span>
</div>

</section>


<section class="panel">

<div class="title">
🔮 発言予測・回答候補
</div>

<div class="content" id="prediction">
<span class="muted">
会話に合わせて更新します。
</span>
</div>

</section>

</div>

</main>

</div>


<script>

const rawEl =
 document.getElementById("raw");

const translationEl =
 document.getElementById("translation");

const summaryEl =
 document.getElementById("summary");

const predictionEl =
 document.getElementById("prediction");

const statusEl =
 document.getElementById("status");

const keyEl =
 document.getElementById("apiKey");

const startBtn =
 document.getElementById("start");

const stopBtn =
 document.getElementById("stop");


let recognition = null;
let running = false;

let transcript = "";
let interimText = "";

let pendingEnglish = [];

let translating = false;
let analyzing = false;

let analysisTimer = null;

let topicHistory = [];
let currentTopicTitle = "";

let lastPredictionTranscript = "";

let analysisCount = 0;


keyEl.value =
 localStorage.getItem("meeting_ai_key") || "";


keyEl.addEventListener(
 "change",
 ()=>{

   localStorage.setItem(
     "meeting_ai_key",
     keyEl.value.trim()
   );

 }
);


function scrollBottom(el){

 requestAnimationFrame(()=>{

   el.scrollTop =
     el.scrollHeight;

 });

}


function escapeHtml(s){

 return String(s || "")
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");

}


function extractOutput(data){

 if(data.output_text){
   return data.output_text;
 }

 try{

   return data.output
   .flatMap(x=>x.content || [])
   .filter(x=>x.type==="output_text")
   .map(x=>x.text)
   .join("");

 }catch(e){

   return "";

 }

}


async function callOpenAI(prompt){

 const apiKey =
   keyEl.value.trim();

 if(!apiKey){

   throw new Error(
     "APIキーを入力してください"
   );

 }

 const response =
 await fetch(
   "https://api.openai.com/v1/responses",
   {

     method:"POST",

     headers:{

       "Content-Type":
         "application/json",

       "Authorization":
         "Bearer " + apiKey

     },

     body:JSON.stringify({

       model:"gpt-5-mini",

       input:prompt

     })

   }
 );


 const data =
   await response.json();


 if(!response.ok){

   throw new Error(
     data?.error?.message ||
     "OpenAI API error"
   );

 }


 return extractOutput(data);

}



function initRecognition(){

 const SR =
   window.SpeechRecognition ||
   window.webkitSpeechRecognition;


 if(!SR){

   statusEl.textContent =
     "音声認識未対応";

   return null;

 }


 const r =
   new SR();


 r.continuous = true;

 r.interimResults = true;

 r.lang = "en-US";


 r.onresult = e=>{

   let newFinal = "";

   interimText = "";


   for(
     let i=e.resultIndex;
     i<e.results.length;
     i++
   ){

     const text =
       e.results[i][0].transcript;


     if(
       e.results[i].isFinal
     ){

       newFinal +=
         text.trim() + ". ";

     }else{

       interimText +=
         text;

     }

   }


   if(newFinal){

     transcript +=
       newFinal;


     pendingEnglish.push(
       newFinal.trim()
     );


     translatePending();


     scheduleAnalysis();

   }


   rawEl.textContent =
     (
       transcript +
       " " +
       interimText
     ).trim();


   scrollBottom(
     rawEl
   );

 };


 r.onerror = e=>{

   if(
     e.error === "no-speech"
   ){
     return;
   }


   statusEl.textContent =
     "音声認識: " +
     e.error;

 };


 r.onend = ()=>{

   if(running){

     setTimeout(()=>{

       try{

         r.start();

       }catch(e){}

     },250);

   }

 };


 return r;

}



async function translatePending(){

 if(translating){
   return;
 }

 if(
   !pendingEnglish.length
 ){
   return;
 }


 translating = true;


 const batch =
   pendingEnglish.splice(0,2);


 const english =
   batch.join(" ");


 try{

   statusEl.textContent =
     "翻訳中…";


   const prompt = `
Translate this spoken English into natural Japanese.

Do not summarize.

Do not explain.

Translate only what was said.

Keep technical terminology accurate.

Context may include:
metallography,
cutting,
mounting,
grinding,
polishing,
etching,
microscopy,
materials characterization,
customer samples,
technical testing.

Return ONLY Japanese.

English:

${english}
`;


   const jp =
     (
       await callOpenAI(prompt)
     ).trim();


   if(
     translationEl
     .querySelector(".muted")
   ){

     translationEl.innerHTML =
       "";

   }


   const div =
     document.createElement(
       "div"
     );


   div.className =
     "translation-line";


   div.textContent =
     jp;


   translationEl
   .appendChild(div);


   scrollBottom(
     translationEl
   );


   statusEl.textContent =
     running
     ? "音声認識中"
     : "停止";


 }catch(err){

   console.error(err);

   statusEl.textContent =
     "翻訳エラー";

 }finally{

   translating = false;


   if(
     pendingEnglish.length
   ){

     translatePending();

   }

 }

}



function scheduleAnalysis(){

 clearTimeout(
   analysisTimer
 );


 analysisTimer =
 setTimeout(()=>{

   updateMeetingAI();

 },1200);

}



async function updateMeetingAI(){

 if(analyzing){
   return;
 }


 const current =
   transcript.trim();


 if(!current){
   return;
 }


 if(
   current ===
   lastPredictionTranscript
 ){
   return;
 }


 analyzing = true;

 analysisCount++;


 statusEl.textContent =
   "AI解析中…";


 const recent =
   current.length > 8000
   ? current.slice(-8000)
   : current;


 const existingTopics =
   topicHistory
   .map(
     (t,i)=>
     `${i+1}. ${t.title} - ${t.description}`
   )
   .join("\n");


 const firstTopic =
   topicHistory.length === 0;


 const prompt = `
You are a real-time meeting assistant.

The user is a Japanese application engineer working with
metallographic sample preparation and materials characterization.

Analyze the English meeting transcript.

Return ONLY valid JSON.

--------------------------------
TASK 1
MEETING OVERVIEW
--------------------------------

The overview is NOT a running summary.

It should look like a short presentation agenda.

For example:

Product Introduction
製品の主な特徴と変更点について説明。

Testing in Japan
日本での試験状況と評価について議論。

Customer Feedback
顧客からの要望と課題について確認。

Next Actions
今後の試験と情報共有について確認。


IMPORTANT:

${firstTopic
 ? "This is the first analysis. You MUST create the first topic."
 : "A topic already exists."}


Existing topics:

${existingTopics || "None"}


Current topic:

${currentTopicTitle || "None"}


Create a NEW topic only when:

- the presentation section clearly changes
- the main subject clearly changes
- the speaker moves to a different product
- the discussion moves to a different technical theme
- the meeting moves to next actions or conclusions


Do NOT create a new topic for small details.

Do NOT repeat an existing topic.


--------------------------------
TASK 2
SPEAKING PREDICTIONS
--------------------------------

Predict what the Japanese application engineer may need to say NEXT.

Return up to 5 candidates.

Prioritize:

1 direct questions
2 Japan / Japanese customers
3 test results
4 sample preparation conditions
5 technical opinions
6 useful voluntary comments


Keep the situation description VERY short.

Keep the likely question short.

The English answer must be:
short,
easy to pronounce,
natural,
immediately usable.


Do not invent facts.

If information is unknown use safe answers such as:

I need to check the details.

We have not confirmed that yet.

I will check and share the information.


Return exactly this JSON structure:

{
 "topic":{
   "changed":true,
   "title":"Short English or Japanese presentation title",
   "description":"Short Japanese description"
 },
 "predictions":[
   {
     "chance":"high",
     "situation":"短い日本語",
     "question":"Likely English question",
     "answer_short":"Simple English answer",
     "answer_jp":"短い日本語訳"
   }
 ]
}


Meeting transcript:

${recent}
`;


 try{

   const output =
     await callOpenAI(
       prompt
     );


   const cleaned =
     output
     .replace(/^```json/i,"")
     .replace(/^```/,"")
     .replace(/```$/,"")
     .trim();


   const result =
     JSON.parse(cleaned);


   if(
     result.topic
   ){

     handleTopic(
       result.topic,
       firstTopic
     );

   }


   if(
     Array.isArray(
       result.predictions
     )
   ){

     renderPredictions(
       result.predictions
     );

   }


   lastPredictionTranscript =
     current;


   statusEl.textContent =
     running
     ? "音声認識中"
     : "停止";


 }catch(err){

   console.error(err);

   statusEl.textContent =
     "AI解析エラー";

 }finally{

   analyzing = false;


   if(
     transcript.trim() !==
     lastPredictionTranscript
   ){

     scheduleAnalysis();

   }

 }

}



function handleTopic(
 topic,
 forceFirst=false
){

 if(
   !topic ||
   !topic.title
 ){
   return;
 }


 const title =
   String(
     topic.title
   ).trim();


 const description =
   String(
     topic.description || ""
   ).trim();


 const sameAsCurrent =
   currentTopicTitle &&
   title.toLowerCase() ===
   currentTopicTitle.toLowerCase();


 const duplicate =
   topicHistory.some(
     t=>
     t.title
     .toLowerCase() ===
     title.toLowerCase()
   );


 /*
 First topic is ALWAYS added.
 Later topics only when changed.
 */

 if(forceFirst){

   topicHistory.push({
     title,
     description
   });


   currentTopicTitle =
     title;


   renderTopics();

   return;

 }


 if(
   topic.changed &&
   !sameAsCurrent &&
   !duplicate
 ){

   topicHistory.push({
     title,
     description
   });


   currentTopicTitle =
     title;


   renderTopics();

 }

}



function renderTopics(){

 if(
   !topicHistory.length
 ){
   return;
 }


 summaryEl.innerHTML =
   topicHistory
   .map(t=>`

   <div class="topic">

     <div class="topic-title">
       • ${escapeHtml(t.title)}
     </div>

     <div class="topic-description">
       ${escapeHtml(t.description)}
     </div>

   </div>

   `)
   .join("");


 /*
 Always show newest overview item.
 */

 scrollBottom(
   summaryEl
 );

}



function renderPredictions(
 items
){

 if(
   !items ||
   !items.length
 ){
   return;
 }


 predictionEl.innerHTML =
   items
   .slice(0,5)
   .map(
     (p,i)=>{

       const chance =
         ["high","medium","low"]
         .includes(p.chance)
         ? p.chance
         : "medium";


       const label =
         chance === "high"
         ? "高"
         : chance === "medium"
         ? "中"
         : "低";


       return `

       <div class="prediction-card ${chance}">

         <div class="pred-top">

           <span class="number">
             ${i+1}
           </span>

           <span class="chance">
             可能性 ${label}
           </span>

           <span class="situation">
             ${escapeHtml(
               p.situation
             )}
           </span>

         </div>


         <div class="question">

           <b>Q:</b>
           ${escapeHtml(
             p.question
           )}

         </div>


         <div class="answer">

           ${escapeHtml(
             p.answer_short
           )}

         </div>


         <div class="jp">

           ${escapeHtml(
             p.answer_jp
           )}

         </div>

       </div>

       `;

     }
   )
   .join("");


 /*
 New prediction results appear,
 then automatically show the
 newest/lower part.
 */

 scrollBottom(
   predictionEl
 );

}



startBtn.onclick =
()=>{

 const apiKey =
   keyEl.value.trim();


 if(!apiKey){

   alert(
     "OpenAI APIキーを入力してください。"
   );

   keyEl.focus();

   return;

 }


 localStorage.setItem(
   "meeting_ai_key",
   apiKey
 );


 recognition =
   recognition ||
   initRecognition();


 if(!recognition){
   return;
 }


 running = true;


 startBtn.disabled =
   true;


 stopBtn.disabled =
   false;


 statusEl.textContent =
   "音声認識中";


 try{

   recognition.start();

 }catch(e){}

};



stopBtn.onclick =
()=>{

 running = false;


 clearTimeout(
   analysisTimer
 );


 startBtn.disabled =
   false;


 stopBtn.disabled =
   true;


 statusEl.textContent =
   "停止";


 if(recognition){

   try{

     recognition.stop();

   }catch(e){}

 }


 if(
   pendingEnglish.length
 ){

   translatePending();

 }


 if(
   transcript.trim()
 ){

   updateMeetingAI();

 }

};

</script>

</body>
</html>
