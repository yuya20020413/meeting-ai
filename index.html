<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Meeting AI</title>

<style>
:root{
 --gap:6px;
 --bg:#0b0f14;
 --panel:#141b24;
 --line:#293342;
 --text:#f3f6fa;
 --muted:#aeb8c6;
 --blue:#78a9ff;
 --green:#65d18a;
 --red:#ff8585;
 --yellow:#ffd36a;
}

*{box-sizing:border-box}

html,body{
 margin:0;
 width:100%;
 height:100%;
 background:var(--bg);
 color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 overflow:hidden;
}

#app{
 height:100%;
 display:grid;
 grid-template-rows:56px 1fr;
 gap:var(--gap);
 padding:var(--gap);
}

/* =========================
   HEADER
========================= */

header{
 display:flex;
 align-items:center;
 gap:6px;
 background:var(--panel);
 border:1px solid var(--line);
 border-radius:10px;
 padding:5px 8px;
 min-width:0;
}

header strong{
 font-size:14px;
 white-space:nowrap;
}

input{
 width:95px;
 min-width:65px;
 border:1px solid var(--line);
 background:#0e141c;
 color:white;
 border-radius:7px;
 padding:6px;
 font-size:10px;
}

.chip{
 height:36px;
 display:flex;
 align-items:center;
 border:1px solid var(--line);
 border-radius:8px;
 padding:0 7px;
 background:#0e141c;
 font-size:11px;
 white-space:nowrap;
}

#timer{
 font-variant-numeric:tabular-nums;
}

#currentTopicBox{
 flex:1;
 min-width:150px;
 display:block;
 padding:3px 8px;
 overflow:hidden;
}

.topic-label{
 font-size:9px;
 color:var(--muted);
 line-height:1;
}

#currentTopicText{
 margin-top:3px;
 font-size:13px;
 font-weight:750;
 color:#d8e6ff;
 overflow:hidden;
 white-space:nowrap;
 text-overflow:ellipsis;
}

button{
 border:1px solid var(--line);
 background:#202a37;
 color:white;
 border-radius:8px;
 padding:6px 8px;
 font-size:11px;
 white-space:nowrap;
}

button:disabled{
 opacity:.45;
}

.primary{background:#245db8}
.stop{background:#713333}
.camera{background:#226744}
.save{background:#655225}

/* =========================
   MAIN
========================= */

main{
 min-height:0;
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:var(--gap);
}

.left{
 min-height:0;
 display:grid;

 /* 資料読取を少し広めに */
 grid-template-rows:38fr 31fr 31fr;

 gap:var(--gap);
}

.right{
 min-height:0;
 display:grid;
 grid-template-rows:32fr 68fr;
 gap:var(--gap);
}

/* =========================
   PANEL
========================= */

.panel{
 min-height:0;
 background:var(--panel);
 border:1px solid var(--line);
 border-radius:10px;
 overflow:hidden;
 display:flex;
 flex-direction:column;
}

.title{
 flex:none;
 border-bottom:1px solid var(--line);
 padding:5px 8px;
 font-size:12px;
 font-weight:700;
}

.content{
 flex:1;
 min-height:0;
 padding:6px 8px;
 overflow-y:auto;
 overflow-x:hidden;
 -webkit-overflow-scrolling:touch;
}

.muted{
 color:var(--muted);
}

/* =====================================================
   CAMERA + AI READING
===================================================== */

.camera-header{
 display:flex;
 align-items:center;
 gap:6px;
}

#cameraStatus{
 margin-left:auto;
 color:var(--green);
 font-size:10px;
}

/*
  ★変更部分

  左 58% = カメラ
  右 42% = AI読取結果
*/

#cameraWorkspace{
 flex:1;
 min-height:0;
 display:grid;
 grid-template-columns:58% 42%;
 background:#070a0e;
}

/* =========================
   CAMERA LEFT
========================= */

#cameraArea{
 position:relative;
 min-width:0;
 min-height:0;
 overflow:hidden;
 background:#000;
 border-right:1px solid var(--line);

 display:flex;
 align-items:center;
 justify-content:flex-start;
}

#cameraVideo{
 width:100%;
 height:100%;
 object-fit:contain;

 /*
  左側へ寄せる
 */
 object-position:left center;

 background:#000;
 display:block;
}

/* camera status badge */

#cameraBadge{
 position:absolute;
 top:6px;
 left:6px;

 padding:3px 7px;

 background:rgba(0,0,0,.68);

 border-radius:5px;

 font-size:9px;
 color:#7ce5a0;

 pointer-events:none;
}

/* =========================
   AI READING RIGHT
========================= */

#slideReading{
 min-width:0;
 min-height:0;

 padding:8px 10px;

 overflow-y:auto;

 background:#101720;
}

.reading-label{
 display:flex;
 align-items:center;
 gap:5px;

 color:#72dda0;

 font-size:10px;
 font-weight:750;

 margin-bottom:5px;
}

#slideTitle{
 font-size:15px;
 line-height:1.15;

 font-weight:800;

 color:#9ec5ff;

 margin-bottom:6px;
}

#slideDescription{
 font-size:12px;
 line-height:1.3;

 color:#eef2f7;

 margin-bottom:8px;
}

.reading-subtitle{
 font-size:10px;
 color:#93a0af;

 margin-top:6px;
 margin-bottom:3px;
}

#slideKeywords{
 display:flex;
 flex-wrap:wrap;
 gap:3px;
}

.keyword{
 display:inline-block;

 padding:2px 5px;

 border-radius:4px;

 background:#1b2938;

 border:1px solid #34475b;

 color:#d3e3f6;

 font-size:9px;
}

#slideSaveStatus{
 margin-top:8px;

 padding-top:6px;

 border-top:1px solid #293544;

 font-size:10px;

 color:#7ed99b;
}

/* =========================
   TRANSCRIPT
========================= */

#raw{
 white-space:pre-wrap;
 font-size:15px;
 line-height:1.3;
}

#translation{
 font-size:17px;
 line-height:1.3;
}

.translation-line{
 margin:0 0 3px 0;
}

/* =========================
   SUMMARY
========================= */

#summary{
 padding:5px 8px;
}

.topic{
 padding:4px 0;
 border-bottom:1px solid #27313d;
}

.topic-title{
 font-size:14px;
 line-height:1.2;
 font-weight:750;
 color:#d9e7ff;
}

.topic-description{
 margin-top:1px;
 font-size:12px;
 line-height:1.22;
 color:#e0e5ec;
}

/* =========================
   PREDICTIONS
========================= */

#prediction{
 padding:4px 6px;
}

.prediction-card{
 margin:0 0 4px 0;
 padding:5px 7px;
 background:#101720;
 border-radius:4px;
}

.prediction-card.incoming{
 border-left:3px solid var(--red);
}

.prediction-card.outgoing{
 border-left:3px solid var(--green);
}

.pred-top{
 display:flex;
 align-items:center;
 gap:5px;
 line-height:1.12;
 margin-bottom:2px;
}

.pred-type{
 font-size:11px;
 font-weight:800;
 white-space:nowrap;
}

.incoming .pred-type{
 color:#ff9c9c;
}

.outgoing .pred-type{
 color:#82dfa1;
}

.chance{
 font-size:10px;
 color:var(--muted);
 white-space:nowrap;
}

.question-jp{
 font-size:13px;
 font-weight:700;
 color:white;
}

.question-en{
 margin-top:2px;
 font-size:12px;
 line-height:1.15;
 color:#b9c9df;
}

.answer-en{
 margin-top:3px;
 font-size:16px;
 line-height:1.16;
 font-weight:750;
 color:#c9dcff;
}

.answer-jp{
 margin-top:1px;
 font-size:12px;
 line-height:1.15;
 color:var(--muted);
}

#captureCanvas{
 display:none;
}

/* =========================
   IPAD
========================= */

@media(max-width:1000px){

 header strong{font-size:12px}

 input{width:72px}

 button{
  padding:6px;
  font-size:10px;
 }

 .chip{
  padding:0 5px;
 }

 #currentTopicText{
  font-size:12px;
 }

 #slideTitle{
  font-size:13px;
 }

 #slideDescription{
  font-size:11px;
 }
}

@media(orientation:portrait){

 main{
  grid-template-columns:1fr;
  grid-template-rows:1fr 1fr;
 }
}
</style>
</head>

========================= -->

<script>

/* =====================================================
   ELEMENTS
===================================================== */

const $ = id =>
 document.getElementById(id);

const rawEl = $("raw");
const translationEl = $("translation");
const summaryEl = $("summary");
const predictionEl = $("prediction");

const keyEl = $("apiKey");

const startBtn = $("start");
const stopBtn = $("stop");
const finishBtn = $("finish");

const timerEl = $("timer");

const currentTopicText =
 $("currentTopicText");

const cameraBtn =
 $("cameraBtn");

const cameraStatus =
 $("cameraStatus");

const cameraVideo =
 $("cameraVideo");

const slideTitleEl =
 $("slideTitle");

const slideDescriptionEl =
 $("slideDescription");

const slideKeywordsEl =
 $("slideKeywords");

const slideSaveStatus =
 $("slideSaveStatus");

const captureCanvas =
 $("captureCanvas");


/* =====================================================
   STATE
===================================================== */

let recognition = null;

let running = false;

let transcript = "";

let interimText = "";

let pendingEnglish = [];

let translating = false;

let analyzing = false;

let analysisTimer = null;

let topicHistory = [];

let currentTopicTitle = "";

let currentLiveTopic = "";

let lastAnalysisSignature = "";

let translationHistory = [];


/* TIMER */

let meetingStart = null;
let timerInterval = null;


/* CAMERA */

let cameraRunning = false;
let cameraStream = null;
let cameraTimer = null;

let previousFingerprint = null;

let slideAnalyzing = false;

let currentSlide = {
 title:"",
 description:"",
 keywords:[]
};

let savedSlides = [];


/* =====================================================
   API KEY
===================================================== */

keyEl.value =
 localStorage.getItem(
  "meeting_ai_key"
 ) || "";

keyEl.addEventListener(
 "change",
 ()=>{

  localStorage.setItem(
   "meeting_ai_key",
   keyEl.value.trim()
  );

 }
);


/* =====================================================
   HELPERS
===================================================== */

function scrollBottom(el){

 requestAnimationFrame(
  ()=>{

   el.scrollTop =
    el.scrollHeight;

  }
 );

}


function esc(s){

 return String(s || "")

 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");

}


function cleanJSON(text){

 return text
 .replace(/^```json/i,"")
 .replace(/^```/,"")
 .replace(/```$/,"")
 .trim();

}


function extractOutput(data){

 if(data.output_text){
  return data.output_text;
 }

 try{

  return data.output

  .flatMap(
   x => x.content || []
  )

  .filter(
   x =>
   x.type === "output_text"
  )

  .map(
   x => x.text
  )

  .join("");

 }catch(e){

  return "";

 }

}


/* =====================================================
   OPENAI TEXT
===================================================== */

async function callOpenAI(prompt){

 const key =
  keyEl.value.trim();

 if(!key){

  throw new Error(
   "OpenAI APIキーを入力してください"
  );

 }

 const response =
 await fetch(
  "https://api.openai.com/v1/responses",
  {
   method:"POST",

   headers:{
    "Content-Type":"application/json",
    "Authorization":"Bearer " + key
   },

   body:JSON.stringify({
    model:"gpt-5-mini",
    input:prompt
   })
  }
 );

 const data =
  await response.json();

 if(!response.ok){

  throw new Error(
   data?.error?.message ||
   "OpenAI API error"
  );

 }

 return extractOutput(data);

}


/* =====================================================
   OPENAI IMAGE
===================================================== */

async function analyzeSlideImage(
 dataUrl
){

 const key =
  keyEl.value.trim();

 if(!key){

  throw new Error(
   "OpenAI APIキーを入力してください"
  );

 }

 const response =
 await fetch(
  "https://api.openai.com/v1/responses",
  {
   method:"POST",

   headers:{
    "Content-Type":"application/json",
    "Authorization":"Bearer " + key
   },

   body:JSON.stringify({

    model:"gpt-5-mini",

    input:[
     {
      role:"user",

      content:[
       {
        type:"input_text",

        text:`
You are reading a presentation slide
during a technical meeting.

Read the visible slide carefully.

Extract information that is actually
visible on the slide.

The meeting may involve:

metallography
cutting
mounting
grinding
polishing
etching
microscopy
materials characterization
test results
customer samples
Japan
Japanese customers

Return ONLY valid JSON.

{
 "title":"Short slide title",
 "description":"日本語で資料の内容を簡潔に1～3文",
 "keywords":[
  "重要ポイント1",
  "重要ポイント2",
  "重要ポイント3"
 ]
}

For keywords:
extract approximately 3 to 6
important technical points,
materials, parameters or conclusions.

Do NOT invent information.

If text cannot be read,
do not guess.
`
       },

       {
        type:"input_image",
        image_url:dataUrl
       }
      ]
     }
    ]
   })
  }
 );

 const data =
  await response.json();

 if(!response.ok){

  throw new Error(
   data?.error?.message ||
   "画像解析エラー"
  );

 }

 return JSON.parse(
  cleanJSON(
   extractOutput(data)
  )
 );

}


/* =====================================================
   TIMER
===================================================== */

function startTimer(){

 if(!meetingStart){

  meetingStart =
   Date.now();

 }

 clearInterval(
  timerInterval
 );

 timerInterval =
 setInterval(
  ()=>{

   const seconds =
    Math.floor(
     (
      Date.now() -
      meetingStart
     ) / 1000
    );

   const h =
    String(
     Math.floor(
      seconds / 3600
     )
    ).padStart(2,"0");

   const m =
    String(
     Math.floor(
      (seconds % 3600) / 60
     )
    ).padStart(2,"0");

   const s =
    String(
     seconds % 60
    ).padStart(2,"0");

   timerEl.textContent =
    `⏱ ${h}:${m}:${s}`;

  },
  1000
 );

}


/* =====================================================
   CAMERA START / STOP
===================================================== */

cameraBtn.onclick =
 async ()=>{

  if(cameraRunning){

   stopCamera();

  }else{

   await startCamera();

  }

 };


async function startCamera(){

 if(
  !navigator.mediaDevices ||
  !navigator.mediaDevices.getUserMedia
 ){

  alert(
   "このブラウザではカメラを使用できません。"
  );

  return;

 }

 try{

  cameraStream =
   await navigator
   .mediaDevices
   .getUserMedia({

    video:{
     facingMode:{
      ideal:"environment"
     },

     width:{
      ideal:1280
     },

     height:{
      ideal:720
     }
    },

    audio:false

   });

  cameraVideo.srcObject =
   cameraStream;

  await cameraVideo.play();

  cameraRunning = true;

  cameraBtn.textContent =
   "📷 資料読取 ON";

  cameraStatus.textContent =
   "監視中";

  slideTitleEl.textContent =
   "資料を監視しています";

  slideDescriptionEl.textContent =
   "スライドが変わると自動で読み取ります。";

  slideKeywordsEl.innerHTML =
   `<span class="muted">解析待ち</span>`;

  previousFingerprint = null;

  setTimeout(
   checkSlide,
   1200
  );

  cameraTimer =
   setInterval(
    checkSlide,
    3000
   );

 }catch(error){

  console.error(error);

  alert(
   "カメラを開始できませんでした。\nSafariのカメラ許可を確認してください。"
  );

 }

}


function stopCamera(){

 cameraRunning = false;

 clearInterval(
  cameraTimer
 );

 cameraTimer = null;

 if(cameraStream){

  cameraStream
  .getTracks()
  .forEach(
   track => track.stop()
  );

 }

 cameraStream = null;

 cameraVideo.srcObject = null;

 cameraBtn.textContent =
  "📷 資料読取";

 cameraStatus.textContent =
  "OFF";

}


/* =====================================================
   CAPTURE
===================================================== */

function captureFrame(
 quality = 0.78
){

 if(
  !cameraVideo.videoWidth ||
  !cameraVideo.videoHeight
 ){
  return null;
 }

 const maxWidth = 1280;

 const scale =
  Math.min(
   1,
   maxWidth /
   cameraVideo.videoWidth
  );

 captureCanvas.width =
  Math.round(
   cameraVideo.videoWidth *
   scale
  );

 captureCanvas.height =
  Math.round(
   cameraVideo.videoHeight *
   scale
  );

 const ctx =
  captureCanvas
  .getContext("2d");

 ctx.drawImage(
  cameraVideo,
  0,
  0,
  captureCanvas.width,
  captureCanvas.height
 );

 return captureCanvas
 .toDataURL(
  "image/jpeg",
  quality
 );

}


/* =====================================================
   FINGERPRINT
===================================================== */

function createFingerprint(){

 if(!cameraVideo.videoWidth){
  return null;
 }

 const w = 40;
 const h = 22;

 const canvas =
  document.createElement(
   "canvas"
  );

 canvas.width = w;
 canvas.height = h;

 const ctx =
  canvas.getContext(
   "2d",
   {
    willReadFrequently:true
   }
  );

 ctx.drawImage(
  cameraVideo,
  0,
  0,
  w,
  h
 );

 const data =
  ctx.getImageData(
   0,
   0,
   w,
   h
  ).data;

 const values = [];

 for(
  let i=0;
  i<data.length;
  i+=4
 ){

  values.push(
   (
    data[i] +
    data[i+1] +
    data[i+2]
   ) / 3
  );

 }

 return values;

}


function fingerprintDifference(
 a,
 b
){

 if(
  !a ||
  !b ||
  a.length !== b.length
 ){
  return 999;
 }

 let total = 0;

 for(
  let i=0;
  i<a.length;
  i++
 ){

  total +=
   Math.abs(
    a[i] -
    b[i]
   );

 }

 return total /
  a.length;

}


/* =====================================================
   DISPLAY SLIDE
===================================================== */

function renderCurrentSlide(){

 slideTitleEl.textContent =
  currentSlide.title ||
  "資料";

 slideDescriptionEl.textContent =
  currentSlide.description ||
  "資料を読み取りました。";


 /* keywords */

 if(
  currentSlide.keywords &&
  currentSlide.keywords.length
 ){

  slideKeywordsEl.innerHTML =
   currentSlide.keywords

   .slice(0,6)

   .map(
    keyword =>
`
<span class="keyword">
${esc(keyword)}
</span>
`
   )

   .join("");

 }else{

  slideKeywordsEl.innerHTML =
   `<span class="muted">－</span>`;

 }


 slideSaveStatus.textContent =
  `📷 自動保存 ${savedSlides.length}枚`;

}


/* =====================================================
   SLIDE CHECK
===================================================== */

async function checkSlide(){

 if(
  !cameraRunning ||
  slideAnalyzing
 ){
  return;
 }

 const fingerprint =
  createFingerprint();

 if(!fingerprint){
  return;
 }

 const difference =
  fingerprintDifference(
   previousFingerprint,
   fingerprint
  );

 if(
  previousFingerprint &&
  difference < 13
 ){
  return;
 }

 previousFingerprint =
  fingerprint;

 const image =
  captureFrame();

 if(!image){
  return;
 }

 slideAnalyzing = true;

 cameraStatus.textContent =
  "AI読取中…";

 try{

  const result =
   await analyzeSlideImage(
    image
   );

  const newSlide = {

   title:
    String(
     result.title || ""
    ).trim(),

   description:
    String(
     result.description || ""
    ).trim(),

   keywords:
    Array.isArray(
     result.keywords
    )
    ? result.keywords
    : []

  };

  const normalizedNew =
   (
    newSlide.title +
    "|" +
    newSlide.description
   ).toLowerCase();

  const normalizedOld =
   (
    currentSlide.title +
    "|" +
    currentSlide.description
   ).toLowerCase();

  const meaningfulChange =
   !normalizedOld ||
   normalizedNew !==
   normalizedOld;

  currentSlide =
   newSlide;


  /*
   Save BEFORE render so the
   counter updates immediately.
  */

  if(meaningfulChange){

   const now =
    new Date();

   savedSlides.push({

    time:
     now.toISOString(),

    displayTime:
     now.toLocaleTimeString(
      "ja-JP",
      {
       hour:"2-digit",
       minute:"2-digit",
       second:"2-digit"
      }
     ),

    title:
     currentSlide.title,

    description:
     currentSlide.description,

    keywords:
     currentSlide.keywords,

    image:image

   });

  }

  renderCurrentSlide();

  cameraStatus.textContent =
   "読取済";

  if(meaningfulChange){

   lastAnalysisSignature = "";

   scheduleAnalysis();

  }

 }catch(error){

  console.error(error);

  cameraStatus.textContent =
   "読取エラー";

 }finally{

  slideAnalyzing = false;

 }

}


/* =====================================================
   SPEECH RECOGNITION
===================================================== */

function initRecognition(){

 const SR =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

 if(!SR){
  return null;
 }

 const r =
  new SR();

 r.continuous = true;
 r.interimResults = true;
 r.lang = "en-US";

 r.onresult =
  event=>{

   let newFinal = "";

   interimText = "";

   for(
    let i=event.resultIndex;
    i<event.results.length;
    i++
   ){

    const text =
     event.results[i][0]
     .transcript;

    if(
     event.results[i].isFinal
    ){

     newFinal +=
      text.trim() + ". ";

    }else{

     interimText += text;

    }

   }

   if(newFinal){

    transcript +=
     newFinal;

    pendingEnglish.push(
     newFinal.trim()
    );

    translatePending();

    scheduleAnalysis();

   }

   rawEl.textContent =
    (
     transcript +
     " " +
     interimText
    ).trim();

   scrollBottom(
    rawEl
   );

  };


 r.onerror =
  event=>{

   if(
    event.error === "no-speech"
   ){
    return;
   }

   console.log(
    event.error
   );

  };


 r.onend =
  ()=>{

   if(running){

    setTimeout(
     ()=>{

      try{
       r.start();
      }catch(e){}

     },
     250
    );

   }

  };

 return r;

}

 const prompt =

${firstTopic

${existingTopics || "None"}

${currentTopicTitle || "None"}

TASK 3:
QUESTION PREDICTIONS

Predict questions that OTHER
participants are likely to ask
THE JAPANESE APPLICATION ENGINEER.

Questions must be directed TO THE USER.

Prioritize:

Japan
Japanese customers
customer feedback
technical opinion
test results
applications in Japan
sample preparation
customer samples
what the user thinks

For incoming questions:

question_jp =
direct natural Japanese translation
of the predicted question.

question_en =
likely English question.

short, simple English answer
the user could actually say.

answer_jp =
direct Japanese translation
of answer_en.

TASK 4:

 try{

/* =====================================================
   TOPIC HISTORY
===================================================== */

function handleTopic(
 topic,
 forceFirst = false
){

 if(
  !topic ||
  !topic.title
 ){
  return;
 }

 const title =
  String(
   topic.title
  ).trim();

 const description =
  String(
   topic.description || ""
  ).trim();

 const sameAsCurrent =
  currentTopicTitle &&
  title.toLowerCase() ===
  currentTopicTitle.toLowerCase();

 const duplicate =
  topicHistory.some(
   item =>
   item.title.toLowerCase() ===
   title.toLowerCase()
  );

 if(forceFirst){

  if(!duplicate){

   topicHistory.push({
    title:title,
    description:description
   });

  }

  currentTopicTitle =
   title;

  renderTopics();

  return;
 }

 if(
  topic.changed &&
  !sameAsCurrent &&
  !duplicate
 ){

  topicHistory.push({
   title:title,
   description:description
  });

  currentTopicTitle =
   title;

  renderTopics();

 }

}

/* =====================================================

===================================================== */

function renderPredictions(
 items
){

 if(
  !items ||
  !items.length
 ){
  return;
 }

 predictionEl.innerHTML =
  items

  .slice(0,5)

  .map(
   item=>{

    const type =
     item.type === "outgoing"
     ? "outgoing"
     : "incoming";

    const chance =
     ["high","medium","low"]
     .includes(item.chance)
     ? item.chance
     : "medium";

    const chanceJP =
     chance === "high"
     ? "高"
     : chance === "medium"
     ? "中"
     : "低";


    /* ======================
       INCOMING
    ====================== */

    if(
     type === "incoming"
    ){

     return `

  <span class="pred-type">

 <div class="answer-en">
 ${esc(item.answer_en)}
 </div>

 <div class="answer-jp">
 ${esc(item.answer_jp)}
 </div>

</div>
`;

    }


    /* ======================
       OUTGOING

       Japanese
       English

       only 2 lines
    ====================== */

    return `

 <div class="pred-top">

  <span class="pred-type">
  🟢 こちらから質問
  </span>

  <span class="question-jp">

  </span>

/* =====================================================
   DOWNLOAD
===================================================== */

function downloadHTML(
 html
){

 const blob =
  new Blob(
   [html],
   {
    type:"text/html;charset=utf-8"
   }
  );

 const url =
  URL.createObjectURL(
   blob
  );

 const a =
  document.createElement(
   "a"
  );

 const now =
  new Date();

 const filename =
  "Meeting_AI_" +
  now
  .toISOString()
  .slice(0,16)
  .replace("T","_")
  .replace(":","-") +
  ".html";

 a.href = url;

 a.download = filename;

 document.body.appendChild(a);

 a.click();

 a.remove();

 setTimeout(
  ()=>{
   URL.revokeObjectURL(url);
  },
  1500
 );

}
