<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Meeting AI</title>

<style>
:root{
 --gap:8px;
 --bg:#0b0f14;
 --panel:#141b24;
 --line:#293342;
 --text:#f3f6fa;
 --muted:#9eacbd;
 --accent:#78a9ff;
 --green:#65d18a;
 --red:#ff8585;
 --yellow:#ffd36a;
}

*{box-sizing:border-box}

html,body{
 margin:0;
 width:100%;
 height:100%;
 background:var(--bg);
 color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 overflow:hidden;
}

#app{
 height:100%;
 display:grid;
 grid-template-rows:52px 1fr;
 gap:var(--gap);
 padding:var(--gap);
}

header{
 display:flex;
 align-items:center;
 gap:7px;
 background:var(--panel);
 border:1px solid var(--line);
 border-radius:12px;
 padding:6px 10px;
}

header strong{
 font-size:16px;
 white-space:nowrap;
}

.status{
 margin-left:auto;
 font-size:12px;
 color:var(--muted);
 white-space:nowrap;
}

input{
 width:150px;
 min-width:90px;
 border:1px solid var(--line);
 background:#0e141c;
 color:white;
 border-radius:8px;
 padding:7px 8px;
 font-size:12px;
}

button{
 border:1px solid var(--line);
 background:#202a37;
 color:white;
 border-radius:9px;
 padding:7px 11px;
 font-size:14px;
}

.primary{background:#245db8}
.stop{background:#713333}
button:disabled{opacity:.45}

main{
 min-height:0;
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:var(--gap);
}

.left{
 min-height:0;
 display:grid;
 grid-template-rows:1fr 1fr;
 gap:var(--gap);
}

.right{
 min-height:0;
 display:grid;
 grid-template-rows:3fr 7fr;
 gap:var(--gap);
}

.panel{
 min-height:0;
 background:var(--panel);
 border:1px solid var(--line);
 border-radius:12px;
 overflow:hidden;
 display:flex;
 flex-direction:column;
}

.title{
 flex:none;
 border-bottom:1px solid var(--line);
 padding:7px 10px;
 font-size:13px;
 font-weight:700;
}

.content{
 flex:1;
 min-height:0;
 padding:9px 10px;
 overflow-y:auto;
 overflow-x:hidden;
 white-space:pre-wrap;
 line-height:1.35;
 font-size:16px;
 -webkit-overflow-scrolling:touch;
}

#translation{
 font-size:18px;
 line-height:1.45;
}

.translation-line{
 margin:0 0 7px 0;
}

.topic{
 margin:0 0 7px 0;
 padding:0 0 7px 0;
 border-bottom:1px solid #222d3a;
}

.topic:last-child{
 border-bottom:none;
}

.topic-title{
 font-weight:700;
 font-size:15px;
 color:#d8e6ff;
 margin-bottom:2px;
}

.topic-description{
 font-size:13px;
 line-height:1.3;
 color:#d7dde6;
}

.muted{
 color:var(--muted);
}

.prediction-card{
 padding:5px 7px;
 margin:0 0 5px 0;
 border-left:3px solid var(--accent);
 background:#101720;
 border-radius:5px;
 line-height:1.22;
}

.prediction-card.high{
 border-left-color:var(--red);
}

.prediction-card.medium{
 border-left-color:var(--yellow);
}

.prediction-card.low{
 border-left-color:var(--green);
}

.chance{
 font-size:10px;
 font-weight:700;
 margin:0 0 2px 0;
 color:var(--muted);
}

.situation{
 font-size:12px;
 margin:0 0 3px 0;
}

.question{
 font-size:13px;
 margin:0 0 3px 0;
}

.answer{
 font-size:15px;
 line-height:1.2;
 font-weight:700;
 color:#c8dbff;
 margin:0 0 2px 0;
}

.jp{
 color:var(--muted);
 font-size:11px;
 line-height:1.2;
 margin:0;
}

@media(orientation:portrait){
 main{
   grid-template-columns:1fr;
   grid-template-rows:1fr 1fr;
 }
}
</style>
</head>

<body>

<div id="app">

<header>
 <strong>🎙 Meeting AI</strong>

 <input
   id="apiKey"
   type="password"
   placeholder="OpenAI API Key"
   autocomplete="off"
 >

 <span class="status" id="status">待機中</span>

 <button class="primary" id="start">開始</button>
 <button class="stop" id="stop" disabled>停止</button>
</header>

<main>

<div class="left">

<section class="panel">
 <div class="title">🎙 English</div>
 <div class="content" id="raw">
   <span class="muted">English transcript...</span>
 </div>
</section>

<section class="panel">
 <div class="title">🇯🇵 リアルタイム日本語訳</div>
 <div class="content" id="translation">
   <span class="muted">日本語訳を順番に追加します。</span>
 </div>
</section>

</div>

<div class="right">

<section class="panel">
 <div class="title">📝 会議概要</div>
 <div class="content" id="summary">
   <span class="muted">
     話題ごとにタイトルと簡単な説明を残します。
   </span>
 </div>
</section>

<section class="panel">
 <div class="title">🔮 発言予測・回答候補</div>
 <div class="content" id="prediction">
   <span class="muted">
     会話に合わせて発言候補を更新します。
   </span>
 </div>
</section>

</div>

</main>
</div>

<script>

const rawEl =
 document.getElementById("raw");

const translationEl =
 document.getElementById("translation");

const summaryEl =
 document.getElementById("summary");

const predictionEl =
 document.getElementById("prediction");

const statusEl =
 document.getElementById("status");

const keyEl =
 document.getElementById("apiKey");

const startBtn =
 document.getElementById("start");

const stopBtn =
 document.getElementById("stop");


let recognition = null;
let running = false;

let transcript = "";
let interimText = "";

let pendingEnglish = [];

let translating = false;
let analyzing = false;

let analysisTimer = null;

let topicHistory = [];
let currentTopicTitle = "";

let lastPredictionTranscript = "";


keyEl.value =
 localStorage.getItem("meeting_ai_key") || "";

keyEl.addEventListener("change",()=>{

 localStorage.setItem(
   "meeting_ai_key",
   keyEl.value.trim()
 );

});


function scrollBottom(el){

 requestAnimationFrame(()=>{

   el.scrollTop =
     el.scrollHeight;

 });

}


function escapeHtml(s){

 return String(s || "")
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");

}


function extractOutput(data){

 if(data.output_text){
   return data.output_text;
 }

 try{

   return data.output
   .flatMap(x=>x.content || [])
   .filter(x=>x.type === "output_text")
   .map(x=>x.text)
   .join("");

 }catch(e){

   return "";

 }

}


async function callOpenAI(prompt){

 const apiKey =
   keyEl.value.trim();

 if(!apiKey){
   throw new Error("APIキーを入力してください");
 }

 const response =
 await fetch(
   "https://api.openai.com/v1/responses",
   {
     method:"POST",

     headers:{
       "Content-Type":"application/json",
       "Authorization":"Bearer " + apiKey
     },

     body:JSON.stringify({
       model:"gpt-5-mini",
       input:prompt
     })
   }
 );

 const data =
   await response.json();

 if(!response.ok){

   throw new Error(
     data?.error?.message ||
     "OpenAI API error"
   );

 }

 return extractOutput(data);

}


function initRecognition(){

 const SR =
   window.SpeechRecognition ||
   window.webkitSpeechRecognition;

 if(!SR){

   statusEl.textContent =
     "音声認識未対応";

   return null;

 }

 const r =
   new SR();

 r.continuous = true;
 r.interimResults = true;
 r.lang = "en-US";


 r.onresult = e => {

   let newFinal = "";
   interimText = "";

   for(
     let i=e.resultIndex;
     i<e.results.length;
     i++
   ){

     const text =
       e.results[i][0].transcript;

     if(e.results[i].isFinal){

       newFinal +=
         text.trim() + ". ";

     }else{

       interimText += text;

     }

   }


   if(newFinal){

     transcript += newFinal;

     pendingEnglish.push(
       newFinal.trim()
     );

     translatePending();

     scheduleAnalysis();

   }


   rawEl.textContent =
     (transcript + " " + interimText)
     .trim();

   scrollBottom(rawEl);

 };


 r.onerror = e => {

   if(e.error === "no-speech"){
     return;
   }

   statusEl.textContent =
     "音声認識: " + e.error;

 };


 r.onend = ()=>{

   if(running){

     setTimeout(()=>{

       try{
         r.start();
       }catch(e){}

     },300);

   }

 };


 return r;

}



async function translatePending(){

 if(translating){
   return;
 }

 if(!pendingEnglish.length){
   return;
 }

 translating = true;

 const batch =
   pendingEnglish.splice(0,3);

 const english =
   batch.join(" ");


 try{

   statusEl.textContent =
     "翻訳中…";

   const prompt = `
Translate the following spoken English into natural Japanese.

Rules:
- Translate accurately.
- Do not summarize.
- Do not add explanations.
- Keep technical terminology accurate.
- The context may involve metallography, sample preparation,
  cutting, mounting, grinding, polishing, etching,
  microscopy, material evaluation and customer testing.
- Return ONLY the Japanese translation.

English:
${english}
`;

   const jp =
     (await callOpenAI(prompt)).trim();


   if(
     translationEl.querySelector(".muted")
   ){
     translationEl.innerHTML = "";
   }


   const div =
     document.createElement("div");

   div.className =
     "translation-line";

   div.textContent = jp;

   translationEl.appendChild(div);

   scrollBottom(translationEl);


   statusEl.textContent =
     running
     ? "音声認識中"
     : "停止";


 }catch(err){

   console.error(err);

   statusEl.textContent =
     "翻訳エラー";

 }finally{

   translating = false;

   if(pendingEnglish.length){

     translatePending();

   }

 }

}



function scheduleAnalysis(){

 clearTimeout(analysisTimer);

 analysisTimer =
 setTimeout(()=>{

   updateMeetingAI();

 },1800);

}



async function updateMeetingAI(){

 if(analyzing){
   return;
 }

 const current =
   transcript.trim();

 if(!current){
   return;
 }

 if(
   current ===
   lastPredictionTranscript
 ){
   return;
 }


 analyzing = true;

 statusEl.textContent =
   "発言予測中…";


 const recent =
   current.length > 9000
   ? current.slice(-9000)
   : current;


 const existingTopics =
   topicHistory
   .map((t,i)=>
     `${i+1}. ${t.title}: ${t.description}`
   )
   .join("\n");


 const prompt = `
You are assisting a Japanese application engineer during an English meeting.

The engineer works with metallographic sample preparation and materials characterization.

Typical topics:
cutting
mounting
grinding
polishing
etching
microscopy
materials evaluation
customer samples
test results
technical conditions
Japanese customer feedback

Analyze the current meeting conversation.

There are TWO tasks.

TASK 1: TOPIC / PRESENTATION OVERVIEW

This is NOT a running summary.

The overview should behave like a presentation agenda or chapter list.

Determine the CURRENT major topic.

Examples:

New Product Introduction
- Explanation of the new product and its main features.

Testing in Japan
- Discussion of sample testing and feedback from Japan.

Next Actions
- Confirmation of additional testing and information sharing.

Only create a new topic when the major subject has clearly changed.

Do NOT create a new topic for every sentence.

Existing topics:
${existingTopics || "None"}

Current topic title:
${currentTopicTitle || "None"}


TASK 2: SPEAKING PREDICTIONS

Predict what the Japanese application engineer may need to say next.

Return 5 useful candidates when possible.

Prioritize:

1. Questions directly addressed to the engineer.
2. Questions about Japan or Japanese customers.
3. Questions about tests or sample results.
4. Technical/application opinions.
5. Useful voluntary comments.

English answers must be:
- short
- easy to pronounce
- natural
- safe
- based only on information actually available.

Never invent:
customer names,
test results,
numbers,
dates,
technical facts.

If information is unknown, use answers such as:

"I need to check the details."

"We have not confirmed that yet."

"I will check it and share the information."


Return ONLY valid JSON:

{
 "topic":{
   "changed":true,
   "title":"Short presentation-style title",
   "description":"One short Japanese sentence describing this major topic"
 },
 "predictions":[
   {
     "chance":"high",
     "situation":"Very short Japanese explanation",
     "question":"Likely English question",
     "answer_short":"Simple English answer",
     "answer_jp":"Japanese meaning"
   }
 ]
}


Recent meeting transcript:

${recent}
`;


 try{

   const output =
     await callOpenAI(prompt);

   const cleaned =
     output
     .replace(/^```json/i,"")
     .replace(/^```/,"")
     .replace(/```$/,"")
     .trim();

   const result =
     JSON.parse(cleaned);


   if(result.topic){

     handleTopic(
       result.topic
     );

   }


   if(
     Array.isArray(
       result.predictions
     )
   ){

     renderPredictions(
       result.predictions
     );

   }


   lastPredictionTranscript =
     current;


   statusEl.textContent =
     running
     ? "音声認識中"
     : "停止";


 }catch(err){

   console.error(err);

   statusEl.textContent =
     "AI解析エラー";

 }finally{

   analyzing = false;

   if(
     transcript.trim() !==
     lastPredictionTranscript
   ){

     scheduleAnalysis();

   }

 }

}



function handleTopic(topic){

 if(!topic.title){
   return;
 }

 const title =
   String(topic.title).trim();

 const description =
   String(
     topic.description || ""
   ).trim();


 /*
 AIが話題変更と判断した時だけ追加。
 同じタイトルは重複させない。
 */

 const sameAsCurrent =
   currentTopicTitle &&
   title.toLowerCase() ===
   currentTopicTitle.toLowerCase();


 if(
   topicHistory.length === 0 ||
   (topic.changed && !sameAsCurrent)
 ){

   const duplicate =
     topicHistory.some(
       t=>
       t.title.toLowerCase() ===
       title.toLowerCase()
     );


   if(!duplicate){

     topicHistory.push({
       title,
       description
     });

     currentTopicTitle =
       title;

     renderTopics();

   }

 }

}



function renderTopics(){

 summaryEl.innerHTML =
   topicHistory
   .map(t=>`

     <div class="topic">

       <div class="topic-title">
         • ${escapeHtml(t.title)}
       </div>

       <div class="topic-description">
         ${escapeHtml(t.description)}
       </div>

     </div>

   `)
   .join("");


 scrollBottom(summaryEl);

}



function renderPredictions(items){

 predictionEl.innerHTML =
   items
   .slice(0,5)
   .map((p,i)=>{

     const chance =
       ["high","medium","low"]
       .includes(p.chance)
       ? p.chance
       : "medium";


     const label =
       chance === "high"
       ? "高"
       : chance === "medium"
       ? "中"
       : "低";


     return `

     <div class="prediction-card ${chance}">

       <div class="chance">
         ${i+1}. 可能性 ${label}
       </div>

       <div class="situation">
         ${escapeHtml(p.situation)}
       </div>

       <div class="question">
         <b>Q:</b>
         ${escapeHtml(p.question)}
       </div>

       <div class="answer">
         ${escapeHtml(p.answer_short)}
       </div>

       <div class="jp">
         ${escapeHtml(p.answer_jp)}
       </div>

     </div>

     `;

   })
   .join("");


 /*
 更新された発言予測の
 一番下＝最新部分を表示
 */

 scrollBottom(
   predictionEl
 );

}



startBtn.onclick = ()=>{

 const apiKey =
   keyEl.value.trim();

 if(!apiKey){

   alert(
     "OpenAI APIキーを入力してください。"
   );

   keyEl.focus();

   return;

 }


 localStorage.setItem(
   "meeting_ai_key",
   apiKey
 );


 recognition =
   recognition ||
   initRecognition();


 if(!recognition){
   return;
 }


 running = true;

 startBtn.disabled = true;
 stopBtn.disabled = false;

 statusEl.textContent =
   "音声認識中";


 try{
   recognition.start();
 }catch(e){}

};



stopBtn.onclick = ()=>{

 running = false;

 clearTimeout(
   analysisTimer
 );

 startBtn.disabled = false;
 stopBtn.disabled = true;

 statusEl.textContent =
   "停止";


 if(recognition){

   try{
     recognition.stop();
   }catch(e){}

 }


 if(pendingEnglish.length){

   translatePending();

 }


 if(transcript.trim()){

   updateMeetingAI();

 }

};

</script>

</body>
</html>
