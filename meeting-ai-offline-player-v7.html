<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Meeting AI Offline Player v7</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0e14;color:#eef2ff}header{height:52px;background:#111725;border-bottom:1px solid #293247;padding:6px 8px;display:flex;gap:6px;align-items:center}button,.file,select{background:#202a3c;color:#fff;border:1px solid #3b4863;border-radius:8px;padding:7px 9px;font-weight:700}.file input{display:none}.grow{flex:1}.status{font-size:11px;color:#aab7cf}.ok{color:#65d18a}.topicbar{height:34px;padding:6px 10px;background:#161e2d;border-bottom:1px solid #293247;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.main{height:calc(100vh - 86px);display:grid;grid-template-columns:50% 50%;grid-template-rows:62% 38%}.panel{min-width:0;min-height:0;padding:7px;border-right:1px solid #293247;border-bottom:1px solid #293247;overflow:hidden}.title{font-weight:800;font-size:13px;margin-bottom:5px}.videoPanel{display:flex;flex-direction:column;padding:0}.videoPanel .media{border-radius:0}.videoPanel .controls{padding:3px 7px 5px;margin-top:0}.seekWrap{padding:4px 8px 0;background:#0b0e14}.seek{width:100%;height:20px;accent-color:#66a3ff}.spoken{color:#ffd54a;font-weight:800}.spokenJP{color:#7ee787;font-weight:800}.media{flex:1;min-height:0;background:#000;border-radius:8px;display:grid;place-items:center;overflow:hidden}video{width:100%;height:100%;object-fit:contain}.controls{min-height:38px;display:flex;gap:5px;align-items:center;margin-top:5px;flex-wrap:wrap}.controls button,.controls select{padding:5px 8px}.muted{color:#91a0ba}.pairs{height:calc(100% - 20px);overflow:auto;background:#111827;border:1px solid #283349;border-radius:8px}.row{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #283349}.cell{padding:7px;font-size:13px;line-height:1.35}.cell:first-child{border-right:1px solid #283349}.jp{color:#d8e4ff}.current{background:#182238}.pred{height:calc(100% - 20px);overflow:auto;font-size:13px;line-height:1.35;background:#111827;border:1px solid #283349;border-radius:8px;padding:8px}.q{font-weight:800;margin-bottom:4px}.answer{color:#b8f1cf;margin-top:7px}.syncVal{min-width:62px;text-align:center;font-size:12px;color:#ffcf70}@media (orientation:portrait){header{height:76px;flex-wrap:wrap;align-content:center}.main{height:calc(100vh - 110px);grid-template-columns:50% 50%;grid-template-rows:34% 38% 28%}.videoPanel{grid-column:1/3;grid-row:1}.translationPanel{grid-column:1/3;grid-row:2}.incomingPanel{grid-column:1;grid-row:3}.outgoingPanel{grid-column:2;grid-row:3}.cell{font-size:12px;padding:6px}.pred{font-size:12px}.controls{min-height:34px}.controls button,.controls select{padding:4px 6px}.media{align-items:start}video{object-position:center top}}
</style></head><body>
<header><b>🎬 Meeting AI Offline</b><span class="grow"></span><label class="file">🎬 動画<input id="videoFile" type="file" accept="video/*"></label><label class="file">📦 練習データ<input id="dataFile" type="file" accept=".json,application/json"></label><span id="status" class="status">動画＋JSONを選択</span></header>
<div class="topicbar"><b>📌 現在の話題：</b> <span id="topic" class="muted">—</span></div>
<div class="main">
<section class="panel videoPanel"><div class="media"><video id="video" playsinline preload="metadata"></video></div><div class="seekWrap"><input id="seek" class="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="再生位置"></div><div class="controls"><button data-skip="-10">↩︎10秒</button><button id="playBtn">▶︎/⏸</button><button data-skip="10">10秒↪︎</button><select id="rate"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select><span id="clock" class="muted">00:00 / 00:00</span><span class="grow"></span><button id="minusSync">同期 −2秒</button><span id="syncVal" class="syncVal">±0秒</span><button id="plusSync">同期 +2秒</button></div></section>
<section class="panel translationPanel"><div class="title">🌐 English ｜ 日本語 <span class="muted">（事前作成データ）</span></div><div id="pairs" class="pairs"><div class="row"><div class="cell muted"><b>English</b></div><div class="cell jp muted"><b>日本語訳</b></div></div></div></section>
<section class="panel incomingPanel"><div class="title">🔴 質問予測 ＋ 回答</div><div id="incoming" class="pred muted">練習データを読み込むと表示されます。</div></section>
<section class="panel outgoingPanel"><div class="title">🟢 こちらから質問</div><div id="outgoing" class="pred muted">練習データを読み込むと表示されます。</div></section>
</div>
<script>
const $=id=>document.getElementById(id),video=$('video');let data=null,items=[],syncOffset=0,videoURL='';
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function fmt(s){s=Math.max(0,Math.floor(Number(s)||0));const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`}
function status(s,ok=false){$('status').textContent=s;$('status').className='status '+(ok?'ok':'')}function valid(d){return d&&d.format==='meeting-ai-practice'&&Array.isArray(d.items)}
$('videoFile').onchange=e=>{const f=e.target.files?.[0];if(!f)return;if(videoURL)URL.revokeObjectURL(videoURL);videoURL=URL.createObjectURL(f);video.src=videoURL;status('✅ 動画OK'+(data?'・練習できます':''),!!data)};
$('dataFile').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();status('練習データ読込中…');r.onload=()=>{try{const d=JSON.parse(String(r.result||''));if(!valid(d))throw Error('Meeting AI用JSONではありません');data=d;
const relative=d.timing==='relative'||d.items.some(x=>Number.isFinite(Number(x.position_start)));
items=d.items.map(x=>({...x,
  _relative:relative,
  start:relative?Number(x.position_start):Number(x.start),
  end:relative?Number(x.position_end):Number(x.end)
})).filter(x=>Number.isFinite(x.start)).sort((a,b)=>a.start-b.start);
for(let i=0;i<items.length;i++){
  if(!Number.isFinite(items[i].end)||items[i].end<=items[i].start)
    items[i].end=items[i+1]?.start??(relative?1:(items[i].start+15));
}
if(!items.length)throw Error('表示できる練習データがありません');
status(`✅ 練習データOK（${items.length}ブロック）`,true);
render()}catch(err){data=null;items=[];status('❌ '+err.message)}};r.readAsText(f,'UTF-8')};
$('playBtn').onclick=()=>video.paused?video.play():video.pause();document.querySelectorAll('[data-skip]').forEach(b=>b.onclick=()=>video.currentTime=Math.max(0,Math.min(video.duration||Infinity,video.currentTime+Number(b.dataset.skip))));$('rate').onchange=e=>video.playbackRate=Number(e.target.value);
function setSync(v){syncOffset=Math.max(-300,Math.min(300,v));$('syncVal').textContent=(syncOffset>0?'+':syncOffset<0?'−':'±')+Math.abs(syncOffset)+'秒';render()}$('minusSync').onclick=()=>setSync(syncOffset-2);$('plusSync').onclick=()=>setSync(syncOffset+2);
function idxAt(){if(!items.length)return-1;
const raw=Math.max(0,video.currentTime+syncOffset);
const relative=items[0]?._relative;
const t=relative?(video.duration&&isFinite(video.duration)?raw/video.duration:0):raw;
let lo=0,hi=items.length-1,ans=-1;
while(lo<=hi){const m=(lo+hi)>>1;if(items[m].start<=t){ans=m;lo=m+1}else hi=m-1}
return ans<0?0:ans}

function highlightProgress(text,progress,cls){
  const raw=String(text??'');
  if(!raw)return '—';
  const parts=raw.split(/(\s+)/);
  const words=parts.filter(x=>x.trim()).length;
  if(!words)return esc(raw);
  const n=Math.max(1,Math.min(words,Math.floor(progress*words)+1));
  let seen=0;
  return parts.map(part=>{
    if(!part.trim())return esc(part);
    seen++;
    return seen<=n?`<span class="${cls}">${esc(part)}</span>`:esc(part);
  }).join('');
}
function unitProgress(u){
  const relative=u._relative;
  const raw=Math.max(0,video.currentTime+syncOffset);
  const t=relative?(video.duration&&isFinite(video.duration)?raw/video.duration:0):raw;
  const span=Math.max(0.000001,u.end-u.start);
  return Math.max(0,Math.min(1,(t-u.start)/span));
}

function render(){if(!items.length)return;const idx=idxAt();if(idx<0)return;const u=items[idx],tail=items.slice(Math.max(0,idx-3),idx+1),prog=unitProgress(u);$('pairs').innerHTML='<div class="row"><div class="cell muted"><b>English</b></div><div class="cell jp muted"><b>日本語訳</b></div></div>'+tail.map((x,i)=>{const cur=i===tail.length-1;return `<div class="row ${cur?'current':''}"><div class="cell">${cur?highlightProgress(x.english,prog,'spoken'):esc(x.english||'—')}</div><div class="cell jp">${cur?highlightProgress(x.japanese,prog,'spokenJP'):esc(x.japanese||'—')}</div></div>`}).join('');$('topic').textContent=u.topic||'—';const a=u.incoming||{},o=u.outgoing||{};$('incoming').innerHTML=`<div class="q">${esc(a.question_jp||'—')}</div><div>${esc(a.question_en||'')}</div><div class="answer"><b>答え：</b> ${esc(a.answer_en||'—')}</div><div>${esc(a.answer_jp||'')}</div>`;$('outgoing').innerHTML=`<div class="q">${esc(o.question_jp||'—')}</div><div>${esc(o.question_en||'')}</div>`}
let seeking=false;
$('seek').oninput=e=>{seeking=true;if(video.duration&&isFinite(video.duration)){video.currentTime=(Number(e.target.value)/1000)*video.duration;$('clock').textContent=`${fmt(video.currentTime)} / ${fmt(video.duration)}`;render()}};
$('seek').onchange=()=>{seeking=false;render()};
video.ontimeupdate=()=>{$('clock').textContent=`${fmt(video.currentTime)} / ${fmt(video.duration)}`;if(!seeking&&video.duration&&isFinite(video.duration))$('seek').value=Math.round(video.currentTime/video.duration*1000);render()};
video.onseeked=render;
video.onloadedmetadata=()=>{$('clock').textContent=`00:00 / ${fmt(video.duration)}`;$('seek').value=0};
</script></body></html>
