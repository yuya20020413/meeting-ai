<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meeting AI - Free Local Practice v7 ETA</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0e14;color:#eef2ff}header{height:50px;background:#111725;border-bottom:1px solid #293247;padding:6px 8px;display:flex;gap:5px;align-items:center}button,.file,select{background:#202a3c;color:#fff;border:1px solid #3b4863;border-radius:8px;padding:7px 8px;font-weight:700}.file input{display:none}.grow{flex:1}.status{font-size:11px;color:#aab7cf}.live{color:#65d18a}.warn{color:#ffcf70}.topicbar{height:36px;padding:7px 10px;background:#161e2d;border-bottom:1px solid #293247;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.main{height:calc(100vh - 86px);display:grid;grid-template-columns:50% 50%;grid-template-rows:62% 38%}.panel{min-width:0;min-height:0;padding:7px;border-right:1px solid #293247;border-bottom:1px solid #293247;overflow:hidden}.title{font-weight:800;font-size:13px;margin-bottom:5px}.videoPanel{display:flex;flex-direction:column}.media{flex:1;min-height:0;background:#000;border-radius:8px;display:grid;place-items:center;overflow:hidden}video{width:100%;height:100%;object-fit:contain}.controls{height:38px;display:flex;gap:5px;align-items:center;margin-top:5px}.controls button,.controls select{padding:5px 8px}.muted{color:#91a0ba}.pairs{height:calc(100% - 20px);overflow:auto;background:#111827;border:1px solid #283349;border-radius:8px}.row{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #283349}.cell{padding:7px;font-size:13px;line-height:1.35}.cell:first-child{border-right:1px solid #283349}.jp{color:#d8e4ff}.pred{height:calc(100% - 20px);overflow:auto;font-size:13px;line-height:1.3;background:#111827;border:1px solid #283349;border-radius:8px;padding:8px}.q{font-weight:800;margin-bottom:4px}.answer{color:#b8f1cf;margin-top:6px}.hidden{display:none}@media (orientation:portrait){header{height:88px;flex-wrap:wrap;align-content:center}.topicbar{height:36px}.main{height:calc(100vh - 124px);display:grid;grid-template-columns:50% 50%;grid-template-rows:38% 34% 28%}.videoPanel{grid-column:1/3;grid-row:1}.translationPanel{grid-column:1/3;grid-row:2}.incomingPanel{grid-column:1;grid-row:3}.outgoingPanel{grid-column:2;grid-row:3}.row{grid-template-columns:1fr 1fr}.media{min-height:0}}
</style></head><body>
<header><b>🎬 Meeting AI</b><span class="grow"></span><label class="file">🎬 動画<input id="videoFile" type="file" accept="video/*,audio/*"></label><button id="prepareBtn">✨ 無料で練習データ作成</button><button id="saveBtn" disabled>💾 JSON保存</button><span id="status" class="status">OpenAI不要・残り時間表示 v7</span></header>
<div class="topicbar"><b>📌 現在の話題</b> <span id="topic" class="muted">動画を選択してください</span></div>
<div class="main">
<section class="panel videoPanel"><div class="title">🎬 動画</div><div class="media"><video id="video" controls playsinline></video></div><div class="controls"><button data-skip="-10">↩︎10秒</button><button id="playBtn">▶︎/⏸</button><button data-skip="10">10秒↪︎</button><select id="rate"><option>.75</option><option selected>1</option><option>1.25</option><option>1.5</option></select><span id="clock" class="muted">00:00 / 00:00</span></div></section>
<section class="panel translationPanel"><div class="title">🌐 English / 練習用表示 <span id="sync" class="muted"></span></div><div id="pairs" class="pairs"><div class="row"><div class="cell muted"><b>English</b></div><div class="cell jp muted"><b>Dictation</b></div></div></div></section>
<section class="panel incomingPanel"><div class="title">🔴 聞き取り練習</div><div id="incoming" class="pred muted">文字起こし後、現在位置の英文を穴埋め問題にします。</div></section>
<section class="panel outgoingPanel"><div class="title">🟢 発話練習</div><div id="outgoing" class="pred muted">英文を短く区切ってシャドーイング用に表示します。</div></section>
</div>
<script type="module">
const $=id=>document.getElementById(id),video=$('video'),statusEl=$('status');
let units=[],file=null,transcriber=null,audioCtx=null,sourceNode=null,processor=null,silentGain=null;
let pcmParts=[],pcmSamples=0,segmentStart=0,processing=false,stopRequested=false;
let jobStartedAt=0,processedAudioSec=0;
const SEGMENT_SEC=20;
const setStatus=s=>statusEl.textContent=s;
const fmt=s=>{s=Math.max(0,Math.floor(s||0));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const etaText=()=>{if(!jobStartedAt||processedAudioSec<5||!isFinite(video.duration))return '残り時間を計算中…';const elapsed=(performance.now()-jobStartedAt)/1000;const speed=processedAudioSec/Math.max(elapsed,.1);const remain=Math.max(0,(video.duration-processedAudioSec)/Math.max(speed,.01));return `推定残り ${fmt(remain)}（${speed.toFixed(2)}×）`};
const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

$('videoFile').onchange=e=>{file=e.target.files?.[0];if(!file)return;video.src=URL.createObjectURL(file);units=[];$('saveBtn').disabled=true;setStatus('✅ 動画OK。「無料で練習データ作成」を押してください');$('topic').textContent=file.name};
$('playBtn').onclick=()=>video.paused?video.play():video.pause();
document.querySelectorAll('[data-skip]').forEach(b=>b.onclick=()=>video.currentTime=Math.max(0,Math.min(video.duration||0,video.currentTime+Number(b.dataset.skip))));
$('rate').onchange=e=>video.playbackRate=Number(e.target.value);

async function loadModel(){
 if(transcriber)return transcriber;
 setStatus('⏳ 初回のみ無料AIモデルを読み込み中…');
 const {pipeline,env}=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2');
 env.allowLocalModels=false;
 env.useBrowserCache=true;
 transcriber=await pipeline('automatic-speech-recognition','onnx-community/whisper-tiny.en',{dtype:'q8'});
 return transcriber;
}
function resample(input,inRate,outRate=16000){
 if(inRate===outRate)return input;
 const ratio=inRate/outRate,len=Math.floor(input.length/ratio),out=new Float32Array(len);
 for(let i=0;i<len;i++){const p=i*ratio,a=Math.floor(p),b=Math.min(a+1,input.length-1),f=p-a;out[i]=input[a]*(1-f)+input[b]*f}
 return out;
}
function concatParts(parts,total){const out=new Float32Array(total);let o=0;for(const p of parts){out.set(p,o);o+=p.length}return out}
function makeCloze(s){const w=s.split(/\s+/);return w.map((x,i)=>(i%5===3&&x.length>3)?'_____':x).join(' ')}
function appendUnits(chunks,base){
 const made=(chunks||[]).map((c,i)=>{const a=c.timestamp?.[0]??i*5,b=c.timestamp?.[1]??((i+1)*5),text=(c.text||'').trim();return{i:units.length+i,start:base+a,end:base+b,text,cloze:makeCloze(text)}}).filter(x=>x.text);
 units.push(...made); if(units.length){$('saveBtn').disabled=false;renderAt(Math.max(0,base));}
}
async function transcribeBuffered(final=false){
 if(processing||pcmSamples===0)return;
 processing=true; video.pause();
 const localParts=pcmParts,localSamples=pcmSamples,base=segmentStart;
 pcmParts=[];pcmSamples=0;
 try{
  const raw=concatParts(localParts,localSamples),audio=resample(raw,audioCtx.sampleRate,16000);
  setStatus(`⏳ ${fmt(base)}〜${fmt(base+raw.length/audioCtx.sampleRate)} を端末内で文字起こし中…`);
  const pipe=await loadModel();
  const out=await pipe(audio,{chunk_length_s:20,stride_length_s:2,return_timestamps:true,language:'en',task:'transcribe'});
  appendUnits(out.chunks?.length?out.chunks:[{text:out.text,timestamp:[0,raw.length/audioCtx.sampleRate]}],base);
  segmentStart=base+raw.length/audioCtx.sampleRate; processedAudioSec=segmentStart;
  setStatus(`✅ ${fmt(segmentStart)} / ${fmt(video.duration)} ・ ${etaText()} ・ ${units.length}区間`);
 }catch(e){console.error(e);setStatus('❌ 文字起こしエラー: '+String(e.message||e).slice(0,120));stopRequested=true}
 processing=false;
 if(final||stopRequested){await finishCapture();return}
 try{await video.play()}catch(e){setStatus('▶︎ 再生ボタンを押して続行してください')}
}
async function setupCapture(){
 if(audioCtx)return;
 audioCtx=new (window.AudioContext||window.webkitAudioContext)();
 sourceNode=audioCtx.createMediaElementSource(video);
 processor=audioCtx.createScriptProcessor(4096,2,1);
 silentGain=audioCtx.createGain(); silentGain.gain.value=0;
 sourceNode.connect(processor); sourceNode.connect(audioCtx.destination); processor.connect(silentGain); silentGain.connect(audioCtx.destination);
 processor.onaudioprocess=e=>{
  if(stopRequested||processing||video.paused)return;
  const l=e.inputBuffer.getChannelData(0),r=e.inputBuffer.numberOfChannels>1?e.inputBuffer.getChannelData(1):l,m=new Float32Array(l.length);
  for(let i=0;i<l.length;i++)m[i]=(l[i]+r[i])*0.5;
  pcmParts.push(m);pcmSamples+=m.length;
  if(pcmSamples/audioCtx.sampleRate>=SEGMENT_SEC)transcribeBuffered(false);
 };
}
async function finishCapture(){
 stopRequested=true; video.pause();
 if(processor){processor.onaudioprocess=null;try{processor.disconnect()}catch{}}
 setStatus(units.length?`✅ 完成：${units.length}区間。OpenAI API使用なし`:'⚠️ 音声を認識できませんでした');
 $('prepareBtn').disabled=false;$('prepareBtn').textContent='✨ 無料で練習データ作成';
 if(units.length)$('saveBtn').disabled=false;
}
video.addEventListener('ended',async()=>{if(pcmSamples>0)await transcribeBuffered(true);else if(!processing)await finishCapture()});
$('prepareBtn').onclick=async()=>{
 if(!file){alert('先に動画を選択してください');return}
 if(processing)return;
 try{
  $('prepareBtn').disabled=true;$('prepareBtn').textContent='⏳ 作成中';stopRequested=false;units=[];pcmParts=[];pcmSamples=0;segmentStart=0;processedAudioSec=0;jobStartedAt=performance.now();
  await loadModel(); await setupCapture(); if(audioCtx.state==='suspended')await audioCtx.resume();
  video.currentTime=0;video.playbackRate=1;
  setStatus(`▶︎ ${SEGMENT_SEC}秒ずつ処理中・残り時間を計算します。画面を閉じないでください`);
  await video.play();
 }catch(e){console.error(e);setStatus('❌ '+String(e.message||e).slice(0,140));$('prepareBtn').disabled=false;$('prepareBtn').textContent='✨ 無料で練習データ作成'}
};
function indexAt(t){let i=units.findIndex(x=>t<(x.end??Infinity));return i<0?Math.max(0,units.length-1):i}
function renderAt(t){if(!units.length)return;const idx=indexAt(t),tail=units.slice(Math.max(0,idx-3),idx+1),u=units[idx];$('pairs').innerHTML='<div class="row"><div class="cell muted"><b>English</b></div><div class="cell jp muted"><b>Dictation</b></div></div>'+tail.map(x=>`<div class="row"><div class="cell">${esc(x.text)}</div><div class="cell jp">${esc(x.cloze)}</div></div>`).join('');$('topic').textContent=`${fmt(u.start)}–${fmt(u.end)} / Listening Practice`;$('incoming').innerHTML=`<div class="q">聞こえた英文を完成させる</div><div>${esc(u.cloze)}</div><div class="answer">正解：${esc(u.text)}</div>`;$('outgoing').innerHTML=`<div class="q">Shadowing</div><div>${esc(u.text)}</div><div class="answer">この区間を再生して、0.75× → 1×で追いかけて発音</div>`;$('sync').textContent='（端末内データ）'}
video.ontimeupdate=()=>{$('clock').textContent=`${fmt(video.currentTime)} / ${fmt(video.duration)}`;renderAt(video.currentTime)};video.onseeked=()=>renderAt(video.currentTime);
$('saveBtn').onclick=()=>{const data={version:2,source:file?.name||'',created:new Date().toISOString(),mode:'local-free-whisper-tiny-en-streamed-20s',units};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(file?.name||'meeting').replace(/\.[^.]+$/,'')+'_practice.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></body></html>
